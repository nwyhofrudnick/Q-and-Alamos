  { question: "The physicist Egon Bretscher worked at Los Alamos with the British Mission and later returned to Britain to work at Harwell. Harwell was Britain's main post-war nuclear research establishment. Where is Harwell located?", choices: ["Near Windscale in Cumbria", "Near Aldermaston in Berkshire", "In Oxfordshire, south of Oxford"], correct: 1 },
  { question: "The physicist Egon Bretscher, working at the Cavendish with Chadwick in 1940, independently predicted what key fact about reactor-bred plutonium?", choices: ["That Pu-240 contamination would make gun-type designs impossible", "That plutonium-239 produced in a uranium reactor would be fissile and usable in a bomb", "That the critical mass of plutonium would be smaller than that of uranium-235"], correct: 1 },
  { question: "The physicist Emilio Segrè confirmed the identity of element 43 (technetium) in 1937. Why had this element never been found in nature?", choices: ["All its isotopes are radioactive with half-lives shorter than the age of the Earth", "It exists on Earth but only in ultra-trace amounts in uranium ores where it is created by spontaneous fission", "It was prevented from forming during nucleosynthesis by the stability gap between molybdenum and ruthenium"], correct: 0 },
  { question: "The physicist Emilio Segrè won the Nobel Prize in Physics in 1959 for the discovery of the antiproton, sharing with whom?", choices: ["Luis Alvarez", "Owen Chamberlain", "Ernest Lawrence"], correct: 1 },
  { question: "The physicist Emilio Segrè, who co-discovered the antiproton at the Bevatron, had earlier worked with Fermi in Rome and with Lawrence at Berkeley. He escaped Nazi persecution because he was in what country when Mussolini enacted racial laws in 1938?", choices: ["France, where he was attending a conference", "England, where he was on a research visit to Rutherford's lab", "The United States, where he was on a fellowship"], correct: 2 },
  { question: "The physicist Emilio Segrè, who measured the Pu-240 spontaneous fission rate, made this measurement in the summer of 1944. The measurement proved gun-type plutonium was impossible. How quickly did Los Alamos switch priorities to implosion after this discovery?", choices: ["Within weeks", "Within months", "Just under a year"], correct: 0 },
  { question: "The physicist Emilio Segrè was technically employed as what when he did the key Pu-240 measurements?", choices: ["A senior research scientist", "A research associate", "An independent contractor"], correct: 1 },
  { question: "The physicist Enrico Fermi designed a thought experiment about extraterrestrial life at a Los Alamos lunch in 1950, asking 'Where is everybody?' This became known as Fermi's Paradox. The question asked why, if intelligent life is common, we see no evidence of it. What was the occasion for this conversation?", choices: ["A discussion of a New Yorker cartoon about flying saucers stealing trash cans", "A faculty seminar at Los Alamos on the search for extraterrestrial radio signals", "A conversation triggered by a Life Magazine article on UFO sightings"], correct: 0 },
  { question: "The physicist Enrico Fermi estimated that CP-1 would reach criticality at a specific moment during its startup on December 2, 1942. He had made this estimate from extrapolating neutron multiplication measurements over many subcritical loadings of the pile. His estimate was accurate to within what?", choices: ["Within about 5 minutes", "Within about one hour", "He missed by a full day"], correct: 0 },
  { question: "The physicist Enrico Fermi famously estimated things without precise data by using what method, now named after him?", choices: ["Fermi estimation", "Fermi interpolation", "Fermi scaling"], correct: 0 },
  { question: "The physicist Enrico Fermi moved from Italy to the United States in 1938 after receiving the Nobel Prize. He traveled directly to Stockholm for the ceremony and then did not return to Italy. Why?", choices: ["His wife Laura was Jewish and faced persecution under Mussolini's racial laws", "He had been offered a faculty position at Columbia", "He feared arrest by Italian authorities who suspected him of anti-fascist activities"], correct: 0 },
  { question: "The physicist Enrico Fermi received the Nobel Prize in Stockholm in December 1938. He did not return to Italy but traveled directly to the United States. On the ship crossing the Atlantic, what did Fermi reportedly do to occupy himself?", choices: ["Wrote papers on neutron physics that he could not publish in Italy", "Taught himself English from books he had brought with him", "Designed the conceptual layout of what would become CP-1"], correct: 0 },
  { question: "The physicist Enrico Fermi was famously competitive at physical activities. At Los Alamos he organized a series of challenges among the physicists. In what physical activity was he said to be particularly skilled?", choices: ["Long-distance running ", "Tennis", "Mountain hiking"], correct: 1 },
  { question: "The physicist Enrico Fermi won a national mathematics prize in Italy at age 17. He applied to the Scuola Normale Superiore in Pisa, where his entrance exam essay impressed the examiner so much that the examiner tracked him down to meet him. What was the essay about?", choices: ["The mathematics of partial differential equations as applied to the vibrating string", "Quantum mechanics in space compared to on Earth", "The solution of the three-body gravitational problem"], correct: 1 },
  { question: "The physicist Enrico Fermi won the Nobel in 1938 officially for 'the existence of new radioactive elements produced by neutron irradiation.' This was ironic because in 1934-38 he had actually been observing fission without recognizing it. What was the telltale clue he missed?", choices: ["The energy of the emitted particles was far too high for simple neutron capture reactions", "The 'new elements' he had identified had chemical properties identical to known elements in the middle of the periodic table", "The products decayed far too quickly for heavy transuranic elements"], correct: 2 },
  { question: "The physicist Enrico Fermi, after the war, wrote no more major theoretical papers. Instead he focused on what activity that he had always loved?", choices: ["He devoted himself to teaching", "He returned to experimental work", "He wrote a comprehensive textbook on nuclear physics"], correct: 0 },
  { question: "The physicist Enrico Fermi, while working at the University of Rome in the early 1930s, was given the nickname 'the Pope' by his group. Why?", choices: ["Because he had an infallible memory for physical data and his pronouncements on physics were considered definitive by the group", "Because he was the only one in the group who knew Latin, useful for reading ancient scientific texts in the Vatican Library", "Because his initials E.F. stood for 'Eternal Father' in the group's internal joke system about nuclear forces"], correct: 2 },
  { question: "The physicist Enrico Fermi's estimate of the Trinity yield using paper scraps gave him about 10 kilotons. The actual yield was about 21 kilotons. If Fermi was using the peak shockwave overpressure to estimate yield, what formula would he have used?", choices: ["Yield ∝ (overpressure)³/² × distance² — a version of the Hopkinson-Cranz blast scaling law", "Yield ∝ (velocity of paper displacement)² — converting kinetic energy of paper to total blast energy", "Yield ∝ distance³ × (overpressure)²/³ — the Sachs scaling law relating peak overpressure to distance and yield"], correct: 2 },
  { question: "The physicist Enrico Fermi's first major contribution to physics, before his neutron experiments, was the theory of beta decay in 1934. What did this theory do?", choices: ["It explained the radioactive decay of plutonium-239 and its production of Pu-240", "It introduced the neutrino as a real physical particle and calculated the spectrum of electron energies in beta decay using a new force", "It calculated the cross section for neutron capture in heavy nuclei that made reactor design possible"], correct: 1 },
  { question: "The physicist Enrico Fermi's theory of beta decay introduced a new fundamental force: the weak interaction. The strength of this force is characterized by Fermi's constant GF. Its value is approximately what?", choices: ["About 10⁻⁵ per proton mass squared (GF/ℏ³c³ ≈ 1.17 × 10⁻⁵ GeV⁻²)", "About 10⁻³ per proton mass squared", "About 10⁻⁸ per proton mass squared"], correct: 2 },
  { question: "The physicist Enrico Fermi's 'two-group theory' for neutron diffusion divides neutrons into two energy categories. This simplified model was crucial for what practical task at Hanford?", choices: ["Calculating the plutonium production rate in the B-reactor as a function of fuel irradiation history", "Predicting the reactor power level needed to maintain criticality as xenon buildup occurred", "Designing the reactor shielding needed to protect workers from fast and thermal neutron exposure"], correct: 1 },
  { question: "The physicist Enrico Fermi's 'Via Panisperna Boys' in Rome discovered slow neutron enhancement in 1934. Fermi thought the paraffin moderator was slowing neutrons to thermal energies. Which specific reaction channel did slow neutrons enhance most dramatically in their experiments?", choices: ["Neutron capture followed by gamma ray emission", "Neutron-induced fission of actinides", "Neutron-proton scattering that increased penetrating power"], correct: 0 },
  { question: "The physicist Eric Cornell and Carl Wieman cooled rubidium atoms to create the first BEC using what cooling technique?", choices: ["Dilution refrigeration", "Laser cooling followed by evaporative cooling ", "Adiabatic demagnetization"], correct: 0 },
  { question: "The physicist Ernest Orlando Lawrence promoted the electromagnetic separation (calutron) method for uranium enrichment strongly. Lawrence's Y-12 calutron plant at Oak Ridge eventually produced the U-235 for Little Boy. In what year did Y-12 begin producing weapons-grade U-235?", choices: ["1943", "1944", "1945"], correct: 1 },
  { question: "The physicist Ernest Orlando Lawrence won the Nobel Prize in Physics in 1939 for inventing the cyclotron. What specific property of charged particles does the cyclotron exploit?", choices: ["Quantum tunneling through the magnetic containment field", "De Broglie wave interference between the particle and the accelerating voltage", "The fact that a charged particle moving in a uniform magnetic field travels in a circle with a period independent of its speed"], correct: 2 },
  { question: "The physicist Ernest Orlando Lawrence, founder of the Radiation Laboratory (Rad Lab) at Berkeley, built a series of increasingly powerful cyclotrons. His largest wartime cyclotron, the 184-inch synchrocyclotron, was completed in what year?", choices: ["1942", "1946", "1950"], correct: 1 },
  { question: "The physicist Ernest Rutherford conducted the first artificial nuclear transmutation in 1919. What was the nuclear reaction?", choices: ["¹⁴N + ⁴He → ¹²C + ²He (Carbon-12 and a doubly charged helium)", "¹⁴N + ⁴He → ¹⁸F → ¹⁷O + ¹H (Fluorine-18 intermediate decaying to oxygen-17 and proton)", "¹⁴N + ⁴He → ¹⁷O + ¹H (Oxygen-17 and a proton)"], correct: 2 },
  { question: "The physicist Ernest Rutherford famously described the energy available from nuclear reactions in 1933 as 'moonshine.' He said that 'anyone who looked for a source of power in the transformation of the atoms was talking moonshine.' He died in what year, just before his prediction was spectacularly falsified?", choices: ["1944, with the Trinity test", "1940, before the war began", "1937, a year before Hahn and Strassmann discovered fission"], correct: 2 },
  { question: "The physicist Ernest Rutherford, who discovered the nucleus in 1911 by the gold foil alpha scattering experiment, interpreted the result by analogy with what mechanical system?", choices: ["A gyroscope", "A planetary system", "A crystalline lattice"], correct: 2 },
  { question: "The physicist Ernest Titterton, Australian member of the British Mission at Los Alamos, was present at Trinity and later at Pacific tests. He became one of Australia's foremost nuclear scientists. At what Australian institution was he a professor?", choices: ["University of Sydney", "The Australian National University", "University of Melbourne"], correct: 1 },
  { question: "The physicist Ernest Titterton, Australian member of the British Mission, witnessed both the Trinity test and Pacific tests. He later became chairman of the Australian Atomic Weapons Tests Safety Committee, which authorized British nuclear tests in Australia at Maralinga in the 1950s. What was Maralinga?", choices: ["A coastal town in South Australia where offshore tests were conducted", "A remote desert site in South Australia used for British nuclear weapon tests", "A small island off northwestern Australia used for naval nuclear tests"], correct: 2 },
  { question: "The physicist Ernst Stueckelberg independently developed many ideas that Feynman and Schwinger made famous, including Feynman diagrams, the renormalization group, and the concept of the S-matrix, but received little credit because he published in French. He worked at what institution?", choices: ["The École Polytechnique Fédérale de Lausanne", "The University of Geneva", "The University of Bern"], correct: 2 },
  { question: "The physicist Erwin Schrödinger derived his wave equation by quantizing the classical Hamilton-Jacobi equation. The Hamilton-Jacobi equation describes classical mechanics using what function?", choices: ["The Lagrangian", "The Hamiltonian", "The action function S"], correct: 2 },
  { question: "The physicist Erwin Schrödinger developed his wave equation in December 1925 to January 1926, reportedly while on vacation in Arosa, Switzerland. He was inspired by what comment made by whom at a seminar?", choices: ["A comment by Einstein at Berlin that de Broglie's matter waves deserved proper wave mechanics treatment", "A comment by Debye in Zurich that de Broglie's thesis deserved a proper wave equation", "A comment by Bohr in Copenhagen that quantum jumps required a continuous wave description to be physically meaningful"], correct: 2 },
  { question: "The physicist Erwin Schrödinger fled Austria after the Nazi annexation (Anschluss) in 1938. He eventually settled at what institution, which was created for him?", choices: ["The Cavendish Laboratory at Cambridge", "The Dublin Institute for Advanced Studies ", "The Institute for Advanced Study in Princeton"], correct: 1 },
  { question: "The physicist Erwin Schrödinger proposed his famous cat thought experiment in 1935 in response to what paper?", choices: ["Bohr's complementarity paper", "The Einstein-Podolsky-Rosen paper", "Heisenberg's uncertainty principle paper"], correct: 2 },
  { question: "The physicist Erwin Schrödinger published 'What Is Life?' in 1944, based on lectures in Dublin. This book influenced the founders of molecular biology, including Watson and Crick. Schrödinger proposed that the gene must be an 'aperiodic crystal.' What did he mean?", choices: ["That genes must be unstable crystals that can change form under radiation", "That the genetic material must store information through a non-repeating arrangement of atoms", "That genes must be crystalline structures that can be copied exactly during cell division"], correct: 2 },
  { question: "The physicist Erwin Schrödinger wrote 'What Is Life?' in 1944, which influenced Watson and Crick. He proposed that the gene must store information in an 'aperiodic crystal.' He also proposed that quantum mechanical uncertainty might be relevant to biological mutations. The key connection he drew was that what could cause mutations?", choices: ["Radiation from natural radioactive decay in the Earth's crust constantly irradiating biological tissue", "Thermal fluctuations at biological temperatures", "Cosmic ray particle hits on DNA"], correct: 2 },
  { question: "The physicist Erwin Schrödinger, in addition to quantum mechanics, worked on problems in general biology and the philosophy of consciousness. His view in 'What is Life?' and 'Mind and Matter' was that consciousness was what?", choices: ["An emergent property of sufficient computational complexity", "A quantum mechanical phenomenon", "Singular and universal"], correct: 2 },
  { question: "The physicist Erwin Schrödinger's wave mechanics formulation and Heisenberg's matrix mechanics formulation of quantum mechanics were initially thought to be different theories. Who proved they were mathematically equivalent?", choices: ["Niels Bohr", "Paul Dirac", "John von Neumann"], correct: 2 },
  { question: "The physicist Eugene Wigner developed what major concept in nuclear and particle physics involving the mathematical symmetry of physical laws?", choices: ["Gauge symmetry", "Broken symmetry", "Symmetry principles in quantum mechanics"], correct: 2 },
  { question: "The physicist Eugene Wigner won the Nobel Prize in Physics in 1963 'for his contributions to the theory of the atomic nucleus and the elementary particles, particularly through the discovery and application of fundamental symmetry principles.' What is the 'Wigner-Eckart theorem'?", choices: ["A theorem predicting the relative intensities of spectral lines based on the symmetry of the initial and final states", "A theorem giving selection rules and relative matrix elements for operators that transform as tensors under a symmetry group", "A theorem showing that all measurable quantities in quantum mechanics must commute with the Hamiltonian"], correct: 2 },
  { question: "The physicist Eugene Wigner, who conceptually designed the Hanford reactor, and his sister Margit married two important figures in physics. Wigner's sister Margit married whom?", choices: ["Aage Bohr", "Paul Dirac", "Enrico Fermi"], correct: 1 },
  { question: "The physicist Felix Bloch, who won the Nobel for NMR, was the first director of CERN. How long did he serve before resigning?", choices: ["One year", "Two years", "Five years"], correct: 0 },
  { question: "The physicist Francis Low co-developed with Gell-Mann the 'renormalization group' concept in 1954. What does the renormalization group describe physically?", choices: ["The mathematical procedure for removing infinities from QED calculations", "How physical parameters like coupling constants change with the energy scale at which measurements are made", "The group of mathematical transformations that leaves quantum field theory equations invariant"], correct: 1 },
  { question: "The physicist François Englert co-discovered the Higgs mechanism with the late Robert Brout. Their paper was published one month before Higgs's in 1964. Englert spent most of his career at what institution?", choices: ["Institut des Hautes Études Scientifiques (IHES) in Paris", "Université Libre de Bruxelles (ULB) in Belgium", "CERN in Geneva"], correct: 1 },
  { question: "The physicist François Englert, who shared the 2013 Nobel with Higgs for the Higgs mechanism, had his work published the same day as Higgs's paper. A third independent proposal was made by Guralnik, Hagen, and Kibble. Why did these three not share the Nobel?", choices: ["Their paper was published later than Higgs's and Englert-Brout's, though independently", "The Nobel Prize is awarded to at most three people", "The GHK paper made slightly different predictions that were not confirmed by the LHC"], correct: 0 },
  { question: "The physicist Frank Wilczek named his doctoral thesis 'Ultraviolet Behavior of Non-Abelian Gauge Theories,' jointly with Gross. The paper was rejected by Physical Review Letters and then published where?", choices: ["Physical Review D", "Physical Review Letters", "Nuclear Physics B"], correct: 1 },
  { question: "The physicist Frank Wilczek won the Nobel for asymptotic freedom while he was a graduate student under David Gross at Princeton. He later became a professor at what institution?", choices: ["Princeton", "Harvard", "MIT"], correct: 0 },
  { question: "The physicist Frederic de Hoffmann worked with Teller at Los Alamos on thermonuclear calculations. After founding General Atomics, he oversaw the development of TRIGA reactors. What makes TRIGA reactors uniquely safe?", choices: ["They operate at sub-critical levels and can never achieve a chain reaction without additional neutron injection", "They are moderated by a uranium-zirconium hydride fuel that has a large negative temperature coefficient ", "They use liquid sodium cooling that solidifies if the reactor overheats, physically blocking the coolant flow and shutting down the reaction"], correct: 2 },
  { question: "The physicist Frederic Joliot-Curie and his wife Irène Joliot-Curie were awarded the Nobel Prize in Chemistry in 1935 for discovering artificial radioactivity. What did they discover specifically?", choices: ["That gamma radiation from natural sources could create radioactive isotopes in target materials", "That neutron bombardment of stable elements could make them radioactive", "That stable elements could be made radioactive by bombarding them with alpha particles"], correct: 2 },
  { question: "The physicist Frederic Joliot-Curie was a member of the French Communist Party. After France's liberation, he became head of France's nuclear research. Charles de Gaulle eventually dismissed him from this role in 1950 because of what?", choices: ["He publicly stated he would never help build an atomic bomb for France", "He was sharing French nuclear research data with Soviet scientists through Communist Party channels", "He publicly opposed France's decision to allow U.S. nuclear weapons on French soil through NATO"], correct: 0 },
  { question: "The physicist Frederick Reines, who co-detected the neutrino at Savannah River in 1956 with Clyde Cowan, received the Nobel Prize in Physics in what year?", choices: ["1985", "1990", "1995"], correct: 2 },
  { question: "The physicist Frederick Soddy, who worked with Rutherford in the early 1900s, coined what term?", choices: ["Radioactive", "Decay", "Isotope"], correct: 2 },
  { question: "The physicist Freeman Dyson made an important contribution to statistical mechanics that physicists now call the 'Dyson conjecture.' It is a conjecture in random matrix theory. What was Dyson's physical motivation for studying random matrices?", choices: ["Modeling the random neutron cross sections of heavy nuclei at high excitation energy", "Modeling the random distribution of quantum errors in Feynman's path integral formulation", "Modeling the random walk of particles in a quantum medium"], correct: 1 },
  { question: "The physicist Freeman Dyson proposed the 'Dyson sphere' — a hypothetical megastructure surrounding a star to capture its energy output. He also developed the 'Dyson series' in QED. What does the Dyson series describe?", choices: ["A perturbation expansion of the S-matrix in quantum field theory ", "A classification system for technological civilizations based on their energy consumption", "A method for summing divergent series in quantum mechanics that arise from the vacuum energy"], correct: 2 },
  { question: "The physicist Freeman Dyson proposed unifying Schwinger's, Feynman's, and Tomonaga's approaches to QED in a landmark 1949 paper. He was at the Institute for Advanced Study in Princeton and traveled by Greyhound bus to get there. His paper proved that all three approaches were what?", choices: ["Mathematically distinct but physically equivalent theories for non-relativistic quantum mechanics", "Mathematically equivalent because they all computed the same S-matrix", "Complementary but not equivalent"], correct: 1 },
  { question: "The physicist Freeman Dyson said that Oppenheimer's death was the end of an era in American physics. What specific quality did Dyson attribute to Oppenheimer that he said was lost?", choices: ["The ability to combine deep technical mastery with genuine philosophical concern for the implications of science", "The political influence of scientists", "The ability to attract the best minds from Europe to the United States"], correct: 1 },
  { question: "The physicist Freeman Dyson worked at RAF Bomber Command during WWII before attending Cambridge and then Cornell. His wartime work involved what?", choices: ["Radar countermeasures where he designed jamming equipment for British bombers", "Statistical analysis of bombing missions where he found that experienced bomber crews were not safer than inexperienced ones, suggesting survival was random regardless of skill", "Navigation systems where he developed a celestial navigation method for bombers flying without radar due to radio silence requirements"], correct: 1 },
  { question: "The physicist Freeman Dyson, who later worked at the Institute for Advanced Study, made contributions to quantum electrodynamics and also later worked on Project Orion, a spaceship concept that would be propelled by what?", choices: ["Nuclear fusion rocket engines", "Laser-driven light sails", "Exploding nuclear bombs behind a pusher plate"], correct: 2 },
  { question: "The physicist Freeman Dyson's incorrect critique of climate models was based on what specific technical argument?", choices: ["That global climate models used a grid resolution too coarse to model the clouds that dominate climate feedback, making their projections unreliable", "That atmospheric CO2 was beneficial to plant growth and that biosphere feedbacks were underestimated in all climate models", "That the solar forcing was underestimated"], correct: 2 },
  { question: "The physicist Freeman Dyson's last book, published in 2018, was called 'Maker of Patterns: An Autobiography Through Letters.' It covered his life from his time at Cambridge to the 21st century. What was distinctive about this book's format?", choices: ["It was written entirely in letters", "It interspersed scientific papers with personal letters", "It consisted of responses to questions from his grandchildren"], correct: 1 },
  { question: "The physicist Freeman Dyson's Project Orion was cancelled because of what?", choices: ["The Partial Test Ban Treaty of 1963, which prohibited nuclear explosions in the atmosphere and space", "A congressional decision that the cost was prohibitive compared to chemical rockets", "A safety analysis showing the radiation from the nuclear pulses would be lethal to the crew"], correct: 0 },
  { question: "The physicist Fritz Zwicky proposed dark matter in 1933 by studying the velocities of galaxies in the Coma Cluster. His calculation showed that the visible matter was insufficient to hold the cluster together gravitationally. The term he used was not 'dark matter' but what?", choices: ["'Missing mass'", "'Dunkle Materie'", "'Hidden mass'"], correct: 1 },
  { question: "The physicist George Gamow proposed in 1948 with Alpher and Herman that the Big Bang would produce a specific temperature of residual radiation. They predicted approximately what temperature?", choices: ["About 5 Kelvin", "About 15 Kelvin", "About 25 Kelvin"], correct: 0 },
  { question: "The physicist George Gamow worked at George Washington University and is famous for his popular science books. His 'Mr. Tompkins' series depicted a character experiencing relativistic and quantum effects. Mr. Tompkins's first adventure involved which relativistic effect?", choices: ["Length contraction — Mr. Tompkins rides a bicycle at near-light speed and sees the city contracted", "Time dilation — Mr. Tompkins falls asleep in a physics lecture and dreams of a world where time slows for moving objects", "Mass increase — Mr. Tompkins tries to accelerate his car to light speed and finds it infinitely heavy"], correct: 0 },
  { question: "The physicist George Gamow, who had fled the Soviet Union by attempting a daring kayak crossing of the Black Sea and failing due to storms in 1932, eventually defected successfully by what means?", choices: ["He and his wife drove across the Finnish border in a borrowed car during a diplomatic reception", "He received permission to attend the 1933 Solvay Conference in Brussels and simply did not return to the USSR", "He was on a Soviet cientific mission to Paris and contacted the French government for asylum"], correct: 1 },
  { question: "The physicist George Gamow, who worked at George Washington University with Edward Teller on nuclear astrophysics, is also remembered for developing what field of theoretical biology in 1954?", choices: ["Evolutionary game theory", "The theory of information storage in DNA", "The use of radioactive tracers in biochemistry"], correct: 0 },
  { question: "The physicist George Gamow's later career included proposing what important concept in cosmology beyond the Big Bang prediction?", choices: ["The steady state theory as an alternative to the Big Bang", "The Big Bang nucleosynthesis", "The inflationary Big Bang"], correct: 1 },
  { question: "The physicist George Gamow's model of alpha decay using quantum tunneling was the first application of quantum tunneling to a nuclear physics problem. The tunneling probability depends on what factors?", choices: ["The distance of the tunnel and the temperature of the nucleus", "The barrier height and width", "The mass of the alpha particle and the charge of the daughter nucleus only"], correct: 1 },
  { question: "The physicist George Kistiakowsky bet James Conant a month's salary against 10 dollars that the Trinity implosion device would work. When it did, Oppenheimer reportedly said what to Kistiakowsky right after the blast?", choices: ["'You owe me ten dollars, George'", "'Kisti, I think you just won ten dollars from Conant'", "'George, you've just become the richest physicist in the world at ten dollars'"], correct: 2 },
  { question: "The physicist George Kistiakowsky had a colorful personal life. He was born in Kiev, fought in the Russian Civil War on the White Army side, escaped through Turkey, and eventually got a PhD from The University of Berlin under who?", choices: ["Walther Nernst", "Kazimierz Fajans", "Fritz Haber"], correct: 0 },
  { question: "The physicist George Kistiakowsky is remembered for what physical act at the moment Trinity succeeded?", choices: ["He drove out in a jeep to the hypocenter to collect soil samples while the area was still highly radioactive", "He embraced Oppenheimer and said 'This is the greatest moment in the history of science'", "He grabbed Oppenheimer and the two did a little dance"], correct: 0 },
  { question: "The physicist George Kistiakowsky served as scientific advisor to what president?", choices: ["Harry Truman", "Dwight Eisenhower", "John F. Kennedy"], correct: 1 },
  { question: "The physicist George Placzek arrived in the U.S. from Europe and worked first at the Montreal Laboratory. His nuclear data compilation was crucial. He was known as 'the encyclopedia' of nuclear data. What happened to Placzek after the war?", choices: ["He joined Brookhaven National Laboratory and continued neutron cross section work until his death in 1955", "He joined the Institute for Advanced Study at Princeton, working quietly on theoretical physics until his death in 1955", "He returned to Israel after helping found the Weizmann Institute of Science's nuclear physics program"], correct: 1 },
  { question: "The physicist George Placzek, known as 'the encyclopedia,' refused to write his knowledge down in papers. He preferred oral communication. Despite this, his influence on nuclear physics was enormous through personal interactions. He died unexpectedly in 1955. What contributed to his early death?", choices: ["Radiation exposure from years of working with radioactive sources at Los Alamos and later Brookhaven", "A heart attack at age 53, with no specific connection to his nuclear work", "Cancer whose connection to radiation exposure was debated"], correct: 1 },
  { question: "The physicist George Pugh (Placzek's student) compiled the BNL-325 neutron cross section tables. These became the standard reference in nuclear engineering. BNL stands for what?", choices: ["Berkeley National Laboratory", "Brookhaven National Laboratory", "Boston Nuclear Laboratory"], correct: 1 },
  { question: "The physicist George Smoot and John Mather won the Nobel Prize in Physics in 2006 for discovering temperature fluctuations in the cosmic microwave background using the COBE satellite. These fluctuations are important because they are the seeds of what?", choices: ["The nuclear reactions in the early universe that produced helium and deuterium", "All large-scale structure in the universe", "The cosmic magnetic fields that are observed in all galaxy clusters"], correct: 1 },
  { question: "The physicist George Thomson, who proved electrons were waves, demonstrated this using what experimental method?", choices: ["Compton scattering of electrons off atomic targets", "Electron diffraction from crystal lattices", "Double-slit interference experiments using individual electrons"], correct: 1 },
  { question: "The physicist George Uhlenbeck co-developed the Ornstein-Uhlenbeck stochastic process, which describes what physical system?", choices: ["The random walk of electrons in a conductor under thermal fluctuations", "The velocity of a massive Brownian particle under random molecular collisions", "The fluctuations of neutron population around the critical level in a reactor"], correct: 1 },
  { question: "The physicist George Uhlenbeck, who co-discovered electron spin with Goudsmit, worked at the Manhattan Project's Radiation Laboratory at MIT on radar. His earlier work on electron spin was done under which Nobel laureate in Leiden?", choices: ["Niels Bohr", "Wolfgang Pauli", "Paul Ehrenfest"], correct: 2 },
  { question: "The physicist George Zweig, who independently proposed quarks (calling them 'aces'), was a postdoc at CERN when he wrote his paper. CERN initially refused to publish it. Where was it eventually published?", choices: ["Physical Review Letters in the United States", "Zweig's paper was circulated as a CERN preprint and not formally published in a journal for decades", "Nature"], correct: 1 },
  { question: "The physicist Gerard 't Hooft proved in 1971 that the electroweak theory developed by Glashow, Weinberg, and Salam was renormalizable. This means what in physics?", choices: ["The theory gives finite, sensible predictions at all energy scales after a systematic mathematical procedure removes infinite terms", "The theory correctly predicts conservation of electric charge at high energies", "The theory reduces to classical electromagnetism at low energies"], correct: 2 },
  { question: "The physicist Gerard 't Hooft proved the electroweak theory was renormalizable in 1971. His PhD supervisor who guided this work was who?", choices: ["Sheldon Glashow", "Martinus Veltman", "Steven Weinberg"], correct: 1 },
  { question: "The physicist Gerard 't Hooft's proof of renormalizability of non-Abelian gauge theories relied on dimensional regularization. What is dimensional regularization?", choices: ["Using a lattice of discrete spacetime points to replace the continuum, naturally cutting off ultraviolet divergences at the lattice spacing scale", "Treating the number of spacetime dimensions as a continuous variable d=4-ε and analytically continuing", "Introducing a physical cutoff energy scale Λ above which the theory is not applied"], correct: 1 },
  { question: "The physicist Glenn Seaborg's element discoveries include nine new elements, more than any other person in history. What is the atomic number of Seaborgium?", choices: ["104", "105", "106"], correct: 2 },
  { question: "The physicist H. David Politzer independently discovered asymptotic freedom in 1973 at the same time as Gross and Wilczek. After winning the Nobel, Politzer has worked at what institution?", choices: ["Harvard", "Caltech", "Princeton"], correct: 0 },
  { question: "The physicist Hans Bethe at age 85 wrote a major 1991 paper about what topic?", choices: ["The history of the hydrogen bomb and Teller-Ulam controversy", "Supernova neutrinos", "The solar neutrino problem in light of new Kamiokande data"], correct: 1 },
  { question: "The physicist Hans Bethe explained the carbon cycle for stellar energy production in 1939. The cycle begins when carbon-12 captures a proton. What is the end result of one complete CNO cycle?", choices: ["Carbon-12 is converted to nitrogen-14 permanently, releasing two gamma rays", "Four protons are consumed and one helium-4 nucleus is produced", "One proton is consumed, and the carbon nucleus gains one mass unit to become nitrogen-13"], correct: 2 },
  { question: "The physicist Hans Bethe famously walked back to Ithaca from what nearby town after completing his 1947 Lamb shift calculation on the train?", choices: ["Syracuse", "Schenectady", "Buffalo"], correct: 1 },
  { question: "The physicist Hans Bethe fled Germany in 1933 after being fired from his professorship at the University of Tübingen under the Nazi racial laws. He went first to England before coming to Cornell. What special quality did colleagues note about Bethe's way of working?", choices: ["He could do calculations faster in his head than others could with adding machines", "He worked methodically and slowly, catching errors that others missed by rushing", "He produced a complete, correct answer on the first attempt almost every time"], correct: 0 },
  { question: "The physicist Hans Bethe led the Theoretical Division (T-Division) at Los Alamos. He later described the experience as the most productive of his career. After the war, he returned to Cornell. What did Bethe calculate in 1947 that was his most important post-war contribution?", choices: ["The Bethe formula for energy loss of charged particles in matter", "The Lamb shift", "The solar neutrino flux from the pp chain"], correct: 1 },
  { question: "The physicist Hans Bethe returned to Germany how many times after the war?", choices: ["He never returned", "One time", "Three times"], correct: 2 },
  { question: "The physicist Hans Bethe, on learning that Teller would not lead a group at Los Alamos because he was focused only on the Super, reportedly said what to Oppenheimer about Teller?", choices: ["'Teller is brilliant but impossible, give him whatever he wants or we'll never have peace'", "'The Super can wait; Teller cannot remain idle, give him problems he will enjoy'", "Teller will end us by ruining this whole project"], correct: 0 },
  { question: "The physicist Hans Bethe, who led the Theoretical Division (T-Division) at Los Alamos, performed one of the most important wartime calculations. He proved that the atmosphere could not be ignited by an atomic bomb. What would have been required for atmospheric ignition?", choices: ["The bomb would need a yield exceeding 1 gigaton for the thermal radiation to heat sufficient atmospheric nitrogen to fusion temperatures", "The nitrogen-nitrogen fusion reaction would need to release more energy than it consumed", "The atmosphere would need to be much denser"], correct: 0 },
  { question: "The physicist Hans Bethe's calculations of the Lamb shift used what mathematical shortcut that kept the result finite despite the expected ultraviolet divergences?", choices: ["He subtracted the contribution of a free electron", "He cut off the integral at the electron rest mass energy", "He used dimensional regularization"], correct: 0 },
  { question: "The physicist Hans Bethe's final major paper was co-authored in 2004, when he was 98 years old. The paper was about what topic?", choices: ["Nuclear weapons arms control", "Solar neutrinos", "The future of nuclear energy"], correct: 2 },
  { question: "The physicist Hans Bethe's Lamb shift calculation in 1947 produced a result of about 1040 MHz for the 2S-2P hydrogen energy difference. The measured value is 1057 MHz. The discrepancy was resolved by more complete QED calculations by whom?", choices: ["Feynman, who recalculated including all one-loop corrections and got 1057 MHz", "Julian Schwinger, who included relativistic corrections and the electron self-energy to get the correct value", "Norman Kroll and Willis Lamb, who performed the full relativistic calculation "], correct: 2 },
  { question: "The physicist Hans Blix led UN inspections in what country, failing to find evidence of active nuclear weapons programs?", choices: ["North Korea", "Iraq", "Iran"], correct: 1 },
  { question: "During the post-Gulf War inspections that revealed the extent of Iraq's covert nuclear program, what had Iraq been building?", choices: ["A plutonium production reactor disguised as a research reactor", "A broad nuclear weapons program using electromagnetic isotope separation", "An underground enrichment plant using stolen centrifuge designs from the A.Q. Khan network"], correct: 1 },
  { question: "The physicist Hans Halban, Austrian-born member of the British-Canadian Montreal group, had co-discovered what with Joliot-Curie and Kowarski in Paris in 1939?", choices: ["That plutonium could sustain a chain reaction", "That uranium fission emitted secondary neutrons", "That heavy water was superior to graphite as a moderator"], correct: 1 },
  { question: "The physicist Hans Kristensen and Robert Norris produced the most authoritative public estimates of nuclear weapons stockpiles through what institution?", choices: ["The Federation of American Scientists (FAS) Nuclear Information Project", "The Bulletin of the Atomic Scientists' Nuclear Weapons Archive", "The Stockholm International Peace Research Institute"], correct: 0 },
  { question: "The physicist Harold Agnew, scientific observer on the Hiroshima mission, became director of Los Alamos in 1970. He served until 1979. During his tenure, what major change occurred in U.S. nuclear weapons design philosophy?", choices: ["The development of neutron bombs for NATO tactical use", "The shift from large strategic gravity bombs to smaller precision-guided nuclear weapons", "The shift from weapons development to cleanup and education"], correct: 1 },
  { question: "The physicist Harold Agnew, was involved in what specific event on the Hiroshima mission that was unique among all Manhattan Project observers?", choices: ["He photographed the actual bomb detonation through a filtered porthole of his observation aircraft", "He filmed the Hiroshima mushroom cloud from The Great Artiste using a hand-held movie camera", "He measured the blast pressure on the aircraft at the exact moment it hit"], correct: 1 },
  { question: "Harold Agnew flew as a scientific observer on the Hiroshima mission. What was the name of the instrument plane? aboard the instrument plane 'The Great Artiste,' later became what?", choices: ["Necessary Evil", "The Great Artiste", "Full House"], correct: 1 },
  { question: "The physicist Harold Urey discovered deuterium in 1931 using spectroscopy. He later made an important contribution to the origin of life by suggesting what?", choices: ["That life began around deep-sea hydrothermal vents where energy from the Earth could drive chemical reactions", "That the early Earth's atmosphere contained methane, ammonia, water, and hydrogen, and that lightning could produce organic molecules from these ingredients", "That life was seeded from space via comets that delivered organic molecules to the early Earth"], correct: 2 },
  { question: "The physicist Harold Urey discovered deuterium in 1931. The process he used to concentrate it was evaporation of liquid hydrogen. What property of deuterium versus ordinary hydrogen made this work?", choices: ["Deuterium is radioactive, making it easier to detect by its radiation", "Deuterium has a lower vapor pressure than ordinary hydrogen at the same temperature, so it concentrates in the liquid phase during evaporation", "Deuterium absorbs a specific UV wavelength that ordinary hydrogen does not, allowing optical selection"], correct: 2 },
  { question: "The physicist Harold Urey, who discovered deuterium and led the isotope separation research group, was not at Los Alamos. He worked primarily at what location?", choices: ["Hanford", "Columbia University", "Oak Ridge"], correct: 1 },
  { question: "The physicist Harry Gold, Fuchs's courier, served how many years of his 30-year sentence?", choices: ["30 years", "15 years", "5 years"], correct: 1 },
  { question: "The physicist Henry Linschitz worked at Los Alamos on the explosive lenses and later became a professor of chemistry. The RaLa technique that proved implosion symmetry was developed in what building at Los Alamos?", choices: ["D-Building", "The DP-Site", "The Omega Site"], correct: 0 },
  { question: "The physicist Herbert Anderson performed the definitive experiment proving that uranium fission is caused by the rare isotope U-235, not the abundant U-238, in 1940. He did this with what technique?", choices: ["Using mass-spectrometrically separated U-235 to show it had far higher fission cross section than natural uranium", "Measuring the fission rate as a function of neutron energy", "Comparing fission rates in natural uranium before and after chemically removing the U-235 fraction"], correct: 0 },
  { question: "The physicist Herbert Anderson, after the Manhattan Project, helped establish what accelerator facility at Los Alamos that was for decades the world's most powerful proton accelerator?", choices: ["The Los Alamos Meson Physics Facility (LAMPF)", "The Los Alamos Neutron Science Center (LANSCE)", "The Los Alamos Linear Accelerator (LALA)"], correct: 0 },
  { question: "The physicist Herbert Anderson, Fermi's close collaborator, designed and built what became the standard method for measuring neutron cross sections using time-of-flight techniques. At what laboratory was most of this post-war work done?", choices: ["Argonne National Laboratory", "Oak Ridge National Laboratory", "Los Alamos National Laboratory"], correct: 2 },
  { question: "The physicist Herbert Anderson, Fermi's closest experimental collaborator, is credited with what role at the moment of criticality?", choices: ["He monitored the neutron flux meters and called out readings to Fermi", "He physically pulled the zip rodon Fermi's signal to initiate the chain reaction", "He operated the safety rod system, prepared to drop it if Fermi gave the abort signal"], correct: 1 },
  { question: "The physicist Herbert York became the first director of what government science office created by Eisenhower?", choices: ["The National Science Foundation", "ARPA", "The Office of Science and Technology Policy"], correct: 1 },
  { question: "ARPA was created in 1958 in response to what event?", choices: ["The Soviet test of a thermonuclear weapon in 1955", "The Soviet launch of Sputnik in October 1957", "The failure of the U.S. Vanguard rocket launch in December 1957"], correct: 1 },
  { question: "The physicist Herbert York wrote a book called 'Race to Oblivion: A Participant's View of the Arms Race.' York argued that the arms race was driven not by rational security decisions but by what?", choices: ["Soviet espionage that kept forcing the U.S. to respond to newly revealed Soviet capabilities", "The 'military-industrial complex' that Eisenhower had warned about", "Congressional pressure from states with defense contractors who needed to keep production facilities open"], correct: 0 },
  { question: "The physicist Herbert York, after DARPA and Livermore, became the U.S. ambassador to what country in 1979-1981?", choices: ["France", "The Soviet Union", "West Germany"], correct: 1 },
  { question: "The physicist Herbert York's book 'The Advisors: Oppenheimer, Teller, and the Superbomb' argued what central thesis?", choices: ["That Teller's insistence on the H-bomb at the cost of abandoning the GAC's advice set U.S. nuclear policy on an irresponsible trajectory", "That both Oppenheimer and Teller had legitimate arguments about the H-bomb, but the decision-making process that revoked Oppenheimer's clearance corrupted U.S. science policy", "That the H-bomb program was necessary and Oppenheimer's opposition to it reflected a fundamental confusion about deterrence theory"], correct: 2 },
  { question: "The physicist Herman Kahn, who worked at RAND after the war, argued in 'On Thermonuclear War' that nuclear war was survivable and could be 'won.' He proposed a concept called what for evaluating nuclear deterrence?", choices: ["The 'Balance of Terror'", "The 'Ladder of Escalation'", "The 'First Strike Counterforce Strategy'"], correct: 1 },
  { question: "The physicist Hideki Yukawa, who predicted the pion, proposed his meson theory of the strong nuclear force in 1935. The range of the strong nuclear force is about 1 femtometer (10^-15 m). Yukawa's uncertainty principle argument relating range to particle mass predicted a particle of approximately what mass?", choices: ["About 10 MeV, roughly 20 times the electron mass", "About 100-200 MeV, roughly 200-300 times the electron mass", "About 1 GeV, roughly the proton mass"], correct: 1 },
  { question: "The physicist Hideki Yukawa, who predicted the pion, was the first Japanese citizen to win a Nobel Prize. In what year?", choices: ["1946", "1949", "1952"], correct: 1 },
  { question: "The physicist Hideki Yukawa's pion prediction faced the 'two meson puzzle' when the muon was discovered in 1937. How was this resolved?", choices: ["Yukawa revised his theory to predict two particlesas a doublet", "The cosmic ray particle found in 1937 was the muon; Powell found the true pion in 1947", "The puzzle was resolved when gluons were discovered, showing Yukawa's pion wasn't needed after all"], correct: 2 },
  { question: "The physicist Homi Jehangir Bhabha founded India's nuclear program and was its first chairman of the Atomic Energy Commission of India. He died in what accident in 1966?", choices: ["A plane crash near Mount Blanc", "A laboratory accident during high explosives testing at the Trombay facility", "A heart attack at the 1966 Geneva nuclear energy conference"], correct: 0 },
  { question: "The physicist Howard Georgi and Sheldon Glashow's SU(5) grand unified theory made a specific prediction that was subsequently tested. What was the result of this test?", choices: ["The predicted magnetic monopoles were found in 1982 in a single event by Blas Cabrera, but never confirmed again", "Proton decay searches (like IMB and Kamiokande) found no proton decay to the expected decay mode (e⁺ + π⁰)", "The predicted X and Y gauge bosons were found as virtual contributions to rare kaon decays at the predicted mass scale"], correct: 1 },
  { question: "The physicist Hugh Everett III proposed the many-worlds interpretation of quantum mechanics in his 1957 Princeton PhD thesis. His advisor Wheeler was initially enthusiastic but later distanced himself. Everett spent the rest of his career not in physics but in what field?", choices: ["The U.S. government's national security community", "The computer science industry", "Academic philosophy"], correct: 0 },
  { question: "The physicist Igor Kurchatov, who directed the Soviet atomic bomb program, reportedly said after seeing the Trinity test intelligence reports that the Soviets would build an even more powerful bomb. He was given essentially unlimited resources. What was his code name in the Soviet program?", choices: ["'The Director'", "'The Beard'", "'Ivan'"], correct: 2 },
  { question: "The physicist Isidor Rabi described the atomic bomb as 'the culmination of Western civilization.' By this he meant what?", choices: ["That Western science had produced its greatest technological achievement", "That the bomb represented the accumulated destructive potential of the entire Western scientific tradition", "That the bomb would inevitably spread to all civilizations, making it universal"], correct: 1 },
  { question: "The physicist Isidor Rabi proposed creating what international scientific organization at a 1950 UNESCO conference in Florence, Italy?", choices: ["The International Centre for Theoretical Physics", "CERN", "UNESCO's Science Division"], correct: 1 },
  { question: "The physicist Isidor Rabi turned down an offer to work at Los Alamos as a full-time staff member. Instead, he served as a consultant. His reason for refusing a full-time appointment was what?", choices: ["He was running the MIT Radiation Lab on radar, which he believed was more important to winning the war", "He refused to devote himself fully to a weapon whose use against cities he thought was morally wrong", "He believed he could contribute more as an outside critic reviewing the scientific work than as an insider unable to question assumptions"], correct: 1 },
  { question: "The physicist Isidor Rabi was instrumental in advising the U.S. government on science policy after the war. He proposed building what facility on Long Island that became one of the world's leading nuclear physics laboratories?", choices: ["The SLAC National Accelerator Laboratory", "The Fermi National Accelerator Laboratory", "Brookhaven National Laboratory"], correct: 2 },
  { question: "The physicist Isidor Rabi's technique of measuring nuclear magnetic resonance using atomic beams had a key precursor in the 'molecular beam method' developed by whom?", choices: ["Otto Stern", "James Franck", "Max Born"], correct: 0 },
  { question: "The physicist J.J. Thomson, who discovered the electron in 1897, won the Nobel Prize in Physics in 1906. Who won the Nobel in 1937 for discovering the wave nature of electrons, disproving Thompson?", choices: ["Richard Feynman", "G.P. Thompson", "Isidor Rabi"], correct: 1 },
  { question: "The physicist Jack Steinberger worked at Chicago under Fermi before becoming a particle physicist. He discovered the muon neutrino in 1962 at Brookhaven with Schwartz and Lederman. They won the Nobel in what year?", choices: ["1976", "1982", "1988"], correct: 2 },
  { question: "The physicist Jacob Bekenstein proposed that black holes have entropy proportional to their surface area in 1972. The Bekenstein-Hawking entropy formula gives the entropy of a black hole as S = kA/(4l_P²), where A is the horizon area and l_P is the Planck length. Who later derived the correct coefficient of 1/4?", choices: ["Jacob Bekenstein", "Stephen Hawking", "Roger Penrose"], correct: 1 },
  { question: "The physicist James Chadwick had what personal characteristic that distinguished him from most other senior Manhattan Project scientists?", choices: ["He was the only senior scientist who had personally discovered a fundamental particle", "He rarely spoke in public and gave almost no speeches or interviews", "He was the only senior scientist who consistently worked alone without graduate students or collaborators"], correct: 0 },
  { question: "The physicist James Chadwick won the Nobel Prize in Physics in 1935 for the discovery of the neutron. He discovered it in what year?", choices: ["1930", "1932", "1934"], correct: 1 },
  { question: "The physicist James Chadwick worked with Rutherford at the Cavendish Laboratory in Cambridge. Chadwick spent several years during WWI as an internee in Germany. Where exactly was he held?", choices: ["The Ruhleben internment camp near Berlin", "Schloss Spandau prison in Berlin", "A work camp near the Krupp steel factories in the Ruhr"], correct: 0 },
  { question: "The physicist James Chadwick, after discovering the neutron in 1932, noted that the neutron would be ideal for inducing nuclear reactions because of what property?", choices: ["Neutrons are electrically neutral and therefore unaffected by the strong nuclear force", "Neutrons carry no electric charge and therefore experience no electrostatic repulsion when approaching a nucleus", "Neutrons decay rapidly outside nuclei, making them impossible for enemy nations to detect in transit"], correct: 2 },
  { question: "The physicist James Cronin and Val Fitch won the Nobel Prize in Physics in 1980 for the discovery of CP violation. CP violation means what?", choices: ["The laws of physics treat left-handed and right-handed particles differently", "The combined symmetry of charge conjugation (C) and parity (P) is NOT conserved in weak interactions", "The laws of physics are not time-reversible"], correct: 0 },
  { question: "The physicist James Cronin co-discovered CP violation in 1964 with Val Fitch using what specific decay mode of kaons?", choices: ["The decay of charged kaons (K⁺) into two pions", "The decay of neutral long-lived kaons (KL) into two pions", "The asymmetric decay of neutral kaons (K⁰) versus their antimatter counterparts (K̄⁰)"], correct: 1 },
  { question: "The physicist James Franck fled Germany in 1933 after publicly resigning his professorship to protest Nazi laws. He had won the Nobel Prize in Physics in what year?", choices: ["1925", "1928", "1931"], correct: 0 },
  { question: "The physicist James Franck was deeply affected by the news of Hiroshima. He had hoped the Franck Report would prevent civilian targeting. When he heard the news, he reportedly said what to his wife?", choices: ["'Our weapons have been used. I knew they would be.'", "'We have failed. I have failed.'", "'It should not have been done this way. It need not have been done this way.'"], correct: 0 },
  { question: "The physicist James Franck won the Nobel Prize for the Franck-Hertz experiment of 1914, which proved what fundamental quantum mechanical concept?", choices: ["That electrons in atoms occupy discrete energy levels that can only absorb specific amounts of energy", "That radioactive atoms decay at fixed statistical rates independent of their history", "That alpha particles scattered from heavy nuclei follow Coulomb's law, proving the nuclear model of the atom"], correct: 0 },
  { question: "The physicist James Franck's 1914 experiment with Gustav Hertz sent electrons through mercury vapor and showed electrons lost energy only in discrete amounts when they collided inelastically with mercury atoms. What was the energy of the lowest inelastic collision in mercury?", choices: ["10.4 eV — the ionization energy of mercury", "13.6 eV — the same as hydrogen ionization", "4.9 eV — corresponding to the first excited state of the mercury atom"], correct: 2 },
  { question: "The physicist James Rainwater at Columbia worked on the Manhattan Project and later won the 1975 Nobel Prize in Physics. Their work explained nuclear properties by proposing that nuclei could have what shape?", choices: ["A tetrahedral structure explaining nuclear magic numbers", "A torus (donut) shape explaining the unusually low binding energies of certain isotopes", "Non-spherical (deformed) shapes of a collective model treating nuclei as oscillating or rotating deformed liquid drops"], correct: 2 },
  { question: "The physicist James Tuck brought the concept of explosive lenses from British wartime work on shaped charges. In what British wartime program had shaped charge technology been developed?", choices: ["The PIAT anti-tank weapon development program", "The HEAT warhead development", "The Munroe effect research program"], correct: 0 },
  { question: "The physicist James Tuck, the British explosives expert who introduced shaped charge concepts, stayed on at Los Alamos after the war and became a U.S. citizen. He is known for a fusion research program called what?", choices: ["The Pinch Project", "The Perhapsatron", "Project Sherwood"], correct: 1 },
  { question: "The physicist James van Allen discovered the radiation belts surrounding Earth using data from Explorer 1, the first successful U.S. satellite. Explorer 1 was launched in what year?", choices: ["1956", "1958", "1960"], correct: 1 },
  { question: "The physicist James Van Allen, who discovered the radiation belts, was a key scientific organizer for what major international effort that launched the Space Age?", choices: ["The International Geophysical Year of 1957-58", "The Atoms for Peace program", "Project Vanguard"], correct: 2 },
  { question: "The physicist Jeffrey Goldstone proved in 1961 that when a continuous symmetry is spontaneously broken, the theory must contain massless particles. These are called Goldstone bosons. In the Standard Model, what happens to the Goldstone bosons from electroweak symmetry breaking?", choices: ["They become the photon", "They are 'eaten' by the W and Z gauge bosons", "They appear as a new physical particle called the Higgs boson"], correct: 2 },
  { question: "The physicist Jim Hartle and Stephen Hawking proposed a new proposal for quantum state of the universe in 1983. This proposal addresses what?", choices: ["The wave function of the universe", "The absence of spatial boundaries in the universe", "The absence of preferred reference frames"], correct: 1 },
  { question: "The physicist John Archibald Wheeler coined the phrase 'It from Bit' to describe what philosophical view about the nature of reality?", choices: ["That computer bits are made of particles following quantum mechanical laws", "That physical reality is fundamentally informational", "That the universe is a simulation running on a quantum computer"], correct: 1 },
  { question: "The physicist John Archibald Wheeler, who coined 'black hole,' worked on the hydrogen bomb at Princeton alongside Teller. Wheeler argued passionately for the H-bomb program partly because of a personal loss. Who passed?", choices: ["His father had been killed in WWI", "His brother had been killed in WWII", "He had lost a close friend in a Japanese POW camp"], correct: 1 },
  { question: "The physicist John Bardeen is the only person to win the Nobel Prize in Physics twice. His first Nobel was in 1956 for the transistor. His second was when?", choices: ["1968", "1972", "1975"], correct: 0 },
  { question: "The physicist John Bell's 1964 theorem showed that any hidden variable theory that reproduces quantum mechanical predictions must be 'non-local.' The Bell test experiments by Aspect and colleagues in 1982 showed what?", choices: ["That hidden variable theories could not reproduce quantum predictions at all", "That quantum mechanics is correct and local realistic hidden variable theories are ruled out", "That the many-worlds interpretation was correct because it was the only local theory consistent with results"], correct: 1 },
  { question: "The physicist John Cockcroft, who ran the Chalk River laboratory for the British-Canadian group, became the first director of the UK Atomic Energy Research Establishment at Harwell. AERE Harwell is located in which county of England?", choices: ["Berkshire", "Hampshire", "Oxfordshire"], correct: 2 },
  { question: "The physicist John Cockcroft, who split the lithium atom with Walton in 1932 and later ran the Chalk River nuclear laboratory in Canada, was awarded the Nobel Prize alongside Walton in what year?", choices: ["1938", "1945", "1951"], correct: 2 },
  { question: "The physicist John Manley, who coordinated the key 1942-43 planning discussions, was a student of Arthur Compton at the University of Chicago. He helped recruit scientists to the project by doing what?", choices: ["Traveling to universities across the country to personally recruit physicists for the project", "Placing coded advertisements in physics journals inviting applications for classified research positions", "Working with university presidents to seconding physics faculty to the government for the duration of the war"], correct: 0 },
  { question: "The physicist John Mather and George Smoot won the Nobel for what specific COBE result that established the standard cosmological model?", choices: ["The first precise measurement of the CMB temperature", "The discovery of the CMB anisotropy", "Both results"], correct: 1 },
  { question: "The physicist John von Neumann developed a mathematical proof in 1932 that no hidden variable theory could reproduce quantum mechanical predictions. This proof was later shown to have a subtle flaw. Who identified the flaw and published the correction?", choices: ["David Bohm", "John Bell", "Grete Hermann"], correct: 2 },
  { question: "The physicist John von Neumann estimated the optimal burst height for the Hiroshima bomb. Too low meant the blast energy went into a crater rather than spreading as a shockwave; too high meant the blast dissipated before reaching the ground. The optimal height for Hiroshima was calculated to be approximately what?", choices: ["About 1,900 feet", "About 3,300 feet", "About 4,900 feet"], correct: 0 },
  { question: "The physicist John von Neumann proved in his 1932 book 'Mathematische Grundlagen der Quantenmechanik' that quantum mechanics could not be completed by adding hidden variables. The fatal flaw in his proof was an assumption about non-commuting observables. What was the flawed assumption?", choices: ["He assumed that the expectation value of A+B always equals the expectation value of A plus the expectation value of B", "He assumed that all measurable observables in a hidden variable theory must be functions of the same hidden variable", "He assumed that probability distributions in quantum mechanics must be Gaussian"], correct: 2 },
  { question: "The physicist John von Neumann's extraordinary mathematical abilities were noticed early as he had memorized this city's telephone directory at 1939", choices: ["Budapest", "Zurich", "Göttingen"], correct: 0 },
  { question: "The physicist John von Neumann was instrumental in advising the U.S. government on where to bomb in Japan to maximize psychological impact. He was on the Target Committee. Von Neumann advocated specifically for what approach?", choices: ["Targeting a city with symbolic importance to the Emperor", "Detonating the bomb as close to the ground as possible to maximize the area of total destruction", "Detonating at a height designed to maximize blast wave reflection from the ground"], correct: 0 },
  { question: "The physicist John von Neumann was offered a position at the Institute for Advanced Study when it was being organized by Flexner in 1930. He became one of the original six professors. Who were the other original IAS mathematicians/physicists?", choices: ["Einstein, Bohr, Veblen, Alexander, and Morse", "Einstein, Oppenheimer, Dirac, Bohr, and Weyl", "Einstein, Weyl, Veblen, Alexander, and James"], correct: 1 },
  { question: "The physicist John von Neumann was working on a theory of automata and self-reproducing machines at the time of his death from cancer in 1957. What was he developing?", choices: ["A mathematical model of how neurons could be connected to form a thinking machine", "A theory of self-replicating automata", "A formal proof that Gödel's incompleteness theorems applied to all physical theories"], correct: 2 },
  { question: "The physicist John von Neumann's mathematical foundations of quantum mechanics (1932) proved that quantum mechanics requires a Hilbert space — an infinite-dimensional vector space. What physical fact requires this infinite dimensionality?", choices: ["The infinite number of particles in the universe", "The continuous energy spectrum of free particles", "The infinite precision of quantum measurements"], correct: 2 },
  { question: "The physicist John von Neumann's stored-program computer concept was first implemented in the EDVAC design in 1945. The key innovation was what?", choices: ["Binary arithmetic instead of decimal", "Electronic vacuum tube switching instead of mechanical relays", "Storing program instructions and data in the same memory"], correct: 2 },
  { question: "The physicist John Wheeler coined the term 'black hole' in 1967 at a conference. He proposed this name to replace an earlier term physicists had used. What was the earlier name Wheeler replaced?", choices: ["Dark star", "Frozen star", "Collapsar"], correct: 2 },
  { question: "The physicist Joseph Kennedy, Seaborg's co-discoverer of plutonium, headed the chemistry division at Los Alamos but died young. He died in what year at age 35?", choices: ["1944", "1951", "1957"], correct: 1 },
  { question: "The physicist Joseph Rotblat kept a diary throughout the Manhattan Project period. It was the only personal diary kept by a Los Alamos scientist during the project. What happened to it?", choices: ["It was confiscated by Army Security at Los Alamos when he left and never returned to him", "He destroyed it before leaving Los Alamos fearing it would be confiscated by Army Security", "It was published posthumously and is now a key primary source document about life at Los Alamos"], correct: 1 },
  { question: "The physicist Joseph Rotblat returned to Britain after leaving Los Alamos and became a professor of medical physics at St Bartholomew's Hospital. His specific research area was what application of nuclear physics?", choices: ["Radiation dosimetry for cancer treatment", "Radioisotope production for diagnostic medicine", "The biological effects of radiation on human tissue"], correct: 0 },
  { question: "The physicist Joseph Rotblat said in his Nobel Peace Prize lecture that scientists had a 'special responsibility' because they could 'foresee' the consequences of their work. He proposed a specific oath for scientists analogous to the Hippocratic oath for doctors. What did he call it?", choices: ["The Scientists' Pledge to Humanity", "The Hippocratic Oath for Scientists", "The Pugwash Oath"], correct: 2 },
  { question: "The physicist Joseph Rotblat, after leaving the Manhattan Project, became a medical physicist at St Bartholomew's Hospital in London. He later became president of the Pugwash Conferences. Pugwash's founding statement, the Russell-Einstein Manifesto, called for scientists to do what?", choices: ["Refuse to work on weapons research regardless of their political views", "Assemble to assess the dangers of weapons of mass destruction and discuss peaceful solutions", "Publish all nuclear weapons research in open journals to prevent secrecy-driven arms races"], correct: 0 },
  { question: "The physicist Joseph-Maria Jauch, who worked at Los Alamos, later wrote a book explaining quantum mechanics through a Socratic dialogue. What was its title?", choices: ["'Are Quanta Real? A Galilean Dialogue'", "'Quantum Mechanics in Dialogue Form'", "'The Meaning of Quantum Theory'"], correct: 0 },
  { question: "The physicist Julian Schwinger is credited with the heavy-ion orbital electron capture cross section that affects nuclear astrophysics. He also gave his name to the 'Schwinger limit'. What happens at the Schwinger limit?", choices: ["The vacuum polarization becomes so large that light can no longer propagate", "The electric field is strong enough to spontaneously create electron-positron pairs from the vacuum", "The electromagnetic force becomes as strong as the strong nuclear force"], correct: 0 },
  { question: "The physicist Julian Schwinger, who shared the Nobel with Feynman and Tomonaga, developed QED using a mathematically rigorous operator approach. Schwinger's students produced an extraordinary number of Nobel laureates, more than any other physics supervisor. At what institution did he teach?", choices: ["MIT", "Harvard", "Princeton"], correct: 1 },
  { question: "The physicist Julian Schwinger's calculation of the electron magnetic moment anomaly gave a correction factor of approximately α/(2π). What is the numerical value of this Schwinger correction?", choices: ["About 0.1", "About 0.01", "About 0.001"], correct: 2 },
  { question: "The physicist Julian Schwinger's last major theoretical contribution was the 'source theory' he developed after the success of QED. This was controversial because Schwinger argued it was superior to the more widely adopted Feynman-Dyson approach. Schwinger's complaint about Feynman diagrams was what?", choices: ["He said Feynman diagrams were misleading because they depicted virtual particles that didn't exist", "He said Feynman's approach only worked at weak coupling and would fail when the coupling was large", "He said Feynman diagrams made calculations easy but physical understanding difficult"], correct: 1 },
  { question: "The physicist Kenneth Bainbridge, who directed the Trinity test, was deeply affected by what he had done. In his autobiography he wrote that he felt 'a great sorrow.' He later spent much of his time on what cause?", choices: ["Developing better radiation safety protocols for nuclear workers", "Advocating against nuclear testing and for arms control", "Working on civilian nuclear power as a constructive application of atomic energy"], correct: 0 },
  { question: "The physicist Kenneth Wilson applied renormalization group methods to phase transitions. His key insight was what?", choices: ["That phase transitions are characterized by diverging correlation lengths, and the RG describes how physics looks at different length scales", "That the specific heat diverges at a phase transition, and the exponent of this divergence could be calculated using perturbation theory with a small parameter ε=4-d", "That universality was explained by the same microscopic Hamiltonian underlying all phase transitions"], correct: 2 },
  { question: "The physicist Kenneth Wilson won the Nobel Prize in Physics in 1982 for what contribution?", choices: ["Asymptotic freedom in QCD", "The renormalization group applied to phase transitions and critical phenomena", "Lattice QCD"], correct: 1 },
  { question: "The physicist Klaus Fuchs, after serving his sentence in Britain, moved to East Germany. He was awarded what recognition by the East German government?", choices: ["The National Prize of the German Democratic Republic", "The Karl Marx Order", "He was made director of the Central Institute for Nuclear Research"], correct: 1 },
  { question: "The physicist Lee Harvey Oswald — not the real Lee Harvey Oswald, but the fictional cover name used in VENONA — was actually code name for whom?", choices: ["Julius Rosenberg, whose VENONA code name was LIBERAL", "Klaus Fuchs, whose VENONA code name was REST", "Ted Hall, whose VENONA code name was MLAD"], correct: 2 },
  { question: "The physicist Lee Smolin proposed loop quantum gravity as an alternative to string theory for quantizing gravity. The basic idea is that space itself is quantized, made of discrete 'loops.' The size scale of these loops is what?", choices: ["The proton radius", "The Planck length", "The electroweak scale"], correct: 2 },
  { question: "The physicist Leó Szilárd and Albert Einstein met to draft the Einstein-Szilard letter in what city in the summer of 1939?", choices: ["In Peconic, Long Island, at the home of a mutual friend", "In Princeton, at Einstein's home on Mercer Street", "In New York City, at the Hungarian consulate"], correct: 0 },
  { question: "The physicist Leó Szilárd conceived the nuclear chain reaction in 1933, patented it in 1934, and assigned the patent to the British Admiralty to keep it secret. The Szilard-Chalmers reaction, a different discovery, is a chemical process for what?", choices: ["Enriching uranium isotopes using chemical exchange", "Concentrating radioactive isotopes by exploiting the recoil from neutron capture", "Separating fission products from irradiated uranium"], correct: 1 },
  { question: "The physicist Leó Szilárd emigrated from Germany to England in 1933, the same week as the Nazi book burnings. He was already packed and had bought his train ticket in advance, believing persecution was coming. What was his profession in Germany before physics?", choices: ["He had trained as an engineer", "He had no other profession", "He had briefly practiced law in Budapest"], correct: 0 },
  { question: "The physicist Leo Szilard is credited with the nuclear chain reaction concept. He was born in Budapest and worked in Berlin before fleeing. Who was his PhD supervisor, and at what institution did he receive his doctorate?", choices: ["Max Born at the University of Göttingen", "Max Planck at the University of Berlin", "Max von Laue at the University of Berlin"], correct: 2 },
  { question: "The physicist Leo Szilard proposed to Einstein that they write the famous 1939 letter to Roosevelt. Szilard was concerned Einstein might not be willing. What was his fear?", choices: ["That Einstein was a committed pacifist who might refuse to be associated with any weapon-related communication", "That Einstein, as a German citizen at the time, might be seen as a German agent if he sent the letter", "That Einstein had distanced himself from nuclear physics after EPR and would not have the credibility on fission to make the letter effective"], correct: 0 },
  { question: "The physicist Leó Szilárd spent his last years at the Salk Institute for Biological Studies in La Jolla, California. He had pivoted from physics to biology in the late 1950s. His main contribution to biology was what?", choices: ["The discovery of the repressor protein that controls gene expression in bacteria", "The chemostat", "The development of the first recombinant DNA technique"], correct: 1 },
  { question: "The physicist Leó Szilárd tried to convince other scientists to voluntarily suppress research results on fission in early 1939, before governments could classify them. He contacted Joliot-Curie in Paris to join a self-imposed moratorium. Joliot-Curie refused because of what principle?", choices: ["He was a Communist and believed all scientific knowledge should be shared freely", "He believed in the free publication of scientific results as a fundamental principle that should not be compromised even in wartime", "He thought Szilárd's concern was exaggerated"], correct: 1 },
  { question: "The physicist Leo Szilard was born in Budapest in 1898 as Leo Spitz. At what age did he leave Hungary for Germany?", choices: ["At age 18, in 1916", "At age 22, in 1920", "At age 25, in 1923"], correct: 0 },
  { question: "The physicist Leó Szilárd, before his nuclear chain reaction work, invented what household appliance with Einstein?", choices: ["An improved incandescent light bulb using inert gas filling that is still the standard design today", "An absorption refrigerator with no moving parts", "An improved radio receiver that separated stations using a new superheterodyne principle"], correct: 1 },
  { question: "The physicist Leó Szilárd's original 1934 chain reaction patent described the reaction not with uranium but with what element?", choices: ["Thorium, which he knew could fission", "Beryllium, as an (n,2n) amplifier", "Indium, which he knew had high neutron absorption"], correct: 2 },
  { question: "The physicist Leona Marshall Libby (née Woods) had what academic distinction that was unusual for a woman in 1943?", choices: ["She was the youngest female faculty member at the University of Chicago, appointed at age 21", "She had a PhD in physics from the University of Chicago", "She was the first woman admitted as a full member of the American Physical Society"], correct: 2 },
  { question: "The physicist Leona Marshall Libby (née Woods), the only woman present at CP-1's first criticality, later worked on what that Willard Libby (her future husband) was developing?", choices: ["The hydrogen bomb design at Los Alamos under Teller", "Radiocarbon dating ", "The design of the Hanford reactors' cooling water systems"], correct: 2 },
  { question: "The physicist Leonard Susskind and his colleagues developed the concept of the 'string theory landscape' — the vast number of possible string theory vacuum states (~10^500). What was the motivation for this controversial concept?", choices: ["To explain why the cosmological constant is small", "To provide a mechanism for eternal inflation", "To resolve the black hole information paradox"], correct: 2 },

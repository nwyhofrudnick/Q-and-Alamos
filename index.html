<!DOCTYPE html>
<!-- ============================================================
  Q & ALAMOS — Nuclear Trivia Game
  ============================================================
  EDITING GUIDE:
  
  1. CSS STYLES — lines ~8-167 inside <style> tags
     Edit colors, fonts, layout here.
  
  2. HTML STRUCTURE — lines ~170-216
     The card layout, header, answer list, next button.
  
  3. PHOTO LIBRARY — starting at line ~222
     Each photo is: { cap: "Caption text", svg: `...SVG...` }
     Add/remove/edit portrait or diagram entries freely.
  
  4. QUESTION DATA — starting after the photos (const flashcards = [...])
     Each question is:
       { question: "...", choices: ["A", "B", "C"], correct: 0|1|2 }
     correct: 0 = first choice, 1 = second, 2 = third
  
  5. SERIES LABELS — in the nextQuestion() function
     Edit keyword→label mappings to change the topic tags
     shown above each question.
  
  6. PHOTO FREQUENCY — const PHOTO_EVERY = 3;
     Change 3 to show photos every N cards instead.
============================================================ -->

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q & Alamos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Courier New',Courier,monospace;
  background:#2a2018;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding:2rem 1rem;
}

/* aged paper background pattern */
body::before{
  content:"";position:fixed;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px),
    repeating-linear-gradient(90deg,transparent,transparent 28px,rgba(0,0,0,.03) 28px,rgba(0,0,0,.03) 29px);
  pointer-events:none;z-index:0;
}

.card{
  background:#f5f0e4;
  border:2px solid #b8a98a;
  border-radius:3px;
  padding:1.5rem 1.5rem 1.1rem 1.5rem;
  width:90%;max-width:520px;
  position:relative;
  z-index:1;
  box-shadow:4px 6px 20px rgba(0,0,0,.5),inset 0 0 60px rgba(100,70,20,.06);
}

/* ── MOBILE: fill the screen ── */
@media (max-width: 600px) {
  body{
    padding:0;
    align-items:stretch;
    min-height:100dvh;
  }
  .card{
    width:100%;
    max-width:100%;
    min-height:100dvh;
    border-radius:0;
    border-left:none;border-right:none;
    padding:1.2rem 1rem 1rem 1rem;
    display:flex;flex-direction:column;
  }
  .choices{flex:1;margin-bottom:.8rem;}
  .choices li{font-size:13px;padding:8px 0;}
  .q-text{font-size:15px;}
  #nextQuestion,#showAnswer{font-size:13px;padding:11px 18px;}
}

/* corner fold effect */
.card::after{
  content:"";
  position:absolute;bottom:0;right:0;
  width:0;height:0;
  border-style:solid;
  border-width:0 0 18px 18px;
  border-color:transparent transparent #d4c8a8 transparent;
  filter:drop-shadow(-1px -1px 1px rgba(0,0,0,.15));
}

.stamp-conf{
  position:absolute;top:14px;right:16px;
  font-size:9px;font-weight:700;letter-spacing:.14em;
  color:#b33;border:1.5px solid #b33;
  padding:2px 7px;border-radius:2px;transform:rotate(2deg);
  text-transform:uppercase;
}

.card-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:1rem;padding-bottom:.8rem;
  border-bottom:1.5px solid #c4b090;
}
.la-seal{
  width:42px;height:42px;flex-shrink:0;
  border:2px solid #7a6040;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:700;color:#7a6040;
  text-align:center;line-height:1.3;letter-spacing:.03em;
}
.hdr-title{font-size:11px;font-weight:700;color:#4a3820;letter-spacing:.07em;text-transform:uppercase;}
.hdr-series{font-size:10px;color:#7a6040;margin-top:3px;font-style:italic;}

/* redacted line decoration */
.redact-bar{
  height:2px;background:#2a1e0e;
  margin:.6rem 0;opacity:.12;border-radius:1px;
}

.q-text{
  font-size:13.5px;color:#1e1408;line-height:1.65;
  margin-bottom:1rem;
  padding-right:4px;
}

.choices{list-style:none;margin-bottom:1rem;}
.choices li{
  font-size:12px;color:#4a3820;
  padding:5px 0;display:flex;align-items:flex-start;gap:8px;
  border-bottom:.5px solid rgba(184,169,138,.35);
}
.choices li:last-child{border-bottom:none;}
.ck{color:#9a7a50;min-width:18px;flex-shrink:0;font-weight:700;}
.tick{display:none;margin-left:auto;font-size:11px;color:#2a6a2a;flex-shrink:0;padding-left:4px;}

/* revealed states — toggled by adding .revealed to the <ul> */
#answers.revealed .ans-correct{font-weight:700;color:#1a7a1a;}
#answers.revealed .ans-correct .ck{color:#1a8a1a;}
#answers.revealed .ans-correct .tick{display:inline;}
#answers.revealed .ans-wrong{color:#8a2010;opacity:.75;}

/* Soviet leaked intel stamp */
.stamp-soviet{
  position:absolute;top:6px;right:8px;
  font-size:7.5px;font-weight:700;letter-spacing:.1em;
  color:#c00;border:2px solid #c00;
  padding:3px 6px;border-radius:2px;transform:rotate(-12deg);
  text-transform:uppercase;background:rgba(255,245,235,.88);
  z-index:10;line-height:1.35;text-align:center;display:none;
  font-family:'Courier New',Courier,monospace;
}
.soviet-choice-wrap{position:relative;display:inline-block;flex:1;}
.soviet-choice-text{display:block;color:#8a2010;opacity:0.82;line-height:1.6;}
.soviet-sharpie-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

.card-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:.8rem;border-top:1px solid #c4b090;
  margin-top:.2rem;
}
#nextQuestion{
  background:#7a6040;color:#f5f0e4;border:none;
  font-family:'Courier New',monospace;
  font-size:11px;font-weight:700;letter-spacing:.07em;
  padding:8px 18px;cursor:pointer;text-transform:uppercase;border-radius:2px;
  transition:background .15s;
}
#nextQuestion:hover{background:#5a4028;}
#nextQuestion:active{transform:scale(.97);}

#showAnswer{
  background:#f5f0e4;color:#7a6040;border:1.5px solid #b8a98a;
  font-family:'Courier New',monospace;
  font-size:11px;font-weight:700;letter-spacing:.07em;
  padding:8px 18px;cursor:pointer;text-transform:uppercase;border-radius:2px;
  transition:background .15s;
}
#showAnswer:hover{background:#e8e0cc;}
#showAnswer:active{transform:scale(.97);}
#showAnswer:disabled{opacity:.35;cursor:default;}

#rollDie{
  background:#f5f0e4;color:#4a3820;border:1.5px solid #b8a98a;
  font-family:'Courier New',monospace;
  font-size:11px;font-weight:700;letter-spacing:.07em;
  padding:8px 14px;cursor:pointer;text-transform:uppercase;border-radius:2px;
  transition:background .15s;
  display:flex;align-items:center;gap:6px;
}
#rollDie:hover{background:#e8e0cc;}
#rollDie:active{transform:scale(.97);}

/* ── DIE POPUP ── */
#diePopup{
  display:none;
  position:fixed;inset:0;
  z-index:8888;
  align-items:center;justify-content:center;
  pointer-events:none;
}
#diePopup.show{display:flex;}
#dieBox{
  background:#f5f0e4;
  border:2px solid #b8a98a;
  border-radius:4px;
  padding:20px 28px;
  box-shadow:4px 8px 28px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:none;
}
#dieBox .die-label{
  font-family:'Courier New',monospace;font-size:10px;
  font-weight:700;letter-spacing:.12em;color:#7a6040;text-transform:uppercase;
}
#dieSvg{
  display:block;
}
/* spin animation — atom orbits */
@keyframes orbitSpin{
  from{transform:rotate(var(--base-angle,0deg));}
  to  {transform:rotate(calc(var(--base-angle,0deg) + 360deg));}
}
#diePopup .o1{transform-origin:40px 40px; animation:orbitSpin 1.1s linear infinite; --base-angle:0deg;}
#diePopup .o2{transform-origin:40px 40px; animation:orbitSpin 1.4s linear infinite reverse; --base-angle:60deg;}
#diePopup .o3{transform-origin:40px 40px; animation:orbitSpin 1.7s linear infinite; --base-angle:120deg;}
#diePopup:not(.show) .o1,
#diePopup:not(.show) .o2,
#diePopup:not(.show) .o3{ animation:none; }

/* ── PAPERCLIP PHOTO ── */
.photo-clip{
  float:right;
  margin:0 -10px 8px 12px;
  width:122px;
  transform:rotate(-2.8deg);
  transform-origin:top center;
  z-index:2;
  position:relative;
  filter:drop-shadow(2px 5px 6px rgba(40,20,5,.45));
  transition:opacity .3s;
}
/* clearfix so card expands around float */
.choices::after{
  content:"";display:table;clear:both;
}
.clip-svg-wrap{
  position:absolute;top:-24px;
  left:50%;transform:translateX(-50%);
  z-index:31;
}
.tape-strip{
  position:absolute;top:-7px;left:50%;
  transform:translateX(-50%);
  width:34px;height:12px;
  background:rgba(255,248,200,.56);
  border:.5px solid rgba(210,185,100,.45);
  z-index:32;border-radius:1px;
}
.photo-mount{
  background:#fff;
  padding:5px 5px 1px 5px;
  border:1px solid #ccc4a4;
  box-shadow:1px 2px 4px rgba(0,0,0,.2);
}
.photo-inner{
  width:112px;height:84px;
  overflow:hidden;display:block;
}
.photo-inner svg{width:100%;height:100%;}
.photo-cap{
  font-family:'Courier New',monospace;
  font-size:7px;color:#5a4020;
  text-align:center;padding:3px 3px 4px;
  line-height:1.4;background:#fff;
  white-space:pre-line;
}

/* photo sepia overlay via mix-blend */
.photo-mount::after{
  content:"";
  position:absolute;
  width:112px;height:84px;
  background:rgba(120,80,20,.18);
  mix-blend-mode:multiply;
  pointer-events:none;
  top:5px;left:5px;
}
.photo-mount{position:relative;}

/* ── BOARD KEY OVERLAY ── */
#keyOverlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(20,12,4,.82);
  z-index:9999;
  align-items:center;justify-content:center;
  cursor:pointer;
}
#keyOverlay.visible{display:flex;}
#keyOverlay img{
  max-width:min(540px,92vw);
  max-height:90vh;
  border:3px solid #b8a98a;
  border-radius:3px;
  box-shadow:0 8px 40px rgba(0,0,0,.8);
  image-rendering:auto;
}
#keyOverlay .key-hint{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  font-family:'Courier New',monospace;font-size:11px;color:#c8b890;
  letter-spacing:.08em;text-transform:uppercase;opacity:.8;
  pointer-events:none;
}
#keyOverlay .key-label{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  font-family:'Courier New',monospace;font-size:12px;font-weight:700;
  color:#f0c020;letter-spacing:.14em;text-transform:uppercase;opacity:.9;
  pointer-events:none;
}
</style>
</head>

  { question: "Slotin instinctively reacted the moment his screwdriver slipped. What did he do to stop the chain reaction?", choices: ["Flooded the room with water from emergency pipes", "Threw himself on top of the assembly to shield the others", "Knocked the two beryllium hemispheres apart with his hands"], correct: 2 },

  { question: "Stanislaw Ulam came up with a crucial insight that broke open the hydrogen bomb design problem. His calculation showed that Teller's original design was what?", choices: ["Technically sound but too expensive", "Not workable because of energy losses", "Only viable with tritium, not deuterium"], correct: 1 },

  { question: "Stanislaw Ulam survived a near-fatal attack of encephalitis in 1946. What lasting effect did this have on his intellectual approach, according to colleagues?", choices: ["He became more visual and geometric in his thinking rather than algebraic", "He lost much of his calculation speed but retained deep intuition", "He became far more methodical and less prone to bold intuitive leaps"], correct: 0 },

  { question: "Szilard was described by colleagues as brilliantly but 'completely flaky.' What was notable about his living arrangements after arriving in the U.S. in 1938?", choices: ["He slept in his office at the Met Lab", "He lived in a hotel in Chicago for years", "He stayed exclusively in other scientists' guest rooms"], correct: 1 },
  { question: "Szilard wrote a short story in 1949 imagining himself on trial for crimes against humanity. What scenario did it depict?", choices: ["The US winning WWII but bombing civilians", "The US losing a war with the Soviet Union", "A future where science itself was put on trial"], correct: 1 },
  { question: "Szilard's 1939 work with Fermi at Columbia confirmed that uranium fission released enough neutrons per fission to sustain a chain reaction. Specifically, they measured what?", choices: ["That each fission of uranium releases approximately 2-3 neutrons", "That U-235 released more neutrons per fission than U-238", "That graphite was an adequate moderator for a chain reaction"], correct: 1 },
  { question: "Szilard's famous 1961 novel 'The Voice of the Dolphins' was what kind of fiction?", choices: ["Satirical science fiction exploring arms control and Cold War politics", "Hard science fiction about first contact with alien intelligence", "A realistic thriller about a Soviet nuclear scientist"], correct: 0 },

  { question: "Szilard's post-war scientific contributions included what discovery in molecular biology?", choices: ["Feedback inhibition in enzyme biosynthesis", "The double-helix structure of DNA with Watson and Crick", "The mechanism of DNA transcription into RNA"], correct: 2 },
  { question: "Szilard's Szilard-Chalmers effect (1934) became widely used for what practical purpose?", choices: ["Preparing medical radioisotopes", "Enriching uranium for nuclear reactors", "Purifying plutonium from reactor fuel"], correct: 0 },

  { question: "Technetium-99m is produced from what parent isotope in hospital generators?", choices: ["Molybdenum-99, which beta decays to Tc-99m with a half-life of about 66 hours", "Ruthenium-103, which electron captures to Tc-99m", "Rhenium-186, a heavier homolog that decays downward to Tc-99m"], correct: 0 },

  { question: "Teller was born in Budapest, Hungary, in what year?", choices: ["1908", "1903", "1914"], correct: 0 },

  { question: "The 509th Composite Group arrived on Tinian in June 1945. Other B-29 crews on the island were confused by the 509th's unusual behavior. They flew practice runs over Japan but never seemed to drop conventional bombs on the target runs. What had the 509th actually been dropping on these runs?", choices: ["Single orange-colored bomb-shaped casings filled with high explosives (called 'pumpkins')", "Dummy bombs filled with concrete to test delivery accuracy", "Smoke markers only"], correct: 0 },

  { question: "The Alpher-Bethe-Gamow paper (1948) predicted that the Big Bang would leave a background of thermal radiation throughout the universe. This was observed in 1965 by Penzias and Wilson as the Cosmic Microwave Background (CMB). The CMB temperature is approximately what?", choices: ["About 2.7 Kelvin", "About 27 Kelvin", "About 0.27 Kelvin"], correct: 0 },

  { question: "The Alsos mission was named by General Groves using the Greek word for 'grove' as a joke at his own expense. The mission was commanded militarily by Lieutenant Colonel Boris Pash. Who was the scientific director?", choices: ["Robert Furman, Groves's intelligence aide", "Samuel Goudsmit, the Dutch-American physicist", "Frederick Wardenburg, the MIT physicist"], correct: 0 },

  { question: "The B61 nuclear bomb has been the most modernized weapon in the U.S. arsenal, with the B61-12 variant introduced in the 2020s. The modernization added what new capability?", choices: ["Thermonuclear secondary redesigned for variable yield from 0.3 to 50 kilotons", "A new tail kit guidance system that makes it a precision-guided munition, greatly improving accuracy over the legacy gravity bomb", "An EMP-hardened guidance system immune to adversary electronic countermeasures"], correct: 2 },

  { question: "The biographical film 'Oppenheimer' directed by Christopher Nolan starred Cillian Murphy as Oppenheimer. It was based on the Pulitzer Prize-winning biography 'American Prometheus.' Who co-authored that book?", choices: ["Kai Bird and Martin Sherwin", "Richard Rhodes and Barton Bernstein", "Gregg Herken and James Hershberg"], correct: 1 },

  { question: "The boron neutron capture therapy (BNCT) cancer treatment uses what nuclear reaction?", choices: ["Boron absorbs thermal neutrons and emits gamma rays that kill surrounding tissue", "Boron-10 captures a thermal neutron and fissions into two heavy particles that destroy cancer cells", "Boron acts as a neutron moderator to create a localized thermal neutron flux that activates nearby drugs"], correct: 1 },
  { question: "The Bose-Einstein condensate (BEC) was first experimentally created in 1995. The Nobel Prize for this discovery was awarded in 2001 to Eric Cornell, Carl Wieman, and Wolfgang Ketterle. What element did Cornell and Wieman use for the first BEC?", choices: ["Rubidium-87 (Rb-87) — an alkali metal atom cooled to just 170 nanokelvin", "Sodium-23 (Na-23) — used by Ketterle's MIT group", "Helium-4 (He-4) — which becomes superfluid at 2.2 K in a related but different phenomenon"], correct: 0 },

  { question: "The core problem that stalled Neddermeyer's implosion program was his inability to achieve what?", choices: ["Symmetrical, uniform shock waves in the surrounding explosives", "Sufficient detonation speed from the chemical explosives available", "A supply of reactor-produced plutonium to experiment with"], correct: 0 },

  { question: "The critical mass of a fissile material is inversely proportional to the square of its density. If you double the density by implosion, the critical mass is reduced by what factor?", choices: ["By half", "By one-quarter", "By one-eighth"], correct: 2 },
  { question: "The Crossroads Baker underwater test in 1946 produced a massive column of radioactive water. Why were the contaminated target ships nearly impossible to decontaminate?", choices: ["Radioactive water vapor condensed on every surface and couldn't be scrubbed off effectively", "Sand and silt from the lagoon bottom coated all surfaces with radioactive debris", "The heat from the blast fused radioactive particles to the steel hulls"], correct: 0 },
  { question: "The Cuban Missile Crisis was resolved with a public U.S. pledge not to invade Cuba and a secret agreement to do what?", choices: ["Reduce the U.S. nuclear stockpile by 10%", "Remove U.S. Jupiter missiles from Turkey within six months", "Halt all U-2 reconnaissance flights over Soviet territory"], correct: 1 },
  { question: "The Demon Core — the plutonium sphere involved in both fatal accidents — was initially scheduled to be shipped to Tinian. When was this shipment cancelled?", choices: ["After Japan announced it would accept surrender terms on August 15, 1945", "After the Nagasaki bombing, as the War Department decided two demonstrations were sufficient", "After the Trinity test"], correct: 0 },
  { question: "The 'Demon Core' — the plutonium sphere involved in the Daghlian and Slotin accidents — was originally intended to be used in a third atomic bomb after Nagasaki. What happened to it instead?", choices: ["It was melted down and its plutonium recycled into other weapons after the accidents", "It was destroyed in a subcritical test at Trinity in 1946", "It was used as a test source for criticality experiments and eventually melted down"], correct: 0 },
  { question: "The Demon Core was used in what final experiment before being melted down?", choices: ["A subcritical neutron multiplication test at Los Alamos in 1946", "A criticality test called Zero Energy Experimental Pile at Chalk River", "A nuclear test at Bikini Atoll in Operation Crossroads"], correct: 0 },

  { question: "The Demon Core was originally intended to be used as the fissile core of what?", choices: ["The Trinity test Gadget", "A reserve bomb for use against Germany", "The third atomic bomb that would have been dropped on Japan"], correct: 2 },

  { question: "The desert sand at the Trinity test site was fused into glass by the heat of the explosion. This greenish glass was later nicknamed what?", choices: ["Atomite", "Trinitite", "Gadgetite"], correct: 1 },

  { question: "The Einstein-Szilard letter was drafted primarily by Szilard and delivered to President Roosevelt in which year?", choices: ["1937", "1939", "1941"], correct: 1 },

  { question: "The element einsteinium (element 99) was discovered in the fallout from Ivy Mike in 1952. How was it collected?", choices: ["It was predicted by Seaborg and then searched for in soil samples", "Fallout was collected by aircraft flying through the cloud and by analysis of coral and debris from the test site", "It was detected in the fireball photographs by spectral analysis"], correct: 1 },
  { question: "The element fermium (atomic number 100) was discovered in the fallout of which nuclear test?", choices: ["The Ivy Mike thermonuclear test of 1952", "The Trinity test of 1945", "The Castle Bravo test of 1954"], correct: 0 },

  { question: "The element nobelium (element 102) was named after Alfred Nobel. The genuine priority for its synthesis was eventually credited to which group?", choices: ["The Joint Institute for Nuclear Research in Dubna, Soviet Union", "The Berkeley group led by Seaborg and Ghiorso", "A Swedish-British team at Stockholm University"], correct: 1 },
  { question: "The element technetium-99m is the most widely used radioisotope in nuclear medicine diagnostic imaging. What does the 'm' stand for?", choices: ["Metastable: it's an excited nuclear state that emits a gamma ray as it decays to the ground state", "Medical: it's a variant approved for medical use", "Modified: indicating the isotope has been chemically modified for biological use"], correct: 0 },
  { question: "The emergency shutdown rod on Chicago Pile-1 was dropped manually. What was the operator with the axe designated to do if something went wrong?", choices: ["Cut the rope holding the safety rod up, dropping it into the pile to stop the reaction", "Strike the control panel to trigger an electromagnetic shutdown", "Slice off and physcially push the cadmium sheet into the pile by hand"], correct: 0 },
  { question: "The EMP (electromagnetic pulse) from a nuclear weapon detonated at high altitude can disable electronics over a vast area. What physical process generates the EMP?", choices: ["Gamma rays from the explosion ionize the upper atmosphere, which then accelerates electrons in Earth's magnetic field", "The electromagnetic radiation from the nuclear fireball directly damages electronics within line of sight", "The thermal radiation from the weapon ionizes the lower atmosphere, creating a conducting plasma that shorts out electrical systems"], correct: 0 },
  { question: "The EMP generated by a high-altitude nuclear detonation was first discovered accidentally in 1962 during what test?", choices: ["The Hardtack I series tests in the Pacific", "The Fishbowl Starfish Prime test, a detonation at high altitude over Johnston Island", "The Dominic series of high-altitude tests over the Pacific"], correct: 1 },
  { question: "The ENIAC computer, completed in 1945, was used to perform calculations relevant to the Manhattan Project and later the hydrogen bomb. It was programmed initially to calculate what?", choices: ["The neutron transport equations for chain reactions in the Hanford reactors", "Artillery firing tables for the Army ", "The hydrodynamics of implosion in the Fat Man design"], correct: 1 },
  { question: "The Enola Gay belonged to a select group of specially modified B-29s known by what specification name?", choices: ["Silverplate", "Firebird", "Longbow"], correct: 0 },

  { question: "The Enola Gay's crew had to wear what protective equipment when the bomb detonated, besides the obvious ear protection?", choices: ["Full body radiation suits developed specifically for the mission", "Arc welder's goggles to protect against the brilliant flash of light from the explosion", "Nothing, as they were far enough away that no protective equipment was deemed necessary"], correct: 0 },
  { question: "The 'exploding bridgewire' detonator developed by Alvarez and Johnston for Fat Man works by what principle?", choices: ["A spring-loaded firing pin strikes a primer cap that ignites the main charge", "A radio signal triggers a chemical detonator in each lens segment", "A capacitor discharges through a fine metal wire, vaporizing it and producing a shockwave that initiates the explosive without a conventional primer"], correct: 2 },

  { question: "The famous coded phone message 'The Italian navigator has just landed in the New World' was answered with a question. Who asked 'Were the natives friendly?'", choices: ["James Conant, president of Harvard", "Vannevar Bush, OSRD director", "General Leslie Groves"], correct: 1 },
  { question: "The fast explosive in the Fat Man implosion lenses was what?", choices: ["Pure RDX", "Composition B (a mixture of RDX and TNT)", "Octol (HMX and TNT mixture)"], correct: 1 },
  { question: "The 'Fat Man' bomb design was tested at Trinity. The 'Little Boy' gun-type design was NOT tested before use at Hiroshima. Why were scientists confident enough to use Little Boy without a prior test?", choices: ["The gun-type design was so simple and reliable that a test was considered unnecessary", "Little Boy had been tested in a sub-nuclear test using depleted uranium to verify the gun mechanism before the full weapon was assembled", "A small-scale proof-of-concept with less than critical mass had been tested at Los Alamos"], correct: 0 },

  { question: "The Fat Man bomb's implosion design compressed the plutonium core. To achieve this, all 32 detonators had to fire within how many microseconds of each other?", choices: ["Within 1 microsecond", "Within 0.5 microseconds", "Within 0.1 microseconds"], correct: 2 },
  { question: "The Fat Man bomb's implosion lens design required two different explosives with different detonation velocities. One was fast (Composition B). What was the slow explosive?", choices: ["Baratol, a mixture of barium nitrate and TNT", "PETN in a slow-detonation formulation", "TNT alone, cast to a specific thickness"], correct: 1 },

  { question: "The Fermi coupling constant GF characterizes the strength of the weak nuclear force as revealed in beta decay. It has units of energy to the power of what?", choices: ["Negative two (inverse square of energy)", "Negative one (inverse energy)", "Zero (dimensionless)"], correct: 2 },

  { question: "The Fermi-Dirac distribution describes the energy distribution of electrons in a metal at temperature T. At absolute zero (T=0), electrons fill all states up to what energy?", choices: ["Zero energy ", "The binding energy of the metal lattice", "The Fermi energy"], correct: 2 },

  { question: "The first breeder reactor to generate electrical power, EBR-I, proved the concept of breeding, producing more fissile material than it consumed. What fissile material did EBR-I produce more of than it burned?", choices: ["Uranium-235 from uranium-238 via fast neutron capture", "Plutonium-239 from uranium-238", "Thorium-232 conversion to uranium-233"], correct: 1 },

  { question: "The first nuclear test conducted in the Southern Hemisphere was by France at Mururoa Atoll in French Polynesia in 1966. France's decision to test there (rather than in Algeria where earlier tests were conducted) was driven by what?", choices: ["Algerian independence", "International pressure from African nations who objected to tests", "Better scientific conditions at Mururoa"], correct: 2 },

  { question: "The Franck Report recommended what alternative to direct military use of the bomb?", choices: ["A demonstration on an uninhabited area or a blockaded harbor, then if Japan refused surrender, military use would be considered", "Sharing the bomb's existence with Japan's leadership and giving a 48-hour ultimatum", "International transfer of the weapon to a UN-controlled body"], correct: 1 },

  { question: "The Franck-Hertz experiment proved atomic energy levels were quantized by showing that electrons could only transfer what amounts of energy to atoms?", choices: ["Specific, discrete amounts corresponding to Bohr's energy levels", "Any amount proportional to their kinetic energy", "Only energy equal to the full ionization potential"], correct: 0 },

  { question: "Yoshio Nishina, the leading figure of Japan's atomic program, is also known for co-authoring an important formula about what with Oskar Klein?", choices: ["Describing the nuclear force between nucleons", "Describing the scattering of photons off free electrons", "The cross section for neutron capture in heavy elements"], correct: 1 },

  { question: "Germany attempted to ship 560 kg of uranium oxide to Japan aboard submarine U-234 in April 1945. What was the outcome?", choices: ["The submarine surrendered to U.S. forces in the Atlantic after Germany's surrender, and the material never reached Japan", "The submarine was sunk by the Royal Navy before leaving European waters", "The cargo arrived in Japan in May 1945 but was far too little to affect the weapons program"], correct: 0 },
  { question: "The Imperial Japanese Navy's nuclear program, the F-Go Project, was led by physicist Bunsaku Arakatsu. Where had he studied abroad before the war?", choices: ["At Copenhagen under Niels Bohr and at Munich under Arnold Sommerfeld", "At the University of Chicago under Compton and at Princeton's Institute for Advanced Study", "At the Cavendish Laboratory under Rutherford and at Berlin University under Einstein"], correct: 2 },

  { question: "A 1946 Atlanta Constitution story by reporter David Snell claimed Japan had successfully tested a nuclear weapon near Hungnam, Korea. How have historians evaluated this claim?", choices: ["It has been accepted — Soviet documents from captured Hungnam facilities confirmed the test after Cold War declassification", "It has been largely dismissed — investigations found no corroborating evidence, no record of scientists traveling to Korea and not returning, and the story relied on a single anonymous source", "It remains officially unresolved — key Soviet archive materials that would settle the question are still classified"], correct: 1 },
  { question: "Japan adopted its Three Non-Nuclear Principles — not to manufacture, possess, or permit nuclear weapons — in 1967. Who announced them?", choices: ["Prime Minister Eisaku Sato, to reassure the Japanese public amid negotiations over the NPT", "Prime Minister Yasuhiro Nakasone, following China's first nuclear test", "Prime Minister Hayato Ikeda, as part of his Income Doubling Plan's peaceful development agenda"], correct: 0 },
  { question: "Japan finally signed the Nuclear Non-Proliferation Treaty in 1970 and ratified it in 1976, but only after what U.S. promise helped secure Japanese agreement?", choices: ["The U.S. promised not to interfere with Japan's pursuit of independent nuclear reprocessing capabilities in its civilian power program", "The U.S. agreed to maintain a permanent nuclear umbrella over Japan via the 1960 Security Treaty", "The U.S. agreed to return Okinawa to Japanese sovereignty without conditions on the nuclear weapons stored there"], correct: 0 },

  { question: "The 'hot line' between Moscow and Washington established in 1963 was NOT originally a telephone. What kind of communication link was it?", choices: ["A secure voice radio channel using military frequencies", "A teletype line running through undersea cables and via satellite", "A coded telegraph line using One-Time Pad encryption transmitted by radio"], correct: 2 },

  { question: "The implosion bomb's design required all of its explosive lenses to detonate within microseconds of each other for a symmetric implosion. Which physicist, working under Norris Bradbury, solved the problem of achieving this precise simultaneous detonation?", choices: ["Luis Alvarez, who developed reliable electric detonators for the purpose", "George Kistiakowsky, who designed precision blasting caps", "James Tuck, who developed the Primacord timing system"], correct: 0 },
  { question: "The implosion concept for a plutonium bomb was first proposed informally by Seth Neddermeyer in spring 1943. Who was the key figure who convinced Oppenheimer it deserved serious attention?", choices: ["James Tuck, the British explosives expert", "John von Neumann, who showed mathematically that symmetric implosion was achievable", "George Kistiakowsky, who had explosives expertise to confirm feasibility"], correct: 1 },
  { question: "The 'implosion lens' technique, where shaped blocks of fast and slow explosive shape a spherical detonation wave, was confirmed to work in Los Alamos tests. The test that proved lens symmetry was adequate for a bomb was code-named what?", choices: ["Jumbo", "RaLa", "Cowpuncher"], correct: 2 },
  { question: "The INF Treaty of 1987 was notable as the first arms control treaty to do what?", choices: ["Eliminate an entire class of nuclear weapons", "Require on-site inspections of nuclear warhead storage facilities", "Reduce total warhead numbers below Cold War peak levels"], correct: 0 },
  { question: "The US withdrew from The INF Treaty in 2019, citing Russian violations. Which specific missile system did the U.S. accuse Russia of deploying in violation of the treaty?", choices: ["The RS-26 Rubezh ICBM, which had a range that fell in the INF-banned range when lightly fueled", "The 9M729 (SSC-8) ground-launched cruise missile, which the U.S. said exceeded the 500 km INF range limit", "The Iskander-M ballistic missile system deployed in Kaliningrad"], correct: 1 },
  { question: "The initiator inside Fat Man was called the Urchin. When the polonium-beryllium layers were crushed together by the implosion, polonium emitted alpha particles that hit beryllium. What did beryllium emit when struck?", choices: ["Neutrons that started the fission chain reaction", "Gamma rays that triggered the chain reaction", "X-rays that initiated fission by the photoelectric effect"], correct: 2 },
  { question: "The Intermediate-Range Nuclear Forces Treaty (INF) was signed in 1987 by Reagan and Gorbachev. The U.S. had deployed what missiles in Europe that the Soviets most objected to?", choices: ["Pershing II ballistic missiles and BGM-109G ground-launched cruise missiles", "Minuteman II ICBMs forward-deployed to Britain and West Germany", "Lance short-range nuclear missiles with sub-500 km range in forward positions"], correct: 0 },

  { question: "The JASON group of academic scientists advising the U.S. government on technical defense matters was founded in 1960 with Feynman among the original members. Their meetings are held in what unusual arrangement to maintain independence?", choices: ["In a classified government facility during summer months, with members free to pursue their own research agenda", "Via secure videoconference from their universities", "At rotating Ivy League university campuses under academic cover"], correct: 2 },

  { question: "The K-25 gaseous diffusion plant at Oak Ridge had a cascade of about how many stages, where each stage enriched UF6 by a factor of about 1.004. To achieve 90% U-235 from natural 0.7% requires approximately how many stages?", choices: ["About 500 stages", "About 2,000 stages", "About 4,000 stages"], correct: 2 },
  { question: "The K-25 gaseous diffusion plant at Oak Ridge, completed in 1945, was the largest building in the world at the time. Its area was approximately how large?", choices: ["About 440,000 square feet", "About 500,000 square feet", "About 600,000 square feet"], correct: 1 },
  { question: "The 'Korean War nuclear threats' of 1950-1951 included President Truman publicly stating that use of the atomic bomb had been 'under active consideration.' This remark caused a crisis because it prompted an emergency visit to Washington by whom?", choices: ["South Korean President Rhee", "UN Secretary-General Trygve Lie", "British Prime Minister Clement Attlee"], correct: 2 },
  { question: "The 'Lady Godiva' bare critical assembly at Los Alamos could be made to pulse briefly supercritical by inserting a small amount of additional fissile material. This brief excursion would produce what visible sign?", choices: ["A loud crack and moderate heat", "A purple-blue glow from ionized air around the assembly", "A blue flash of Cherenkov radiation in the surrounding air"], correct: 2 },
  { question: "The 'Lady Godiva' designation for a bare critical assembly came from what analogy?", choices: ["Lady Godiva rode naked — the assembly was 'nude,' meaning unreflected, with no surrounding neutron reflector", "Lady Godiva's patience — the assembly required extreme patience to assemble safely", "Lady Godiva's golden hair — the polonium coating gave the assembly a golden color"], correct: 0 },

  { question: "The 'levitated pit' design developed after the war suspended the fissile core inside the explosive assembly with a small air gap. This improved yield because of what effect?", choices: ["The shockwave could accelerate across the gap before striking the pit, achieving higher compression velocity", "Neutron reflection from the air gap reduced leakage", "The pit remained cooler, preventing premature initiator activation"], correct: 0 },

  { question: "The 'Little Boy' bomb contained about 64 kg of highly enriched uranium. The bare critical mass of U-235 is about 52 kg. Why did Little Boy need MORE than the bare critical mass?", choices: ["Some uranium was needed in the target holder that couldn't fission", "The gun assembly geometry was less efficient than a sphere", "The designers used extra material as a safety margin to ensure supercriticality even with some neutron leakage"], correct: 2 },
  { question: "The Los Alamos Primer, Serber's April 1943 lecture series, covered five topics. Which was NOT one of them?", choices: ["The critical mass calculation for a gun-type weapon", "The thermodynamics of the nuclear explosion and energy release", "The logistics of delivering the weapon by aircraft to a target"], correct: 0 },
  { question: "The 'magic numbers' in nuclear physics — 2, 8, 20, 28, 50, 82, 126 — represent particularly stable configurations of protons or neutrons. Maria Goeppert Mayer's shell model explained why. The key insight was that nuclear shells are split by what effect?", choices: ["The electromagnetic interaction between proton charges and neutron magnetic moments", "The isospin coupling between protons and neutrons in paired orbits", "A strong spin-orbit coupling force"], correct: 2 },

  { question: "The Manhattan Project chemist Charles Thomas of Monsanto oversaw what crucial production challenge?", choices: ["The purification of polonium-210 for the initiators", "Scaling up the bismuth phosphate process at Hanford to extract plutonium from reactor fuel at an industrial rate", "Developing the hexafluoride process for converting uranium metal to UF6 for gaseous diffusion enrichment"], correct: 0 },
  { question: "The Manhattan Project code '25' meant U-235 and '49' meant Pu-239. What did the code '49' specifically derive from?", choices: ["The last two digits of 239 (its mass number)", "The atomic number of plutonium is 94 and reversed to 49", "The 4th and 9th letters of the alphabet spell out 'di'"], correct: 1 },
  { question: "The Manhattan Project drew uranium ore from mines in which African territory, a fact kept highly secret during the war?", choices: ["The Belgian Congo", "Rhodesia", "South Africa"], correct: 0 },
  { question: "The Manhattan Project physicist John Manley returned to Los Alamos after the war as a laboratory associate director. He was a key organizer of the early American Physical Society meetings where the results of wartime physics were first publicly discussed. These meetings were remarkable because why?", choices: ["They were the largest gatherings of physicists ever assembled in the U.S. up to that point", "The presentations included the first public discussions of neutron cross sections, reactor physics, and fission products", "They attracted Soviet physics observers who were permitted to attend under a post-war scientific exchange program"], correct: 2 },
  { question: "The Manhattan Project physicist Melba Phillips worked with Oppenheimer before the war on the 'Oppenheimer-Phillips process,' which describes what nuclear reaction?", choices: ["The spallation of heavy nuclei by fast protons", "A process where a deuteron strips off its proton or neutron when passing near a nucleus, leaving one behind to create a radioactive product", "The bombardment of lithium by alpha particles to produce helium"], correct: 2 },
  { question: "The Manhattan Project physicist Norman Ramsey later co-founded what organization in 1969 that brought together scientists and engineers to advise Congress on technical matters?", choices: ["The Congressional Office of Technology Assessment", "The Congressional Science and Technology Fellows program through AAAS", "The National Academy of Sciences' Committee on Science and Public Policy"], correct: 2 },
  { question: "The Manhattan Project recruited scientists who were not U.S. citizens but had fled Europe. Approximately what fraction of the senior scientists at Los Alamos were foreign-born?", choices: ["About half the senior scientists were foreign-born", "About 60% were foreign-born", "About 75% were foreign-born"], correct: 0 },
  { question: "Most workers knew only what they needed for their specific task as part of \"compartmentalization.\" Who coined the phrase 'need to know' as a security principle?", choices: ["J. Edgar Hoover of the FBI", "Vannevar Bush of OSRD", "General Groves"], correct: 2 },
  { question: "The Manhattan Project's most expensive single facility was the K-25 gaseous diffusion plant at Oak Ridge, which cost approximately what portion of the total Manhattan Project budget?", choices: ["About 10% ($200 million of $2 billion)", "About 25% ($500 million of $2 billion)", "About 40% ($800 million of $2 billion)"], correct: 2 },

  { question: "The MANIAC computer at Los Alamos, built under Nicholas Metropolis, was used to perform early thermonuclear weapon calculations. MANIAC stands for what?", choices: ["Multiple Automated Numerical Integration and Calculation", "Mathematical Analyzer, Numerical Integrator, and Computer", "Manhattan Atomic Numerical Integrator and Computer"], correct: 1 },
  { question: "The MAUD Committee report of 1941 concluded that an atomic bomb was feasible. Its name came from what source?", choices: ["A phrase in an early telegram from Bohr that ended with the words 'Tell Cockcroft and Maud Ray Kent'", "The name of a Danish maid employed by the Bohr family", "A deliberate nonsense word to confuse German intelligence"], correct: 0 },

  { question: "The Mössbauer effect — recoil-free nuclear gamma ray emission — was discovered by Rudolf Mössbauer in 1958 and earned him the Nobel in 1961. What is the key application that connects it to general relativity?", choices: ["The Mössbauer effect proved that gravity bends light by the angle predicted by general relativity", "The Pound-Rebka experiment used Mössbauer resonance to measure the gravitational redshift of gamma rays traveling upward in Earth's gravity, directly confirming general relativity's prediction of gravitational time dilation", "The Mössbauer effect was used to measure the equivalence of gravitational and inertial mass to 12 decimal places"], correct: 1 },

  { question: "The neutron was predicted by Rutherford in his 1920 Bakerian Lecture. What experiment by Joliot-Curie gave Chadwick the crucial clue for its actual discovery in 1932?", choices: ["They discovered anomalous positron tracks in a cloud chamber", "They bombarded beryllium with alpha particles and produced a penetrating radiation", "They measured a mass defect in lithium that implied a neutral nuclear component"], correct: 1 },

  { question: "The 'nuclear winter' hypothesis was presented in a famous 1983 paper known by the acronym TTAPS. What does TTAPS stand for?", choices: ["Test, Theory, Atmosphere, Physics, Simulation", "Turco, Toon, Ackerman, Pollack, and Sagan", "Thermal, Threshold, Ash, Particle, Smoke"], correct: 1 },

  { question: "The original Little Boy bomb design was called 'Thin Man' before it was shortened. Why was the original design so long?", choices: ["It used a longer gun barrel because the original design was intended for use against submarine pens, requiring a deeper penetrating warhead", "It used a much longer gun barrel to accelerate the uranium bullet to higher velocity, needed because the original design used reactor-bred plutonium before the Pu-240 problem was known", "It had extra fuel and guidance systems for precision delivery that were later removed"], correct: 2 },

  { question: "The physicist Abdus Salam won the Nobel Prize for electroweak theory and also founded the International Centre for Theoretical Physics (ICTP) in Trieste. He was motivated to found ICTP partly by his personal experience. What was that experience?", choices: ["He had been unable to return to work in his native Pakistan because of lack of facilities", "He had been denied a visa to attend a conference in the U.S. due to his Pakistani nationality", "He had watched Pakistani physics students emigrate permanently to the West"], correct: 0 },
  { question: "The physicist Abdus Salam, the first Muslim Nobel Laureate in science, was a member of the Ahmadiyya Muslim community, a sect that the Pakistani government had declared non-Muslim in 1974. This created a unique situation after his Nobel Prize: his gravestone in Pakistan originally included the word 'Muslim' but was changed. What was the gravestone eventually changed to say?", choices: ["'Scientist'", "'First ___ Nobel Laureate'", "'Ahmadi' "], correct: 2 },
  { question: "The physicist Abdus Salam, who shared the Nobel for electroweak theory, is also notable for founding what institution dedicated to scientific education in the developing world?", choices: ["The Tata Institute of Fundamental Research in Bombay", "The African Institute for Mathematical Sciences", "The International Centre for Theoretical Physics"], correct: 2 },
  { question: "The physicist Abdus Salam's work at Imperial College, London on the electroweak theory was done independently of Weinberg's 1967 paper. Salam incorporated the Higgs mechanism in his model given at a lecture in what year?", choices: ["1964 — the same year as Higgs's paper", "1968 — at a lecture in Göteborg, just after Weinberg's published paper but before reading it", "1971 — after Hooft proved the theory was renormalizable"], correct: 1 },
  { question: "The physicist Alain Aspect performed the first experimental tests of Bell's inequalities with entangled photons in 1982. His results conclusively showed what?", choices: ["That quantum mechanics was wrong and local hidden variables were correct", "That Einstein was right and the correlations could be explained by classical hidden variables", "That local hidden variable theories are ruled out and quantum entanglement produces correlations that cannot be explained by pre-existing hidden information in the particles"], correct: 2 },
  { question: "The physicist Alain Aspect's 1982 Bell test experiment used what clever technique to close the 'locality loophole' that previous experiments had left open?", choices: ["He used superconducting qubits that didn't require a light-travel time assumption because they were in direct thermal contact", "He switched the measurement setting (the angle of polarizers) after the photons had left the source but before they reached the detectors, faster than light could travel between them", "He used space-separated detectors on two different continents, making any classical signal from one detector to the other impossibly slow"], correct: 1 },
  { question: "The physicist Alan Guth proposed cosmic inflation in 1980. Inflation was proposed to solve three problems with the standard Big Bang. One is the 'flatness problem.' What is it?", choices: ["The universe is observed to be very flat (Euclidean geometry), but standard Big Bang evolution would make small initial curvature grow with time", "The universe's matter distribution is flat but standard Big Bang predicts large density fluctuations that should have grown into massive structure by now", "The cosmic microwave background has a flat spectrum which the standard Big Bang cannot explain without fine-tuning of photon-baryon ratio"], correct: 1 },
  { question: "The physicist Alan Guth proposed inflation in 1980. The specific problem his inflation model was designed to solve was the magnetic monopole problem. What is the magnetic monopole problem?", choices: ["Grand unified theories predict magnetic monopoles should have been produced in the early universe and they should be as common as protons today, but none have been found", "The absence of magnetic monopoles means Maxwell's equations are asymmetric and inflation was proposed to restore this symmetry", "The Dirac condition requires magnetic monopoles if any electric charge exists and inflation was proposed to dilute them below observability"], correct: 2 },
  { question: "The physicist Albert Einstein's famous objection to quantum mechanics, 'God does not play dice,' was directed at what specific feature of quantum mechanics that he found philosophically unacceptable?", choices: ["The fact that quantum particles can tunnel through classically forbidden barriers", "The inherently probabilistic nature of quantum predictions", "Wave-particle duality"], correct: 2 },
  { question: "The physicist Albert Wohlstetter published a landmark 1959 analysis of SAC (Strategic Air Command) basing vulnerability. His key finding was what?", choices: ["That SAC bombers were vulnerable to Soviet attack on the ground and couldn't retaliate", "That the U.S. nuclear deterrent was far more vulnerable than previously thought", "That SAC bombers needed aerial refueling to reach Soviet targets, creating a logistics vulnerability in the Arctic air corridors"], correct: 1 },
  { question: "The physicist Alexei Abrikosov, Anthony Leggett, and Vitaly Ginzburg shared the 2003 Nobel Prize for condensed matter physics. Leggett's contribution was the theory of what phenomenon?", choices: ["High-temperature superconductivity", "Superfluidity in helium-3", "The quantum Hall effect"], correct: 2 },

  { question: "The physicist Alvin Graves, who received the highest survivable dose in the Slotin accident, eventually returned to work at Los Alamos. He died in 1965, and his death was attributed to what?", choices: ["Chronic radiation-induced health effects from the Slotin accident", "A heart attack unrelated to his radiation exposure", "Leukemia, which was statistically linked to his radiation exposure"], correct: 1 },
  { question: "The physicist Alvin Weinberg advocated strongly for the molten salt thorium reactor concept in the 1960s. He was fired as Oak Ridge director in 1972 partly because he kept asking about long-term nuclear waste storage. The person who fired him was what AEC official?", choices: ["Glenn Seaborg, the AEC chairman", "James Schlesinger, AEC chairman and later CIA Director and Defense Secretary", "Dixy Lee Ray, who succeeded Weinberg's position at Oak Ridge"], correct: 1 },
  { question: "The physicist Alvin Weinberg was fired from Oak Ridge National Laboratory in 1972 after he persistently raised safety concerns. What specific safety concern did he raise most prominently?", choices: ["The risk of steam explosions in light water reactors during a loss-of-coolant accident", "Whether long-term safe storage of nuclear waste for tens of thousands of years was achievable with any confidence", "The risk of reactor-grade plutonium being used in crude nuclear weapons by state actors"], correct: 1 },
  { question: "The physicist Alvin Weinberg, who co-invented the pressurized water reactor while at the Met Lab, later became director of Oak Ridge National Laboratory and developed the concept of what unusual reactor type?", choices: ["The molten salt reactor", "The gas-cooled fast reactor (GCFR) using helium cooling", "The aqueous homogeneous reactor (AHR) using liquid uranium sulfate solution"], correct: 0 },
  { question: "The physicist and arms control advocate Herbert F. York described the 'dilemma of the arms race' as follows: the race continued despite each side trying to be more secure, because what happened?", choices: ["Each new weapon prompted the adversary to develop a counter, leaving both sides less secure than before", "The arms race was controlled by lobbying groups that profited from weapons procurement regardless of security needs", "Each side accurately modeled the other's behavior and both chose defection in the classic prisoner's dilemma"], correct: 0 },
  { question: "The physicist Andrei Linde developed the 'chaotic inflation' scenario as an extension of Guth's original inflation proposal. Linde's key modification was what?", choices: ["He proposed that inflation occurs in bubble nucleation events within a false vacuum", "He showed that inflation could begin from random quantum fluctuations in a simple scalar field without requiring fine-tuned initial conditions", "He proposed eternal inflation"], correct: 1 },
  { question: "The physicist Andrei Sakharov proposed a method to achieve controlled thermonuclear fusion in 1950. This magnetic confinement concept became the tokamak. 'Tokamak' is a Russian acronym for what?", choices: ["Toroidal Kamera with Magnetic Amplification Coils", "Toroidal Chamber with Magnetic Coils", "Thermal Optical Kamera with Magnetically Accelerated Klevatrons"], correct: 2 },
  { question: "The physicist Andrei Sakharov proposed what novel arms control idea in 1967?", choices: ["A complete ban on underground nuclear testing verified by seismic monitoring", "That both the U.S. and USSR should reduce their nuclear arsenals to 200 warheads each", "That the U.S. and Soviet systems would gradually merge into a common democratic socialist society, making nuclear deterrence unnecessary"], correct: 1 },
  { question: "The physicist Andrei Sakharov was expelled from the Soviet Academy of Sciences in 1980 and sent into internal exile. Where was he exiled to?", choices: ["Gorky", "Siberia", "Moscow"], correct: 0 },
  { question: "The physicist Andrei Sakharov's design concept for the sloika (layered cake) thermonuclear weapon alternated layers of what materials?", choices: ["Tritium and plutonium alternating with beryllium reflector layers", "Fissile and fusionable) layers, with the fission layers boosting the fusion burn and vice versa", "Lithium-6 and deuterium layers separated by uranium tamper sheets to enhance compression"], correct: 2 },
  { question: "The physicist Andrei Sakharov's memoir, written secretly and smuggled to the West, was published in 1990. It was titled what?", choices: ["'Dissidence and Physics: A Soviet Scientist Speaks'", "'My Country and the World'", "'Memoirs'"], correct: 2 },
  { question: "What was physicist Andrei Sakharov's 'third idea' that was the key contribution that finally gave the Soviet Union a deliverable hydrogen bomb?", choices: ["Using radiation implosion to compress the secondary", "Using solid lithium deuteride instead of liquid deuterium, solving the cryogenics problem", "Using a composite plutonium-uranium primary for greater primary yield to drive the secondary"], correct: 0 },
  { question: "The physicist Anton Zeilinger pioneered experimental quantum entanglement research and won the Nobel Prize in Physics in 2022 along with Aspect and Clauser. His group at Vienna achieved what first in 1997?", choices: ["The first loophole-free Bell inequality violation", "The first quantum teleportation", "The first Bose-Einstein condensate of photons"], correct: 0 },
  { question: "The physicist Arthur Compton chose the Met Lab location at the University of Chicago for what reason?", choices: ["Because Robert Hutchins, Chicago's president, gave an immediate yes with no conditions when Compton called him", "Because Chicago had the best nuclear physics faculty in the country", "Because the Army had already acquired land adjacent to the campus for a production facility"], correct: 0 },
  { question: "The physicist Arthur Compton made a historic calculation in 1942 that led to the decision to build CP-1. He estimated the probability of an uncontrolled explosion from a runaway reactor as what?", choices: ["Zero", "About 3 in 1 million", "About 1 in 100 million"], correct: 2 },
  { question: "What backup safety mechanism did CP-1 have?", choices: ["A large tank of cadmium solution suspended above the pile that would drop and absorb all neutrons if the pile overheated", "Three types of control: a safety rod held by a rope that could be cut, manually operated rods, and liquid cadmium solution ready to be pumped into the pile", "A remote shutdown system operated from an adjacent building by a physicist watching neutron counters through a window"], correct: 0 },
  { question: "The physicist Arthur Compton organized 'polls' of Manhattan Project scientists at the Met Lab to gauge sentiment about using the bomb. The first poll found what?", choices: ["About 90% favored using the bomb against Japan immediately without warning", "About 15% favored immediate use without warning", "Scientists were exactly evenly split between immediate use and prior demonstration"], correct: 0 },
  { question: "The physicist Arthur Compton was a deeply religious man. He wrote a book in 1940 arguing that quantum mechanics was consistent with free will and religion. What was it called?", choices: ["'Science and Belief in God'", "'The Human Meaning of Science'", "'The Freedom of Man'"], correct: 0 },
  { question: "The physicist Arthur Compton was awarded the Nobel Prize in 1927. He shared the prize with Charles Wilson, who invented the cloud chamber. The cloud chamber had been crucial for doing what?", choices: ["Making the first X-ray images of bone structure that showed the Compton effect in biological tissue", "Making particle tracks visible", "Measuring the speed of gamma rays"], correct: 2 },
  { question: "The physicist Arthur Compton, who oversaw the Met Lab, had discovered the Compton effect in 1923. This was crucial evidence for what theory?", choices: ["That electrons have wave properties", "That X-rays undergo diffraction from crystal lattices", "That light consists of particles with momentum"], correct: 2 },
  { question: "The physicist Arthur Holly Compton chose the code name 'Metallurgical Laboratory' as cover for the Chicago nuclear research. When the cover was later seen as inadequate, a second cover was considered. The actual cover story given to most University of Chicago employees not directly involved was that the lab was researching what?", choices: ["New methods of extracting metals from ores for weapons manufacturing", "The metallurgical properties of uranium for use in armor-piercing shells", "Methods to achieve industrial-scale production of metallic uranium for an unspecified government application"], correct: 2 },
  { question: "The physicist Arthur Holly Compton was awarded the Nobel Prize for the Compton effect in 1927. He shared the Nobel Prize that year with who?", choices: ["Ernest Rutherford, for artificial transmutation", "Charles Wilson, for inventing the cloud chamber", "Albert Einstein, for the photoelectric effect"], correct: 1 },
  { question: "The physicist Arthur Wahl co-discovered plutonium with Seaborg and two others at Berkeley in February 1941. The other co-discoverers were McMillan and who?", choices: ["Joseph Kennedy", "Philip Abelson", "Emilio Segrè"], correct: 0 },
  { question: "The physicist Bernard Brodie, a Yale political scientist, wrote the first major work arguing nuclear weapons had transformed the purpose of military power. His 1946 book argued what?", choices: ["That nuclear weapons made conventional armies obsolete and the U.S. should convert to an all-nuclear defense", "That military forces now exist to prevent war rather than fight it", "That nuclear weapons would proliferate to all nations within 20 years, making traditional national security thinking irrelevant"], correct: 1 },
  { question: "The physicist Bertrand Russell, who co-authored the Einstein-Russell Manifesto, was also a philosopher and received what Nobel Prize?", choices: ["The Nobel Peace Prize in 1950", "The Nobel Prize in Literature in 1950", "He did not receive a Nobel Prize"], correct: 1 },
  { question: "The physicist Bruno Pontecorvo, a member of Fermi's Rome group who later worked on the Manhattan Project in Canada, defected to the Soviet Union in 1950. He had proposed what important idea in neutrino physics?", choices: ["That neutrinos travel at exactly the speed of light", "That neutrinos come in different flavors that can oscillate between types", "That the neutrino has a small but non-zero mass"], correct: 1 },
  { question: "Neutrino oscillations was confirmed experimentally in what year?", choices: ["1987, by the Kamiokande detector in Japan", "1998, by the Super-Kamiokande experiment", "2002, by the SNO experiment in Canada"], correct: 1 },
  { question: "The physicist Bruno Rossi, who worked at Los Alamos on particle detection, is also known for his pioneering work in cosmic ray physics. He later co-founded what branch of astronomy?", choices: ["Radio astronomy", "Infrared astronomy ", "X-ray astronomy"], correct: 2 },
  { question: "The physicist Bruno Rossi's cosmic ray research in the 1930s discovered that cosmic rays coming from the east and west have different intensities. What did this east-west asymmetry prove?", choices: ["That cosmic rays travel faster from east to west due to Earth's rotation", "That cosmic rays are isotropic in the upper atmosphere", "That primary cosmic rays are predominantly positively charged particles"], correct: 2 },
  { question: "The physicist Chen-Ning Yang, who won the Nobel for parity violation, also made what contribution to condensed matter physics that is now considered fundamental?", choices: ["The Yang-Baxter equation", "The Yang-Mills instanton ", "The Yang oscillator"], correct: 2 },
  { question: "The physicist Carl Anderson discovered the positron in 1932, two years before Dirac's theoretical prediction became widely accepted. Anderson was studying what type of radiation?", choices: ["Radiation from radioactive decay sources in his laboratory", "Cosmic rays using a cloud chamber in a magnetic field", "Radiation from nuclear reactions induced in a particle accelerator"], correct: 1 },
  { question: "The physicist Carl Sagan was not a nuclear physicist but became one of the most prominent voices against nuclear weapons, partly through co-authoring the TTAPS paper. He also testified before Congress about nuclear winter in what year?", choices: ["1983", "1986", "1990"], correct: 0 },
  { question: "The physicist Carl Sagan, who popularized SETI, was a student and protégé of what Manhattan Project-era physicist who ran the key planetary science laboratory?", choices: ["Enrico Fermi", "Gerard Kuiper ", "Harold Urey"], correct: 2 },
  { question: "The physicist Carlo Rubbia and his CERN team needed about how many proton-antiproton collisions to find each W boson candidate event in 1983?", choices: ["About 1 million collisions per event", "About 1 billion collisions per W event", "About 100,000 collisions per event"], correct: 0 },
  { question: "The physicist Carlo Rubbia and Simon van der Meer won the Nobel Prize in Physics for the W and Z boson discovery in 1984. The Nobel was awarded just one year after the discovery was announced which was unusually fast. Why was the award expedited?", choices: ["The CERN director pushed for rapid recognition to counter criticism that CERN was not producing Nobel-worthy physics", "The evidence was so clear and complete that there was no need for the usual waiting period to confirm the result", "Rubbia's age made waiting inadvisable "], correct: 0 },
  { question: "The physicist Carlo Rubbia proposed building an 'energy amplifier' in the 1990s — a subcritical reactor driven by a proton accelerator to produce energy from thorium. What is the main safety advantage of this design?", choices: ["The thorium fuel cycle produces no plutonium, eliminating the proliferation risk of reactor-grade plutonium", "The reactor operates permanently subcritical", "The liquid thorium fuel dissolves fission products as they form, preventing their accumulation and eliminating the xenon poisoning problem"], correct: 2 },
  { question: "The physicist Carlo Rubbia, who discovered the W and Z bosons, proposed building a proton-antiproton collider at the CERN SPS ring. His key collaborator Simon van der Meer invented what technique that made the collider possible?", choices: ["A superconducting magnet focusing system", "Stochastic cooling", "A liquid hydrogen jet target"], correct: 1 },
  { question: "The physicist Cecil Powell at Bristol discovered the charged pion in 1947 using photographic emulsions to detect cosmic ray tracks. He won the Nobel Prize in Physics in what year?", choices: ["1948", "1950", "1955"], correct: 1 },
  { question: "The physicist Cecilia Payne-Gaposchkin discovered that stars are predominantly hydrogen. Her thesis advisor Henry Norris Russell initially convinced her not to publish this conclusion as it contradicted conventional wisdom. When Russell reached the same conclusion independently two years later, he published it and received much of the credit. When did Russell finally acknowledge Payne's priority?", choices: ["After both of their deaths", "In 1929, in his own paper", "In his 1949 AAS presidential address"], correct: 2 },
  { question: "The physicist Cecilia Payne-Gaposchkin spent her entire career at what institution?", choices: ["University of Chicago", "Harvard University", "Caltech"], correct: 1 },
  { question: "The physicist Charles Bennett and Gilles Brassard developed quantum key distribution (QKD) in 1984. Their protocol is called BB84. The security of BB84 rests on what quantum mechanical principle?", choices: ["The uncertainty principle", "Quantum entanglement", "Quantum superposition"], correct: 1 },
  { question: "The physicist Charles Bennett proved in 1973 that computation can be done without dissipating energy andthat logically reversible computation need not generate heat. This resolved a paradox posed by Rolf Landauer who had argued all computation requires energy. Bennett's resolution involved what?", choices: ["Showing that quantum superposition could compute without classical heat dissipation", "Showing that reversible computation could erase bits without energy cost if done in a time-reversal symmetric way", "Showing that the Szilard engine (Maxwell's demon) paradox was resolved by the energy cost of erasing the measurement record"], correct: 2 },
  { question: "The physicist Charles Critchfield, who worked with Bethe on stellar energy, also made contributions to weapons physics at Los Alamos. After the war he worked primarily on what application at Los Alamos?", choices: ["High-explosive lens development ", "Nuclear weapons safety", "Space nuclear power"], correct: 2 },
  { question: "Charles Critchfield calculated the proton-proton chain. The pp chain dominates energy production in what type of star?", choices: ["Very massive, hot O-type stars above 10 solar masses", "All stars", "Medium sized and cooler"], correct: 2 },
  { question: "The physicist Chen-Ning Yang, who co-developed Yang-Mills theory and won the Nobel for parity violation, grew up in China and came to the United States for graduate school. He was at the University of Chicago studying under Enrico Fermi. Yang eventually moved to what institution where he spent most of his career?", choices: ["Caltech", "Princeton", "MIT"], correct: 1 },
  { question: "The physicist Chien-Shiung Wu is known as 'Madame Wu' and was the first person to do what in the field of physics?", choices: ["Measure the magnetic moment of the neutron directly", "Experimentally verify the parity violation in weak interactions predicted by Lee and Yang", "Discover the radioactive decay mode of heavy mesons"], correct: 1 },
  { question: "The physicist Chien-Shiung Wu was born in China and studied in the United States. She was not allowed to return to China after the Communist revolution. Wu built her career in what American institution?", choices: ["Columbia Universitr", "MIT", "Princeton"], correct: 0 },
  { question: "The physicist Claude Cohen-Tannoudji, who shared the 1997 Nobel for laser cooling, is also known for what textbook that became the standard reference in atomic physics?", choices: ["'Laser Cooling and Trapping' ", "'Quantum Mechanics'", "'Photons and Atoms: Introduction to Quantum Electrodynamics'"], correct: 0 },
  { question: "The physicist Clyde Cowan, co-discoverer of the neutrino, sent a telegram to Wolfgang Pauli to inform him his 1930 prediction of the neutrino had been confirmed. Pauli had proposed the neutrino to explain what problem in beta decay?", choices: ["Why beta decay products were sometimes deflected by magnetic fields", "Why the electron emitted in beta decay had a continuous energy spectrum, apparently violating energy conservation unless an undetected particle was also emitted", "Why some nuclei underwent beta decay while others with similar proton-neutron ratios did not"], correct: 2 },
  { question: "The physicist Cornelius Everett collaborated with Ulam on the thermonuclear calculations that showed the classical Super wouldn't work. Everett was known primarily as a mathematician. At which institution did he spend most of his career?", choices: ["Princeton's Institute for Advanced Study", "University of Wisconsin-Madison", "Caltech's mathematics department"], correct: 1 },
  { question: "The physicist Cornelius Everett, who worked with Ulam on the thermonuclear calculations, and Ulam published a joint paper in 1950 showing the classical Super would not work. Their calculation showed that neutrons from the fusion burn would actually do what?", choices: ["Escape before the fusion wave could propagate, quenching the burn", "Heat the deuterium too slowly for the compressed region to ignite before disassembly", "Heat the surrounding material and cause it to expand, cooling the deuterium and quenching the fusion burn"], correct: 2 },
  { question: "The physicist Cyril Smith, who headed metallurgy at Los Alamos, faced a major challenge: plutonium metal was almost impossible to machine because it was so brittle. The solution involved alloying plutonium with small amounts of what metal?", choices: ["Gallium", "Aluminum", "Iron"], correct: 0 },
  { question: "The physicist Cyril Stanley Smith made an important contribution beyond the metallurgy of plutonium at Los Alamos. He organized the casting and metallurgy of what other critical component?", choices: ["The tungsten carbide neutron reflector bricks used in criticality experiments", "The uranium tamper for the Fat Man bomb", "The polonium-beryllium initiator components requiring precise metallurgical techniques"], correct: 0 },
  { question: "The physicist David Bohm developed hidden variable theory after leaving the U.S. due to McCarthyism. He spent most of his later career in what countries?", choices: ["Brazil, then Israel", "Brazil, then Britain", "Britain, then the US again"], correct: 0 },
  { question: "The physicist David Bohm developed his 'hidden variable' interpretation of quantum mechanics in 1952. Who supervised Bohm's PhD, creating a complicated situation when Bohm's theory contradicted the orthodox Copenhagen interpretation?", choices: ["Niels Bohr", "Werner Heisenberg", "J. Robert Oppenheimer"], correct: 2 },
  { question: "The physicist David Bohm's causal interpretation of quantum mechanics was directly inspired by Louis de Broglie's earlier 'pilot wave' idea from 1927. De Broglie had abandoned the pilot wave theory under pressure from Pauli at the 1927 Solvay Conference. Pauli's objection was what?", choices: ["That pilot waves required faster-than-light signals between particle and wave, violating special relativity", "That the pilot wave theory couldn't handle the inelastic scattering of electrons from atoms correctly", "That pilot waves required an absolute rest frame, contradicting Einstein's relativity"], correct: 0 },
  { question: "The physicist David Gross and his student Frank Wilczek made their asymptotic freedom discovery while studying gauge theories to see if they could explain why quarks behave like free particles at short distances. Their key mathematical finding was that QCD's beta function was what?", choices: ["Zero, meaning the strong coupling constant doesn't run with energy at all", "Positive, meaning the strong force gets stronger at short distances, which they expected to be wrong", "Negative, meaning the strong force gets weaker at shorter distances"], correct: 0 },
  { question: "The physicist David Gross won the Nobel Prize for asymptotic freedom. His most important broader contribution was helping to establish what approach to understanding fundamental physics?", choices: ["Supersymmetry as the solution to the hierarchy problem", "The renormalization group as a framework for understanding how physical theories change with energy scale", "Holography and the AdS/CFT correspondence"], correct: 1 },
  { question: "The physicist David Gross, Frank Wilczek, and H. David Politzer won the Nobel in 2004 for discovering asymptotic freedom. This discovery was made in what year?", choices: ["1969", "1973", "1978"], correct: 1 },
  { question: "The physicist David Gross, who won the Nobel for asymptotic freedom in QCD, was a professor at what institution when he made the discovery?", choices: ["MIT", "Princeton", "Harvard"], correct: 1 },
  { question: "The physicist David Politzer, who won the Nobel for asymptotic freedom, later became known for a comment he made at the Nobel ceremony in Stockholm. He was the only one of the three winners (Gross, Wilczek, Politzer) who acknowledged what irony in his Nobel lecture?", choices: ["That the discovery of asymptotic freedom was made during the Vietnam War by draft-age physicists who were protected from conscription by their graduate student status", "That the result was essentially proven by purely mathematical means with no direct experimental input", "That the original paper had been rejected by Physical Review Letters before being accepted in the same journal on resubmission"], correct: 2 },
  { question: "The physicist Dennis Gabor, who invented holography, was also a Hungarian-born physicist who fled Nazism. He invented holography in 1947. What was the original motivation for his invention?", choices: ["He wanted to create 3D images of the inside of nuclear fuel rods without damaging them", "He was trying to improve the resolution of the electron microscope beyond the diffraction limit", "He was developing a new imaging system for detecting flaws in nuclear reactor pressure vessels"], correct: 0 },
  { question: "The physicist Edward Teller developed the 'wet' thermonuclear concept (liquid deuterium) before Ulam's insight. Teller resisted the radiation implosion concept initially. Who finally convinced Teller that radiation implosion was the right approach?", choices: ["John von Neumann, who showed Teller the numbers from Ulam's calculation", "Hans Bethe, who flew to Los Alamos and spent a week convincing Teller the classical super would not work", "Oppenheimer, who personally intervened and told Teller to accept Ulam's result or leave the project"], correct: 2 },
  { question: "The physicist Edward Teller proposed the 'Super' concept at Los Alamos in 1942 based on what insight about the conditions needed for fusion?", choices: ["He calculated that hydrogen fusion requires temperatures of about 100 million degrees, achievable only by a fission explosion as a trigger", "He recognized that once a small fusion plasma was created, a self-sustaining burn wave could propagate through deuterium", "He calculated that lithium hydride could serve as both fuel and moderator in a single compound, making a solid-fueled fusion weapon feasible"], correct: 1 },
  { question: "The physicist Edward Teller received the Presidential Medal of Freedom in 2003, just months before his death. His final years were spent at what institution where he had worked for decades?", choices: ["Los Alamos National Laboratory", "Lawrence Livermore National Laboratory", "Stanford's Hoover Institution"], correct: 1 },
  { question: "The physicist Edward Teller testified against Oppenheimer at the 1954 security hearing. Teller's testimony was interpreted by almost all physicists as a betrayal. After the hearing, the physics community largely ostracized Teller for how long?", choices: ["For the rest of his life and many physicists refused to shake his hand until his death in 2003", "For about a decade, until détente and the partial test ban brought scientists back together", "Until Teller publicly apologized in 1975 for the harm his testimony caused"], correct: 0 },
  { question: "The physicist Edward Teller was born in Budapest in 1908. He received his PhD from what institution?", choices: ["The University of Munich", "The University of Leipzig", "The Technical University of Karlsruhe"], correct: 0 },
  { question: "The physicist Edward Teller, in a 1979 congressional hearing, made a specific claim about the Three Mile Island accident that became controversial. What did he claim?", choices: ["That TMI proved nuclear plants were safer than the public believed — the radiation released was negligible compared to daily background exposure", "That TMI's safety systems had worked exactly as designed — a 'success of the system' rather than a failure", "That he personally suffered health effects from the radiation released at TMI, which he intended to assess — an unprecedented claim from a weapons physicist"], correct: 1 },
  { question: "The physicist Edward Teller's key wartime role at Los Alamos was in the Theoretical Division. But he spent most of his time on the Super (hydrogen bomb) rather than assigned work. Oppenheimer eventually gave Teller a separate group to work on the Super. What was this group called?", choices: ["The Super Group (S-Group)", "The F-Division (Future Weapons Division)", "No separate group, as Teller worked alone"], correct: 2 },
  { question: "The physicist Edward Witten proved in 1981 what result about supersymmetry that caused great excitement?", choices: ["That supersymmetry is the unique extension of the Poincaré symmetry group", "That if supersymmetry exists in nature, the cosmological constant must be exactly zero", "That supersymmetry breaking requires the existence of the gravitino"], correct: 2 },
  { question: "The physicist Edward Witten, often called the greatest living physicist, has won the Fields Medal (mathematics' highest honor) in addition to every major physics prize. He won the Fields Medal in what year for what work?", choices: ["1985, for his work on anomaly cancellation in superstring theory that launched the first superstring revolution", "1990, for contributions to mathematics coming from physics including work on knot invariants, topological quantum field theory, and string theory", "1995, for demonstrating M-theory unified all five superstring theories"], correct: 1 },
  { question: "The physicist Edward Witten's 1995 discovery of M-theory unified five distinct superstring theories. He proposed that all five are different limits of a single 11-dimensional theory. The 'M' in M-theory has not been officially defined. Witten suggested what it might stand for?", choices: ["'Mega'", "'Magic, Mystery, or Membrane' ", "'Minimal'"], correct: 1 },
  { question: "The physicist Edwin McMillan, who co-discovered neptunium with Philip Abelson at Berkeley in 1940, independently invented the synchrotron concept that solved the energy limitation of cyclotrons. He shared the Nobel Prize in Chemistry in 1951 with whom?", choices: ["Philip Abelson, his neptunium co-discoverer", "Glenn Seaborg, for their shared work on transuranium elements", "Ernest Lawrence, for the cyclotron"], correct: 1 },

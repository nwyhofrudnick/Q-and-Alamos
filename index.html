  { question: "The physicist Sheldon Glashow, who proposed electroweak unification, is known for a colorful way of describing the Standard Model. He said the Standard Model was like a 'gauged ____' — what?", choices: ["'Jigsaw puzzle'", "'Rube Goldberg machine'", "'Picasso'"], correct: 0 },
  { question: "The physicist Sin-Itiro Tomonaga won the Nobel for QED and was also president of Tokyo University of Science during a time of political turmoil. Japan's Zengakuren student movement in the 1960s forced him to deal with campus protests. Tomonaga had himself been a student during Japan's militarist era. His attitude toward the student protesters was what?", choices: ["He called in police to maintain order, prioritizing academic stability over student politics", "He was sympathetic and he believed the students had a right to protest even if he disagreed with some tactics", "He supported the students completely, leading a delegation of professors to march with them in protest against U.S. nuclear policy in Japan"], correct: 0 },
  { question: "The physicist Sin-Itiro Tomonaga, the Japanese physicist who independently developed QED and shared the 1965 Nobel with Feynman and Schwinger, did his work under extraordinary conditions. When did he do his key QED calculations?", choices: ["Before the war, in 1939-40, visiting Heisenberg in Leipzig", "During WWII in wartime Japan, without access to American physics journals and with minimal resources", "After the war ended, from 1946 to 1949 in Tokyo with American support"], correct: 1 },
  { question: "The physicist Stanislaw Ulam, who co-invented Monte Carlo simulation, also proposed a concept for computer science that bears his name. The 'Ulam spiral' is a visualization of what?", choices: ["A method of sorting data using a spiral pattern that reduces average comparisons", "Prime numbers", "The distribution of nuclear fission events in a chain reaction over time, showing the branching process"], correct: 1 },
  { question: "The physicist Stephen Hawking's most famous prediction — Hawking radiation — states that black holes emit thermal radiation and eventually evaporate. The temperature of Hawking radiation for a black hole of mass M is what?", choices: ["T = 8πGMk_B — proportional to mass, so larger black holes are hotter", "T = ℏc³/(8πGMk_B), inversely proportional to mass, so smaller black holes are hotter", "T = ℏc/(4πGMk_B), exactly half of the correct formula, derived from a semi-classical approximation that Hawking later corrected"], correct: 1 },
  { question: "The physicist Steven Chu won the Nobel Prize in Physics in 1997 for laser cooling of atoms. He later became what government official?", choices: ["Director of the National Science Foundation under President Bush", "U.S. Secretary of Energy under President Obama", "Chairman of the Atomic Energy Commission under President Clinton"], correct: 1 },
  { question: "The physicist Steven Weinberg died in July 2021. His last paper, submitted just before his death, was about what topic?", choices: ["The cosmological constant problem", "Asymptotic safety", "Parton distributions in the proton"], correct: 2 },
  { question: "The physicist Steven Weinberg spent the last decades of his career at what university?", choices: ["Harvard, where he was a long-time professor", "Caltech, where he moved after leaving Harvard", "The University of Texas at Austin"], correct: 2 },
  { question: "The physicist Steven Weinberg, in the year before his death (2020), gave a final public lecture at a major physics conference. His lecture expressed concern about what trend in theoretical physics?", choices: ["The domination of string theory", "The fragmentation of physics into separate specialties without communication", "The decline of global physics education"], correct: 1 },
  { question: "The physicist Steven Weinberg, who shared the Nobel for electroweak theory, wrote a famous popular science book in 1977 about the Big Bang. What was it called?", choices: ["'The First Three Minutes: A Modern View of the Origin of the Universe'", "'Before the Beginning: A Cosmological History'", "'The Big Bang: From Planck Time to the Present Universe'"], correct: 0 },
  { question: "The physicist Subrahmanyan Chandrasekhar calculated in 1930 that white dwarf stars above a certain mass would collapse further as they couldn't be supported by electron degeneracy pressure. Arthur Eddington publicly and humiliatingly attacked this conclusion. Who was later proven correct?", choices: ["Eddington — stars above Chandrasekhar's limit produce neutron stars, not black holes as Chandrasekhar predicted", "Chandrasekhar — his calculation was correct, and massive stellar remnants above his limit collapse to neutron stars or black holes", "Both were partially correct — the Chandrasekhar limit applies to white dwarfs but Eddington correctly argued it doesn't apply to other stellar remnants"], correct: 2 },
  { question: "The physicist Subrahmanyan Chandrasekhar, who won the Nobel Prize in 1983, spent most of his career at what institution?", choices: ["Caltech", "The University of Chicago", "Princeton"], correct: 1 },
  { question: "The physicist Teller's 'super' concept originally involved igniting a tube of liquid deuterium with a fission bomb. Ulam proved in 1950 that this classical super design would not work. What was the specific physical reason it failed?", choices: ["The fission primary produced too little neutron flux to ignite the deuterium at its ends", "The radiation from the primary heated and blew apart the secondary before the fusion burn could propagate", "The liquid deuterium required so much tritium to ignite that the tritium production requirement was industrially impossible"], correct: 1 },
  { question: "The physicist Theodore Hall passed bomb design information to the Soviet Union and was never charged. Hall later became a distinguished researcher in what scientific field at Cambridge University?", choices: ["Nuclear medicine imaging", "Electron microscopy of biological specimens", "Radiation therapy linear accelerator design"], correct: 1 },
  { question: "The physicist Theodore Hall, who spied for the Soviet Union, attended Harvard at what unusually young age?", choices: ["He entered Harvard at age 16", "He entered Harvard at 15", "He entered Harvard at 14"], correct: 0 },
  { question: "The physicist Theodore Taylor designed the smallest nuclear weapon ever made — the Davy Crockett — while at Los Alamos. This was a recoilless rifle round that could be fired by infantry. What was the yield of the smallest operational nuclear weapon in the U.S. arsenal?", choices: ["About 1 megaton", "About 10-20 tons of TNT", "About 100 kilotons"], correct: 1 },
  { question: "The physicist Val Fitch and James Cronin discovered CP violation in the decay of what particles?", choices: ["Pi mesons (pions)", "K mesons (kaons)", "D mesons"], correct: 1 },
  { question: "The physicist Vannevar Bush, who organized wartime American science, had a major disagreement with Oppenheimer's later arms control advocacy. Bush believed the approach to Soviet relations should be what?", choices: ["Negotiation from strength", "Immediate international control before the Soviets developed their own bomb", "Selective sharing of basic nuclear science with allies but not with the Soviets"], correct: 1 },
  { question: "The physicist Vannevar Bush, whose 'Science: The Endless Frontier' report led to the NSF, had also helped create the radar and other WWII technologies through the National Defense Research Committee. He is buried in what famous location?", choices: ["Arlington National Cemetery in Arlington, Virginia", "MIT's campus chapel in Cambridge, Massachusetts", "The Congressional Cemetery in Washington D.C."], correct: 2 },
  { question: "The physicist Vera Rubin's observation that galaxy rotation curves remain flat far from galactic centers, rather than declining as expected from visible matter, was one of the key pieces of evidence for dark matter. Her measurements of what galaxy in the 1970s were particularly influential?", choices: ["The Andromeda Galaxy (M31)", "The Milky Way", "The Virgo Cluster"], correct: 1 },
  { question: "The physicist Victor Weisskopf made an important contribution to the Manhattan Project's understanding of what nuclear property that was critical for bomb design?", choices: ["The spontaneous fission rate of Pu-240", "The nuclear level density", "The neutron mean free path in uranium metal at weapons-relevant densities"], correct: 1 },
  { question: "The physicist Victor Weisskopf made foundational contributions to nuclear physics before and after Los Alamos. His 'evaporation model' of nuclear reactions described nuclear particles being emitted from a hot nucleus analogous to what process?", choices: ["Radioactive decay of unstable isotopes", "Molecules evaporating from the surface of a heated liquid", "Electrons escaping from a hot metal filament (thermionic emission)"], correct: 1 },
  { question: "The physicist Victor Weisskopf served as director general of CERN from 1961 to 1965. He is known for what pithy summary of his view of science?", choices: ["'Physics is not about knowing everything, it's about knowing what questions to ask'", "'There are two kinds of physics, good physics and physics that hasn't found its application yet'", "'The gift of physics to humanity is not bombs or power plants but the understanding of nature, and that understanding is a human right'"], correct: 2 },
  { question: "The physicist Victor Weisskopf was a student of Niels Bohr in Copenhagen and of Max Born in Göttingen. He wrote a famous paper in 1934 with Viktor Wigner on gamma ray line widths in nuclear spectra. What did this Wigner-Weisskopf theory describe?", choices: ["The splitting of spectral lines in a magnetic field due to nuclear magnetic moments", "The natural line width of spectral transitions", "The Doppler broadening of nuclear gamma lines due to thermal motion of nuclei in a crystal lattice"], correct: 1 },
  { question: "The physicist Victor Weisskopf wrote 'The Joy of Insight: Passions of a Physicist,' a memoir of his life from Vienna through Los Alamos and CERN. He characterized what as the 'most important development in physics in the 20th century'?", choices: ["The development of nuclear weapons, which he considered the defining physics achievement regardless of its moral implications", "Quantum mechanics, which he called a complete revolution in our understanding of nature", "The unification of the electromagnetic and weak forces, which he saw as the culmination of the quantum era"], correct: 1 },
  { question: "The physicist Vitaly Ginzburg, who shared the Nobel Prize in Physics in 2003 for condensed matter physics, was a prominent Soviet physicist. He and Landau developed the Ginzburg-Landau theory of what phenomenon?", choices: ["Ferromagnetism", "Superconductivity", "The quantum Hall effect"], correct: 2 },
  { question: "The physicist Werner Heisenberg was actually a competitive ping-pong player in his youth and nearly pursued a career in music. Which instrument did he play?", choices: ["Violin", "Piano", "Cello"], correct: 1 },
  { question: "The physicist Walter Kohn fled Austria as a teenager in 1939 on a Kindertransport to England, then emigrated to Canada. He received his PhD at Harvard. Before his Nobel Prize for DFT, he won what award for his contributions to condensed matter physics?", choices: ["The National Medal of Science from President Clinton in 1988", "The Buckley Prize of the American Physical Society for condensed matter physics", "The Dirac Medal from ICTP"], correct: 0 },
  { question: "The physicist Walter Kohn, who developed density functional theory, was born in Vienna and came to the U.S. via Britain as a refugee. He worked briefly at Los Alamos before pursuing academic physics. His DFT work enabled what practical applications?", choices: ["Predicting nuclear fission cross sections without expensive experiments", "Designing new materials, drugs, and catalysts by calculating electronic structure computationally", "Modeling thermonuclear plasmas for fusion energy research"], correct: 1 },
  { question: "The physicist Walter Zinn, director of Argonne, built the first fast breeder reactor EBR-I in Idaho. He also co-designed CP-1 with Fermi. Zinn was born in what country?", choices: ["Canada", "Germany", "Hungary"], correct: 0 },
  { question: "The physicist Werner Heisenberg spent the winter of 1924-25 visiting Niels Bohr in Copenhagen, where he absorbed the Copenhagen approach to atomic physics. The following summer, sick with hay fever and recovering on the island of Helgoland, he made the breakthrough that became matrix mechanics. What specific problem was he working on when the breakthrough came?", choices: ["The helium atom spectrum — a two-electron problem that Bohr's model failed to solve", "The hydrogen atom spectrum — but specifically the intensities of spectral lines, not just their frequencies, which classical quantum theory couldn't explain", "The anomalous Zeeman effect — the splitting of spectral lines in magnetic fields"], correct: 2 },
  { question: "The physicist Werner Heisenberg, asked near the end of his life what problem had most fascinated him over his career, reportedly said it was what?", choices: ["The measurement problem in quantum mechanics", "The role of mathematics in physics", "The reconciliation of quantum mechanics with general relativity"], correct: 0 },
  { question: "The physicist Werner Heisenberg, asked what he considered the hardest problem in physics, reportedly named what?", choices: ["Quantum gravity — unifying general relativity with quantum mechanics", "Consciousness — how subjective experience arises from physics", "Turbulence — the absence of a complete theoretical description of turbulent fluid flow"], correct: 2 },
  { question: "The physicist Werner Heisenberg's matrix mechanics formulation of quantum mechanics was developed in 1925. What mathematical object did Heisenberg use to represent physical observables?", choices: ["Differential operators acting on wave functions in Hilbert space", "Phase-space probability distributions following Liouville's theorem", "Matrices where multiplication is non-commutative"], correct: 2 },
  { question: "The physicist Werner Heisenberg's matrix mechanics of 1925 used only experimentally observable quantities — energy levels and transition probabilities — not orbits or positions. This was inspired by what philosophical principle?", choices: ["Mach's principle", "Bohr's complementarity", "Einstein's relativity"], correct: 2 },
  { question: "The physicist Werner Heisenberg's uncertainty principle ΔxΔp ≥ ℏ/2 was first derived using a thought experiment involving what device?", choices: ["A double slit", "A Geiger counter ", "A gamma-ray microscope"], correct: 2 },
  { question: "The physicist Wernher von Braun, who led V-2 rocket development for Nazi Germany and later the Saturn V for NASA, surrendered to American forces in 1945. He came to the United States under what program?", choices: ["Operation Alsos", "Operation Paperclip", "Operation Lusty"], correct: 1 },
  { question: "The physicist Willard Libby, who developed radiocarbon dating, worked at the Met Lab during the Manhattan Project. His C-14 dating method relied on knowing the ratio of C-14 to C-12 in the atmosphere. What natural process constantly replenishes atmospheric C-14?", choices: ["Cosmic ray protons bombarding atmospheric oxygen", "Solar ultraviolet radiation splitting CO2 molecules", "Cosmic ray neutrons bombarding atmospheric nitrogen-14"], correct: 2 },
  { question: "The physicist Willard Libby's radiocarbon dating method uses the known half-life of C-14 to calculate how long ago organic material died. The method works because C-14 is only produced in the atmosphere, not in biological tissue. What is the maximum age that radiocarbon dating can reliably determine?", choices: ["About 10,000 years", "About 50,000 years", "About 100,000 years"], correct: 1 },
  { question: "The physicist William Daniel Phillips won the Nobel Prize for laser cooling alongside Chu and Cohen-Tannoudji in 1997. He developed what specific technique for trapping cold atoms?", choices: ["The magneto-optical trap", "Evaporative cooling in a magnetic trap", "The Zeeman slower"], correct: 0 },
  { question: "The physicist William Penney, who led Britain's nuclear weapons program, was given what nickname by the British press, aside from 'Bill'?", choices: ["'The Smiling Bomb-Maker'", "'Britain's Oppie'", "'The Atomic Baron'"], correct: 0 },
  { question: "The physicist William Penney, who led Britain's post-war nuclear weapons program, was a key member of the Hiroshima and Nagasaki damage assessment teams. What did this work involve?", choices: ["Flying over the cities to photograph the destruction from altitude", "Traveling to Japan after the surrender to directly measure the bomb damage and determine yields from building collapse patterns", "Analyzing radio intercepts from Japan to determine the extent of the bomb's destructive effects"], correct: 0 },
  { question: "The physicist William 'Willy' Higinbotham, who worked on the electronics for the bomb delivery at Hiroshima and Trinity, became FAS's first chairman and later created a primitive electronic game at Brookhaven in 1958. He reportedly said about his role in creating 'Tennis for Two' — one of the first video games — that it was what?", choices: ["'The most important thing I ever did'", "'The most trivial thing I ever did, and the most remembered'", "'The only thing I did that brought people joy rather than terror'"], correct: 2 },
  { question: "The physicist Willis Lamb, Oppenheimer's student who measured the Lamb shift, made his measurement using what novel technique?", choices: ["Optical spectroscopy", "Microwave spectroscopy", "X-ray absorption spectroscopy"], correct: 1 },
  { question: "The physicist Wolfgang Ketterle, who shared the Nobel for BEC, made a specific contribution that extended the technique. What did he add to the Cornell/Wieman result?", choices: ["He created a BEC of sodium independently", "He trapped BEC in an optical lattice", "He developed atom lasers"], correct: 0 },
  { question: "The physicist Wolfgang Pauli proposed the neutrino in 1930 in a letter to \"radioactive ladies and gentlemen\" at a conference in Tübingen. He called his proposal 'a desperate remedy.' He reportedly said he had done something 'terrible' — proposing a particle that could never be detected because it interacted so weakly. The neutrino was finally detected in what year?", choices: ["1945, using detectors placed near the Hanford reactors", "1950, by detecting atmospheric neutrinos from cosmic ray muon decay", "1956, by Reines and Cowan at the Savannah River Plant"], correct: 2 },
  { question: "The physicist Wolfgang Pauli proposed the neutrino in a letter beginning 'Dear radioactive ladies and gentlemen.' He addressed it to what meeting?", choices: ["The 1930 Solvay Conference in Brussels", "A Radioactivity Conference in Tübingen in December 1930", "The 1930 Niels Bohr Institute winter meeting in Copenhagen"], correct: 2 },
  { question: "The physicist Wolfgang Pauli won the Nobel Prize in Physics in 1945 for the discovery of what principle?", choices: ["The neutrino", "The exclusion principle", "The uncertainty principle"], correct: 2 },
  { question: "The physicist Yakov Zel'dovich, Kurchatov's key theoretical physicist on the Soviet bomb, is credited with what contributions to astrophysics and cosmology after his classified work?", choices: ["Co-developing the theory of black hole evaporation with Hawking in the early 1970s", "The distortion of the cosmic microwave background by hot gas in galaxy clusters", "A method for calculating the large-scale structure of the universe from initial density perturbations"], correct: 2 },
  { question: "The physicist Yoichiro Nambu won the Nobel Prize in Physics in 2008 for his work on spontaneous symmetry breaking in particle physics. He shared it with Kobayashi and Maskawa. Nambu developed the idea of spontaneous symmetry breaking in what context?", choices: ["He showed that the Higgs mechanism could give mass to gauge bosons without breaking gauge invariance explicitly", "He proposed that the chiral symmetry of strong interactions was spontaneously broken, generating pion masses and explaining nuclear force properties", "He showed that CP symmetry was spontaneously broken in the strong vacuum, creating an asymmetry between matter and antimatter"], correct: 1 },
  { question: "The physicist Yoichiro Nambu worked at the University of Chicago for almost his entire American career. His work on spontaneous symmetry breaking was done in the early 1960s. He is also credited with pioneering what field that later became important in string theory?", choices: ["Supersymmetry", "String theory", "Non-commutative geometry"], correct: 0 },
  { question: "The physicist Yoichiro Nambu's 1960 paper on spontaneous symmetry breaking and the bootstrap theory of the strong force used an analogy from condensed matter physics. He was inspired by what condensed matter phenomenon?", choices: ["Ferromagnetism", "Superconductivity", "Superfluidity"], correct: 2 },
  { question: "The physicist Yoshio Nishina was Japan's leading nuclear physicist and personally knew Bohr, Heisenberg, and other European masters. He led Japan's wartime nuclear research program. Japan's program failed primarily because of what?", choices: ["Active sabotage by Japanese pacifist scientists who deliberately slowed the work", "Lack of uranium ore and the industrial capacity to enrich it", "A moral decision by the Japanese emperor to prohibit weapons research using atomic energy"], correct: 1 },
  { question: "The physicist Yuli Khariton was the scientific director of the Soviet nuclear weapons program from 1946 until 1992. He was called by Soviets 'the father of the Soviet bomb.' Where was the Soviet equivalent of Los Alamos located?", choices: ["At Arzamas-16", "At Chelyabinsk-70", "At Kurchatov City"], correct: 0 },
  { question: "The physicist Yuri Andropov, who briefly led the Soviet Union in 1982-84, was so alarmed by Reagan's SDI and NATO exercises that he did what unprecedented thing in 1981?", choices: ["Ordered the Soviet military to maintain nuclear forces on hair-trigger alert for two years", "Launched Operation RYAN, a massive intelligence-gathering effort to detect signs of a U.S. nuclear first strike", "Proposed unilateral Soviet nuclear reductions to 500 warheads if the U.S. would cancel SDI"], correct: 1 },
  { question: "The plutonium implosion design required explosive lenses of two types — one fast, one slow — to shape a spherical wave. What was the SLOW explosive used in the lenses?", choices: ["TNT", "Baratol", "PETN"], correct: 1 },
  { question: "The plutonium produced largely through Seaborg's work was ultimately used in which bomb?", choices: ["Little Boy (Hiroshima)", "Fat Man (Nagasaki)", "The Trinity Gadget only"], correct: 1 },
  { question: "The plutonium-gallium alloy used in nuclear weapons stabilizes plutonium in the delta phase. The delta phase has a density of about 15.9 g/cm³, which is significantly less dense than the alpha phase at 19.8 g/cm³. Why is the less dense delta phase preferred despite its lower density?", choices: ["The delta phase is fissile while the alpha phase is not", "The delta phase is ductile and machinable while the alpha phase is brittle and shatters; the lower density is an acceptable tradeoff for workability", "The delta phase has a higher fission cross section than the alpha phase"], correct: 1 },
  { question: "The polonium in the Urchin initiator had to be continuously replaced because it has a half-life of approximately how long?", choices: ["About 1/3 of a year", "About 3 years", "About 5 years"], correct: 0 },
  { question: "The polonium-beryllium device at the very center of the bomb's fissile core served what specific function at detonation?", choices: ["It was the initiator", "It acted as a neutron reflector", "It was a tamper designed to hold the assembly together"], correct: 0 },
  { question: "The Potsdam Declaration of July 26, 1945 warned Japan to surrender or face 'prompt and utter destruction.' It was signed by Truman, Churchill, and who?", choices: ["Chiang Kai-shek", "Joseph Stalin", "Charles de Gaulle"], correct: 0 },
  { question: "The 'PUREX' process that replaced bismuth phosphate at Hanford is still used worldwide for nuclear fuel reprocessing. What does PUREX stand for?", choices: ["Plutonium Uranium Reactive EXtraction", "Plutonium URanium EXtraction (using tributyl phosphate solvent)", "Plutonium Uranium Reprocessing EXperiment"], correct: 1 },
  { question: "The quantum chromodynamics (QCD) property of 'color confinement' means that quarks are never found in isolation. This is because the strong force does what as quarks are separated?", choices: ["The force decreases exponentially", "The potential energy increases linearly with distance", "The force becomes repulsive at distances greater than 1 femtometer, confining quarks within that radius automatically"], correct: 1 },
  { question: "The Quebec Agreement of August 1943 established what between the US and UK?", choices: ["A joint nuclear weapons stockpile", "The Combined Policy Committee to coordinate atomic efforts", "A shared intelligence network for the bomb project"], correct: 1 },
  { question: "The Rad Lab at Berkeley is now officially called what?", choices: ["The Ernest Lawrence Berkeley National Laboratory", "The Lawrence Berkeley National Laboratory", "The Berkeley Radiation Laboratory"], correct: 1 },
  { question: "The radiation unit 'gray' (Gy) measures what?", choices: ["Absorbed dose", "Equivalent dose", "The activity of a radioactive source in disintegrations per second"], correct: 0 },
  { question: "The radiation unit 'sievert' (Sv) differs from the gray because it does what?", choices: ["It accounts for the different biological effectiveness of different radiation types", "It measures the dose rate over time rather than total accumulated dose", "It measures the dose to a specific organ rather than whole-body dose"], correct: 0 },
  { question: "The 'RaLa tests' used radiolanthanum as a gamma-ray source to measure the symmetry of the implosion wave. The technique was developed by which physicist?", choices: ["George Kistiakowsky", "Robert Hofstadter", "Donald Hornig"], correct: 2 },
  { question: "The RBMK reactor at Chernobyl had a dangerous 'positive void coefficient.' What does this mean?", choices: ["When control rods were inserted, they briefly increased power before slowing the reaction", "When coolant water boils away, the reactor becomes MORE reactive rather than less", "When the reactor overheats, thermal expansion opens fuel channels and increases power"], correct: 1 },
  { question: "The reactor at Windscale that caught fire in 1957 used what moderator?", choices: ["Graphite", "Heavy water", "Light water"], correct: 0 },
  { question: "Julius and Ethel Rosenberg were convicted in what month and year?", choices: ["March 1951", "April 1951", "June 1951"], correct: 2 },
  { question: "The Rosenbergs were executed for espionage in June 1953. The key information David Greenglass passed to them from Los Alamos was what?", choices: ["A sketch and description of the implosion lens design", "The critical mass of plutonium for an implosion bomb", "The chemical process for separating plutonium from uranium"], correct: 0 },
  { question: "The 'S-1 Committee' was the predecessor to the Manhattan Project. Who chaired it?", choices: ["James Bryant Conant, president of Harvard", "Vannevar Bush, head of OSRD", "Arthur Compton of the University of Chicago"], correct: 0 },
  { question: "The second atomic bombing mission, intended for Kokura as the primary target, ended up dropping the bomb on Nagasaki. Why was Kokura spared?", choices: ["Clouds and drifting industrial smoke obscured the target after three passes", "Kokura had been largely evacuated and was no longer considered a high-value target", "Bockscar's radar equipment failed, preventing the crew from locating the target"], correct: 0 },
  { question: "The separation factor per stage in the gaseous diffusion process for UF6 is approximately what?", choices: ["1.04", "1.004", "1.0004"], correct: 1 },
  { question: "The Shippingport Atomic Power Station in Pennsylvania, the first U.S. commercial nuclear plant, began operation in what year?", choices: ["1957", "1960", "1963"], correct: 0 },
  { question: "The Shippingport Atomic Power Station, the first full-scale civilian nuclear power plant in the U.S., used what type of reactor?", choices: ["A pressurized water reactor, based on naval reactor technology developed under Admiral Rickover", "A boiling water reactor, developed by Argonne National Laboratory", "A graphite-moderated light water reactor based on the Hanford design"], correct: 0 },
  { question: "The single journalist allowed to observe the Trinity test was William Laurence, a reporter for which publication?", choices: ["The Washington Post", "Time magazine", "The New York Times"], correct: 2 },
  { question: "The Smyth Report, released days after Hiroshima, was given what official title?", choices: ["'The Manhattan Project: A Scientific History'", "'The Development of Atomic Weapons, 1939-1945'", "'Atomic Energy for Military Purposes'"], correct: 2 },
  { question: "The Smyth Report, released on August 12, 1945 (six days after Hiroshima), told the public what?", choices: ["The basic history and scientific principles of the atomic bomb program", "The full technical details of bomb design and manufacture", "The names of all key scientists and their specific contributions"], correct: 0 },
  { question: "The social hub of Los Alamos, where both scientific seminars and dances were hosted, was a converted former school building called what?", choices: ["Fuller Lodge", "Ranch Hall", "The Tech Area Annex"], correct: 0 },
  { question: "The Soviet 'Dead Hand' (Perimeter) system was designed to do what if Soviet leadership was destroyed?", choices: ["Launch all remaining missiles automatically without any human command", "Transmit a launch authorization signal to remaining submarine and silo crews automatically if certain trigger conditions were met", "Seal all nuclear bunkers and preserve leadership in hardened facilities for retaliation"], correct: 1 },

// ── SHUFFLE FUNCTION ──
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// ── SHARPIE DRAW FUNCTION ──
function drawSharpieOnEl(textId, canvasId) {
  var textEl = document.getElementById(textId);
  var canvas = document.getElementById(canvasId);
  if (!textEl || !canvas) return;
  var w = textEl.offsetWidth;
  var h = textEl.offsetHeight;
  if (!w || !h) return;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  var lineHeightPx = parseFloat(window.getComputedStyle(textEl).lineHeight) || 19;
  var numLines = Math.round(h / lineHeightPx);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var line = 0; line < numLines; line++) {
    var yCenter = lineHeightPx * line + lineHeightPx * 0.52;
    var passes = [{lw:5.5,alpha:0.18},{lw:4.0,alpha:0.22},{lw:2.8,alpha:0.70}];
    for (var p = 0; p < passes.length; p++) {
      ctx.lineWidth = passes[p].lw;
      ctx.globalAlpha = passes[p].alpha;
      ctx.strokeStyle = '#bb0000';
      ctx.beginPath();
      var segs = 10;
      ctx.moveTo(-1, yCenter + (Math.random()-0.5)*1.5);
      for (var s = 1; s <= segs; s++) {
        ctx.bezierCurveTo(
          w/segs*(s-0.67), yCenter+(Math.random()-0.5)*2.2,
          w/segs*(s-0.33), yCenter+(Math.random()-0.5)*2.2,
          w/segs*s,        yCenter+(Math.random()-0.5)*1.8
        );
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

    const roll = Math.ceil(Math.random() * 6);
    const subshells = {
      1: ['1s'],
      2: ['2s','2p'],
      3: ['3s','3p','3d'],
      4: ['4s','4p','4d','4f'],
      5: ['5s','5p','5d','5f'],
      6: ['6s','6p']
    };
    const opts = subshells[roll];
    const orbital = opts[Math.floor(Math.random() * opts.length)];
    statusLabel.textContent = 'You rolled:';
    result.textContent      = orbital;

    // Allow tap-to-dismiss after a short delay so the triggering click doesn't fire it
    setTimeout(()=>{
      popup.style.pointerEvents = 'auto';

      dieDismissHandler = ()=>{
        popup.classList.remove('show');
        popup.style.pointerEvents = 'none';
        popup.removeEventListener('click', dieDismissHandler);
        dieDismissHandler = null;
        if(dieAutoDismiss){ clearTimeout(dieAutoDismiss); dieAutoDismiss = null; }
        dieRolling = false;
      };
      popup.addEventListener('click', dieDismissHandler);
      dieAutoDismiss = setTimeout(dieDismissHandler, 2200);
    }, 50);

  }, 1000);
}
</script>
</body>
</html>

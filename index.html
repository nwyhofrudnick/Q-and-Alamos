  { question: "The physicist Leonard Susskind developed the idea of the 'holographic principle' in physics, largely inspired by what debate?", choices: ["The cosmological constant problem", "The black hole information paradox", "The hierarchy problem"], correct: 1 },
  { question: "The physicist Lev Landau, the brilliant Soviet theorist who influenced most of Soviet physics, was arrested by Stalin's NKVD in 1938 on charges of being a German spy. Who secured his release after one year?", choices: ["Niels Bohr", "", "Igor Kurchatov"], correct: 2 },
  { question: "The physicist Linus Pauling won the Nobel Peace Prize in 1962, partly for circulating the Pauling Petition calling for a test ban. How many scientist signatures did the petition eventually gather?", choices: ["About 1,000 signatures", "About 11,000 signatures", "About 21,000 signatures"], correct: 1 },
  { question: "The physicist Lisa Randall and Raman Sundrum's model proposes that the observable universe is a 4D 'brane' embedded in a 5D spacetime with a warped geometry. The key prediction of the RS model for the LHC was what?", choices: ["Supersymmetric partners of Standard Model particles with masses in the TeV range", "Kaluza-Klein graviton resonances", "Large missing energy signatures from gravitons escaping into the extra dimension"], correct: 2 },
  { question: "The physicist Lisa Randall, a Harvard theorist, proposed with Raman Sundrum in 1999 what model of extra dimensions that became highly influential?", choices: ["That extra dimensions are large enough to be detected at the LHC by finding Kaluza-Klein graviton resonances", "That a small extra dimension with warped geometry could explain the hierarchy problem without supersymmetry, predicting graviton Kaluza-Klein resonances", "That extra dimensions are very large and gravity is weak because it spreads into these dimensions, explaining the hierarchy problem"], correct: 1 },
  { question: "The physicist Lise Meitner and her nephew Otto Frisch explained fission in January 1939. Their theoretical explanation was published in Nature on February 11, 1939. Frisch chose the name 'fission' from what biology term?", choices: ["From 'binary fission'", "From 'nuclear mitosis'", "From 'fission yeast'"], correct: 2 },
  { question: "The physicist Lise Meitner fled Germany in 1938 across what border with what help?", choices: ["She crossed into the Netherlands with a Dutch physicist's help using an expired passport", "She was smuggled into Switzerland by boat through Lake Constance", "She crossed into Denmark with falsified papers prepared by Danish colleagues"], correct: 0 },
  { question: "The physicist Lise Meitner, who never won the Nobel despite being nominated many times, has an element named after her with what atomic number?", choices: ["101", "103", "109"], correct: 2 },
  { question: "The physicist Lise Meitner's calculation of the fission energy release used Einstein's E=mc² to compute the energy from the mass defect. The mass of uranium-235 plus a neutron exceeds the masses of typical fission products by about 0.2 atomic mass units. One atomic mass unit is 931 MeV/c². How much energy does 0.2 u represent?", choices: ["About 27 MeV", "About 135 MeV", "About 186 MeV"], correct: 2 },
  { question: "The physicist Louis Alexander Slotin was born in what city?", choices: ["Winnipeg, Canada", "London, England", "Chicago, USA"], correct: 0 },
  { question: "The physicist Louis de Broglie proposed in 1924 that particles have a wavelength λ = h/p. For a proton moving at 10% of the speed of light, the de Broglie wavelength is approximately what?", choices: ["About 1 femtometers", "About 10 femtometer", "About 100 femtometers"], correct: 2 },
  { question: "The physicist Louis de Broglie proposed that matter particles have a wave nature in his 1924 PhD thesis. He predicted the de Broglie wavelength. The experimental confirmation came from electron diffraction by crystal lattices in 1927. Who performed this experiment?", choices: ["Otto Stern and Walther Gerlach", "Clinton Davisson and Lester Germer", "Werner Heisenberg and Wolfgang Pauli"], correct: 2 },
  { question: "The physicist Louis Slotin, who died in the 1946 criticality accident, was a Canadian born in Winnipeg. Before his work on critical assemblies, what branch of physics had he worked in?", choices: ["Accelerator physics", "Nuclear chemistry", "Cosmic ray physics"], correct: 1 },
  { question: "The physicist Lov Grover developed a quantum algorithm in 1996 that provides a quadratic speedup for what type of problem?", choices: ["Solving systems of linear equations", "Unstructured search", "Integer factorization"], correct: 1 },
  { question: "The physicist Luis Alvarez discovered what pattern in the iridium concentration at the geological boundary between the Cretaceous and Paleogene periods?", choices: ["A sudden decrease in iridium at the K-Pg boundary, suggesting iridium was depleted from the crust by the extinction event", "Normal iridium concentrations, leading him to conclude the boundary was formed by volcanic activity not an asteroid", "An anomalously high iridium concentration"], correct: 2 },
  { question: "After the bomb was dropped, Luis Alvarez wrote a letter to his son which he dropped over Hiroshima attached to one of the instrument packages. What did the letter say?", choices: ["It described the bomb and asked his son to be proud of this achievement even if history judged it harshly", "It appealed to Japanese physicists to accept surrender, and was addressed to a specific Japanese physicist Alvarez knew", "It documented the scientific measurements being made and asked his son to understand that the bomb was meant to save lives"], correct: 0 },
  { question: "The physicist Luis Alvarez, after the war, became interested in detecting smuggled nuclear material. He invented a concept that is now used in nuclear security for scanning trucks and containers for fissile material. What technique did he propose?", choices: ["Using gamma-ray absorption scanners to detect dense materials consistent with uranium or plutonium", "Using cosmic ray muon radiography", "Using passive neutron detection to identify spontaneous fission from Pu-240 in hidden weapons material"], correct: 0 },
  { question: "The physicist Luis Alvarez, who flew on the Hiroshima mission, developed the 'bubble chamber' after the war. This replaced what earlier particle detection device?", choices: ["The scintillation counter, which lacked spatial information", "The cloud chamber, which used supersaturated vapor to make tracks visible", "The nuclear photographic emulsion, which required darkroom development and couldn't be electronically read"], correct: 1 },
  { question: "The physicist Makoto Kobayashi and Toshihide Maskawa proposed in 1973 that CP violation required at least how many quark generations?", choices: ["Two generations (four quarks)", "Three generations (six quarks)", "Four generations (eight quarks)"], correct: 1 },
  { question: "The physicist Makoto Kobayashi and Toshihide Maskawa shared the 2008 Nobel with Nambu for predicting CP violation through quark mixing. Their 1973 paper required at least three generations of quarks. At the time, how many quark generations were known?", choices: ["Three", "Two", "Only one"], correct: 0 },
  { question: "The physicist Maria Goeppert Mayer developed the nuclear shell model at Argonne National Laboratory. Her collaborator J. Hans D. Jensen was from what country?", choices: ["Germany", "Austria", "Denmark"], correct: 0 },
  { question: "The physicist Maria Goeppert Mayer, who won the Nobel Prize for the nuclear shell model in 1963, had spent years working in the United States without a paid research position because of anti-nepotism rules at universities where her husband was employed. How did she finally get a paid research position?", choices: ["She was recruited to the Manhattan Project's SAM Lab at Columbia as a paid researcher in 1942", "She was appointed to Argonne National Laboratory in 1946 as a part-time senior physicist", "She took a position at UC San Diego, where her husband was also a professor but where the university waived anti-nepotism rules for her specifically"], correct: 1 },
  { question: "The physicist Martinus Veltman and Gerard 't Hooft shared the Nobel Prize in Physics in 1999. Veltman's specific contribution was developing computational tools, specifically what?", choices: ["REDUCE — the first symbolic mathematics computer program used for high-energy physics calculations", "The Passarino-Veltman decomposition — a systematic method for reducing complicated Feynman diagrams to standard scalar integrals", "Schoonschip — a computer algebra system Veltman wrote specifically for particle physics calculations that enabled the renormalizability proof"], correct: 0 },
  { question: "The physicist Maurice Goldhaber's 1958 experiment at Brookhaven showed that neutrinos are left-handed. What does 'left-handed' mean for a particle?", choices: ["The particle spins clockwise when viewed from behind along its direction of motion", "The particle's spin is aligned opposite to its momentum direction", "The particle decays preferentially to the left in a magnetic field"], correct: 1 },
  { question: "The physicist Max Born interpreted the wave function probabilistically in 1926. Einstein objected that quantum mechanics was incomplete because of this probabilistic character. The EPR paradox, proposed in 1935 by Einstein, Podolsky, and Rosen, aimed to show what?", choices: ["That quantum mechanics was internally inconsistent", "That quantum mechanics was incomplete", "That quantum mechanics violated special relativity"], correct: 2 },
  { question: "The physicist Max Born won the Nobel Prize in Physics in 1954 for his statistical interpretation of the wave function. He had fled Germany in 1933 and eventually settled permanently in what country?", choices: ["Britain", "Scotland", "The United States"], correct: 1 },
  { question: "The physicist Max Born, under whom Oppenheimer did his PhD, won the Nobel Prize in Physics in 1954. For what?", choices: ["The Born-Oppenheimer approximation in molecular quantum mechanics", "The development of matrix mechanics with Heisenberg and Jordan", "His statistical interpretation of the wave function"], correct: 2 },
  { question: "The physicist Max Born's statistical interpretation of the wave function was proposed in a footnote of a 1926 paper on scattering. It is considered one of the most important ideas in physics. Where did Born first fully articulate this interpretation?", choices: ["In a landmark paper titled 'On the Quantum Mechanics of Collision Processes' (Zur Quantenmechanik der Stoßvorgänge) in 1926", "In a letter to Heisenberg explaining how to interpret the matrix elements", "In his 1954 Nobel Prize lecture"], correct: 2 },
  { question: "The physicist Max Planck won the Nobel Prize in Physics in 1918 for the discovery of energy quanta. His formula for blackbody radiation as a function of wavelength and temperature is now called the Planck function. The peak wavelength of blackbody radiation shifts inversely with temperature according to what law?", choices: ["Stefan-Boltzmann law", "Kirchhoff's law", "Wien's displacement law"], correct: 2 },
  { question: "The physicist Max von Laue, one of the few German physicists who actively resisted Nazism, won his Nobel Prize in 1914 for what discovery?", choices: ["X-ray diffraction from crystal lattices", "The photoelectric effect", "Electron diffraction from crystal surfaces"], correct: 0 },
  { question: "The physicist Melvin Schwartz, whose PhD supervisor Leon Lederman was a Columbia physics colleague of Rabi's, discovered the muon neutrino at Brookhaven in 1962. This experiment, which won the Nobel in 1988, proved that neutrinos come in different types. The experiment used what kind of particle beam?", choices: ["A beam of high-energy electrons producing secondary neutrinos", "A beam of high-energy protons hitting a target to produce pions, which decayed into muons and neutrinos", "A nuclear reactor producing antineutrinos from beta decay"], correct: 1 },
  { question: "The physicist Morris Cohen was a member of what organization that recruited him into Soviet espionage?", choices: ["The Communist Party USA, through whose networks he was initially recruited", "The Abraham Lincoln Brigade of volunteers who fought in the Spanish Civil War against Franco", "The Progressive Labor Party, a Marxist student organization at City College of New York"], correct: 2 },
  { question: "The physicist Morris Cohen, Soviet spy and handler in the U.S., escaped capture for years. He was eventually arrested in Britain in the 1960s under what assumed identity?", choices: ["As 'Abel,' the same cover name used by Rudolf Abel in the US", "As Peter Kroger, posing as an antiquarian book dealer in suburban London", "As Frederick Sobell, posing as a physics teacher in Cambridge"], correct: 2 },
  { question: "The physicist Murray Gell-Mann and Richard Feynman co-developed the V-A theory of the weak interaction in 1957, the theory that the weak force only couples to left-handed particles. Their collaboration was unique because they were close colleagues at Caltech. The paper was submitted on the same day as a paper by whom with the same conclusion?", choices: ["Fermi and Yang", "Sudarshan and Marshak", "Lee and Yang"], correct: 0 },
  { question: "The physicist Murray Gell-Mann died in 2019. He and Feynman had a complex relationship. Gell-Mann reportedly had a trait that Feynman found irritating. What was it?", choices: ["Gell-Mann always corrected people's pronunciations of foreign words and scientists' names", "Gell-Mann always claimed priority for ideas that Feynman thought he had developed independently", "Gell-Mann insisted on using French scientific terminology even when English equivalents existed"], correct: 2 },
  { question: "The physicist Murray Gell-Mann introduced the concept of 'strangeness' as a conserved quantum number to explain why some particles were produced quickly (by the strong force) but decayed slowly (only by the weak force). What was strange about the 'strange' particles?", choices: ["They were electrically neutral despite containing charged quarks", "They were produced rapidly in pairs but could only decay individually", "They had masses much larger than expected from their quark content"], correct: 2 },
  { question: "The physicist Murray Gell-Mann named the quark from James Joyce's 'Finnegans Wake.' How many quarks are there?", choices: ["Two quarks", "Four quarks", "Three quarks"], correct: 2 },
  { question: "The physicist Murray Gell-Mann organized hadrons into the 'Eightfold Way' classification scheme in 1961. This arrangement predicted the existence of an unknown particle, the Omega-minus (Ω⁻). When was it discovered?", choices: ["1961", "1964", "1969"], correct: 1 },
  { question: "The physicist Murray Gell-Mann spent much of his later career at what institution founded partly for interdisciplinary research where he studied complexity?", choices: ["The Perimeter Institute in Waterloo, Canada", "The Santa Fe Institute in New Mexico", "The Aspen Center for Physics"], correct: 1 },
  { question: "The physicist Murray Gell-Mann's Eightfold Way organized hadrons using SU(3) symmetry. What does SU(3) stand for?", choices: ["Symmetric Unitary group of dimension 3", "Special Unitary group of 3×3 matrices", "Standard Unified group of three fundamental forces"], correct: 1 },
  { question: "The physicist Murray Gell-Mann's last major scientific interest was what interdisciplinary field?", choices: ["Consciousness", "Complexity science and the study of emergence", "Evolutionary game theory"], correct: 1 },
  { question: "The physicist Murray Gell-Mann's quark model was proposed simultaneously and independently by George Zweig at CERN, who called quarks what?", choices: ["'Partons'", "'Primitives'", "'Aces'"], correct: 2 },
  { question: "The physicist Nicholas Kemmer at Cambridge and Bristol predicted in 1938 that there should be three types of pion (positive, negative, and neutral). Who discovered the neutral pion experimentally in 1950?", choices: ["Cecil Powell, who won the Nobel for discovering the charged pion", "Jack Steinberger and colleagues at Berkeley, using the cyclotron", "Richard Feynman, who confirmed the prediction using QED calculations"], correct: 1 },
  { question: "The physicist Nicholas Kemmer at Imperial College, London coined the term 'nucleon'. This concept was important because it reflected what physical insight?", choices: ["That protons and neutrons are made of the same fundamental particles (quarks)", "That protons and neutrons experience the same strong nuclear force and can be treated as two states of the same particle (isospin doublet)", "That protons and neutrons have the same mass to within 1%"], correct: 2 },
  { question: "The physicist Nicholas Kemmer coined the term 'pion' for the Yukawa particle mediating the nuclear force. Hideki Yukawa had predicted what mass for the particle?", choices: ["About 100-200 MeVs", "About 1 MeV", "About 1 GeV"], correct: 0 },
  { question: "After Niels Bohr arriving in Britain, he immediately had a meeting with what senior official?", choices: ["Winston Churchill", "James Chadwick", "Lord Cherwell"], correct: 2 },
  { question: "The physicist Niels Bohr established his Institute for Theoretical Physics in Copenhagen in 1920. The Institute was funded primarily by what source?", choices: ["The Danish government", "The Carlsberg Foundation", "The Rockefeller Foundation"], correct: 2 },
  { question: "The physicist Niels Bohr explained the structure of the periodic table using the quantum numbers of atomic electrons. The four quantum numbers are n (principal), l (angular), m (magnetic), and s (spin). The Pauli exclusion principle limits each orbital to two electrons. The third shell has how many available states?", choices: ["8 states", "10 states", "18 states"], correct: 0 },
  { question: "What was the nuclear adjacent project that Mitch Rudnick's team of engineers worked on at Northrop", choices: ["A launcher system capable of attaching a nuclear missile", "The first stealth bomber capable of carrying an atomic bomb onto an armored vehicle", "Navigational guidance for the first nuclear sub to travel through the polar ice caps"], correct: 2 },
  { question: "According to Mitch Rudnick, which of the following mathematicians who once \"rubbed shoulders\" (his phrase) with Einstein is Noah related to?", choices: ["George Mostow, who pioneered contributions to geometry and Lie  group theory", "Nachman Aronszajn, who coined the name 'hyperconvex metric spaces' to reproduce kernel Hilbert space", "Andrew Wiles, famous for proving Fermat's Last Theorem which connected number theory and representation theory"], correct: 0 },
  { question: "Mitch Rudnick was working on developing a bomber that would do a flip upside down to turn 180 degrees after launching a bomb forward instead of dropping it. Which president canceled that project because it sounded dumb?", choices: ["JFK", "LBJ", "Nixon"], correct: 0 },
  { question: "Mitch Rudnick was working on developing a bomber that would do a flip upside down to turn 180 degrees after launching a bomb forward instead of dropping it. After it was canceled, which country did they sell it to?", choices: ["France", "Belgium", "Britain"], correct: 2 },
  { question: "The physicist Niels Bohr had a personal habit during intellectual discussions. He would often mutter a phrase that he considered the highest praise. What was it?", choices: ["'Yes, yes — very good'", "'That is not crazy enough to be right'", "'Beautiful'"], correct: 0 },
  { question: "The physicist Niels Bohr met Roosevelt in August 1944 and argued for international control of atomic weapons. Roosevelt was somewhat sympathetic. But Churchill, whom Bohr saw a few months earlier, was completely opposed. Churchill even suggested that Bohr should be arrested for what?", choices: ["Communicating classified nuclear information to neutral Sweden during his escape", "Proposing to share atomic secrets with the Soviet Union", "Publishing his complementarity ideas in a way that implicitly revealed fission was being pursued for weapons"], correct: 1 },
  { question: "The physicist Niels Bohr proposed the 'liquid drop model' of the nucleus in 1936, where the nucleus is treated as a drop of incompressible quantum liquid. This model explains what important nuclear properties?", choices: ["The discrete energy levels of nuclei", "The approximate binding energy per nucleon across the periodic table", "The spontaneous fission rate of transuranium elements"], correct: 2 },
  { question: "The physicist Niels Bohr told Oppenheimer at Los Alamos that the bomb could never work. He meant what specifically?", choices: ["He doubted the implosion principle could produce a symmetric enough compression wave to avoid a fizzle", "The entire industrial isotope separation effort seemed to him beyond what any nation could accomplish", "He doubted the initiator could inject neutrons at precisely the right moment to avoid a fizzle"], correct: 0 },
  { question: "The physicist Niels Bohr was a competitive football (soccer) player at the University level. His brother Harald was an even better athlete. What was Harald Bohr famous for in athletics?", choices: ["He was a Danish Olympic wrestling champion in 1908", "He was a member of the Danish silver medal football team at the 1908 Olympic Games in London", "He held the world record for the 200m sprint from 1906 to 1912"], correct: 1 },
  { question: "The physicist Niels Bohr was fluent in multiple languages. When working with his international colleagues, he had a particular habit during discussions that occasionally frustrated people. What was it?", choices: ["He would switch languages mid-sentence, sometimes English, sometimes Danish or German, confusing collaborators", "He spoke in a near-whisper and was extremely difficult to hear, even in one-on-one conversations", "He would go silent for long periods in the middle of discussions and stare at the wall, then suddenly continue as though no time had passed"], correct: 0 },
  { question: "The physicist Niels Bohr's 1913 model of hydrogen derived the quantization condition by requiring that electron orbits contain an integer number of de Broglie wavelengths. But de Broglie's matter wave hypothesis wasn't proposed until 1924, 11 years later. What quantization condition did Bohr actually use in 1913?", choices: ["He required that the classical radiation frequency equal the quantum frequency", "He postulated that the angular momentum of the electron in its orbit must be an integer multiple of ℏ", "He required that the electron's kinetic energy equal its potential energy"], correct: 2 },
  { question: "The physicist Niels Bohr's 1913 paper derived the Rydberg constant from fundamental physics for the first time. The Rydberg constant R∞ appears in the hydrogen spectrum formula. Its value depends on which fundamental constants?", choices: ["The speed of light, Planck's constant, and the gravitational constant", "The electron mass, electron charge, speed of light, and Planck's constant", "The proton mass, Bohr magneton, and fine structure constant"], correct: 2 },
  { question: "The physicist Niels Bohr's 1939 paper with Wheeler on fission identified U-235 as the fissile isotope. Bohr also noticed what other implication for reactor design?", choices: ["That graphite, not heavy water, was the optimal moderator for a uranium reactor", "That U-238 could capture neutrons to form plutonium", "That the critical mass could be reduced by surrounding the core with a beryllium reflector"], correct: 1 },
  { question: "The physicist Niels Bohr's 'complementarity' principle in quantum mechanics states what?", choices: ["That particles and waves are two incompatible but equally valid descriptions of nature that cannot be simultaneously complete", "That quantum mechanical measurements always disturb the system being measured", "That the uncertainty in energy and time are related by Heisenberg's uncertainty principle"], correct: 0 },
  { question: "The physicist Niels Bohr's complementarity principle is often summarized as 'wave or particle, not both simultaneously.' His deeper insight was what?", choices: ["That physics can only make probabilistic statements", "That the act of measurement inevitably disturbs the system being measured, creating an irreducible uncertainty", "That different experimental arrangements reveal genuinely different but mutually exclusive aspects of physical reality"], correct: 2 },
  { question: "The physicist Niels Bohr's Institute for Theoretical Physics in Copenhagen was famous for a particular working style. Students and visitors were expected to do what that was unusual compared to other physics institutions?", choices: ["Present every calculation publicly", "Debate ruthlessly", "Work at night"], correct: 0 },
  { question: "The physicist Niels Bohr's model of the atom was inspired by Rutherford's discovery of the nucleus. Bohr added the concept of quantized orbits. The Bohr radius, the most probable distance of the electron from the proton in the hydrogen ground state, is approximately what?", choices: ["About 0.53 angstroms", "About 5.3 angstroms", "About 0.053 angstroms"], correct: 0 },
  { question: "The physicist Niels Bohr's most important theoretical paper on nuclear fission, written with Wheeler in 1939, appeared in Physical Review. The paper introduced the concept of the 'fission barrier.' What is the fission barrier?", choices: ["The minimum mass required for a self-sustaining chain reaction in uranium metal", "The radiation safety distance that fission products must be contained within to prevent contamination", "The potential energy barrier that a deforming nucleus must overcome before splitting"], correct: 2 },
  { question: "The physicist Niels Bohr's sons also became physicists. His son Aage Bohr, who shared the 1975 Nobel for nuclear collective motion with Mottelson, worked where during the war?", choices: ["At Los Alamos", "In neutral Sweden", "In Montreal"], correct: 0 },
  { question: "The physicist Niels Bohr's work with Wheeler on fission theory was published in September 1939 in Physical Review. What was its title?", choices: ["'The Theory of Nuclear Fission'", "'The Mechanism of Nuclear Fission'", "'Nuclear Fission and Its Products'"], correct: 1 },
  { question: "The physicist Nima Arkani-Hamed, a leading theorist at the IAS, proposed with Savas Dimopoulos and Gia Dvali in 1998 that extra dimensions might solve the hierarchy problem if they are how large?", choices: ["Planck scale size (10^-35 m)", "Millimeter scale or larger", "Electron size (10^-15 m)"], correct: 2 },
  { question: "The physicist Norman Foster Ramsey worked at the MIT Radiation Laboratory on radar before Los Alamos. His radar work contributed to what specific navigational system that remains in use today?", choices: ["LORAN (Long Range Navigation)", "GPS", "ILS (Instrument Landing System)"], correct: 1 },
  { question: "The physicist Norman Foster Ramsey's separated oscillatory field method improved on Rabi's original magnetic resonance technique by using two separated oscillating fields rather than one continuous field. The improvement was that this reduced what limitation?", choices: ["The power needed to drive the nuclear spin transitions", "The sensitivity of the resonance to ambient magnetic field inhomogeneities", "The difficulty of aligning the nuclear spin axis with the external magnetic field direction"], correct: 1 },
  { question: "The physicist Norman Ramsey organized the ordnance delivery aspects of the atomic bomb missions from Tinian. In his memoir, he noted that he was worried about a specific technical problem with the Little Boy bomb's fuzing system. What was it?", choices: ["He feared the gun assembly could accidentally fire during the long flight to Japan if turbulence jolted the arming system", "The radar proximity fuzes could be triggered by Japanese radar on the ground before reaching the optimal burst height", "The barometric triggers might activate too early if the aircraft descended rapidly through changing pressure conditions"], correct: 0 },
  { question: "The physicist Norman Ramsey's separated oscillatory fields method is used in atomic clocks. Modern cesium atomic clocks based on his principle are accurate to within approximately what?", choices: ["1 second per million years", "1 second per billion years", "1 second per hundred million years"], correct: 2 },
  { question: "The physicist Norman Ramsey's work on the hydrogen maser (a type of atomic clock) achieved what precision in timekeeping?", choices: ["1 part in 10^10 (1 in 10 billion)", "1 part in 10^11 (1 in 100 billion)", "1 part in 10^13 (1 in 10 trillion)"], correct: 1 },
  { question: "The physicist Norris Bradbury, Oppenheimer's successor as Los Alamos director, faced an immediate postwar challenge: the laboratory staff was rapidly leaving. In 1945-46, what fraction of the Los Alamos scientists left for university positions?", choices: ["About half the wartime scientific staff departed within the first year after the war ended", "About 80% of the scientific staff left within the first six months", "About a quarter"], correct: 0 },
  { question: "The physicist Oppenheimer became director of Los Alamos at what age?", choices: ["34", "38", "42"], correct: 1 },
  { question: "The physicist Oppenheimer completed his PhD at Göttingen under Max Born in 1927. Born later wrote of Oppenheimer that he was 'the most brilliant student I ever had, but impossible to manage.' What specific behavior at Göttingen required 'management'?", choices: ["Oppenheimer would sometimes take over seminars, writing equations on the board before the speaker had finished their introduction", "Oppenheimer was so restless and depressed in his first years at Göttingen that Born feared for his mental health", "Oppenheimer had a habit of submitting papers under Born's name without telling him, which caused several small academic scandals"], correct: 1 },
  { question: "The physicist Oppenheimer described Niels Bohr's contribution to Los Alamos as primarily what type?", choices: ["Technical — Bohr provided crucial calculations on nuclear cross sections that other physicists had missed", "Inspirational and critical — his questions and insights helped scientists see problems differently and kept the work honest", "Administrative — Bohr helped Oppenheimer manage the increasingly complex organizational challenges of the laboratory"], correct: 0 },
  { question: "Oppenheimer received a posthumous recognition from the U.S. government in 2022, the formal vacating of his 1954 security decision. The specific citation said the process in 1954 had violated what?", choices: ["His constitutional rights to due process under the Fifth Amendment", "The AEC's own regulations", "International norms against political persecution of scientists"], correct: 2 },
  { question: "The physicist Oppenheimer in his famous 'I am become Death' quote was citing the Bhagavad Gita. He knew Sanskrit and had studied Indian philosophy. Who taught him Sanskrit?", choices: ["Arthur Ryder, a Sanskrit professor at UC Berkeley", "A private tutor he hired in New Mexico after buying his Perro Caliente ranch", "Niels Bohr, who had also studied Sanskrit and introduced Oppenheimer to Eastern philosophy"], correct: 0 },
  { question: "The physicist Oppenheimer received his PhD from Göttingen under Max Born in 1927, at age 23. His thesis was on quantum mechanics. He then spent time at several other European institutions. At which did he work with Paul Dirac?", choices: ["Copenhagen, in Niels Bohr's institute", "Cambridge, at the Cavendish Laboratory under Dirac's occasional supervision", "Leiden, in Paul Ehrenfest's institute where both Dirac and Oppenheimer spent time together"], correct: 1 },
  { question: "The physicist Oppenheimer smoked heavily throughout his life. His preferred cigarettes were what brand?", choices: ["Lucky Strike", "Chesterfield", "Pall Mall"], correct: 1 },
  { question: "The physicist Oppenheimer was born in New York City in 1904. His family was wealthy — his father Julius had made a fortune in the textile import business. What was Oppenheimer's undergraduate major at Harvard?", choices: ["Physics", "Chemistry — he completed the 4-year chemistry degree in 3 years before converting to theoretical physics", "Mathematics with a physics minor"], correct: 0 },
  { question: "The physicist Oppenheimer wore a porkpie hat as his signature style. At the Trinity test site, what did Oppenheimer do in the hours before the detonation while waiting for the weather to clear?", choices: ["He read from the Bhagavad Gita aloud to a small group including Bainbridge and Fermi", "He tried to sleep in the base camp bunker", "He walked the desert floor alone near the base camp, thinking through what was about to happen"], correct: 1 },
  { question: "The physicist Oppenheimer, after his security clearance was revoked, continued as director of the Institute for Advanced Study until 1966. He remained intellectually active. His final public lecture at Princeton was on what topic?", choices: ["The relationship between physics and the humanities", "The history of the atomic bomb and his role in it", "The relationship between physics and human knowledge"], correct: 0 },
  { question: "The physicist Oppenheimer, asked whether the atomic bomb was a moral weapon, consistently gave what answer in his post-war statements?", choices: ["Yes — it ended the war that would have cost far more lives by conventional means", "The question was unanswerable — he refused to make a moral judgment about the weapon's use, which was a political decision, not a scientific one", "No — its indiscriminate destruction of civilian populations made it fundamentally different from any previous weapon"], correct: 1 },
  { question: "The physicist Oppenheimer, in his landmark 1948 speech to the American Philosophical Society, warned that the world was in mortal danger not because of the bomb alone but because of what additional factor?", choices: ["The inevitability of nuclear proliferation to unstable regimes", "The combination of the bomb's destructive power and the failure of nations to develop adequate international institutions to control it", "The development of delivery systems that would allow nuclear weapons to be launched on warning, eliminating time for diplomacy"], correct: 1 },
  { question: "The physicist Oppenheimer, when told by a young student at Berkeley that he had made an error in quantum mechanics, reportedly did what?", choices: ["Immediately verified the student was right and said 'Thank you, I have been wrong about this for years'", "Said 'Let me think about it' and returned the next day with a complete proof that the student was correct", "Corrected the student politely but then stayed after class to privately acknowledge the student had a point"], correct: 0 },
  { question: "The physicist Oppenheimer's 1954 security hearing was formally a Personnel Security Board hearing, not a trial. However, it effectively functioned as one. Who was the chairman of the board that heard his case?", choices: ["Gordon Gray", "Lewis Strauss", "Senator Joseph McCarthy"], correct: 0 },
  { question: "The physicist Oppenheimer's appointment to Los Alamos was formalized in what unusual way given his security concerns?", choices: ["He was never given full Q clearance", "Groves personally signed a waiver granting Oppenheimer clearance over the objections of Army Counter Intelligence Corps", "Oppenheimer was given clearance by the White House directly"], correct: 1 },
  { question: "The physicist Oppenheimer's code name during his travel to Los Alamos was what?", choices: ["James Oberhelm", "J.R. Oppleby", "Mr. Bradley"], correct: 0 },
  { question: "The physicist Oppenheimer's death in 1967 came just months after he received what honor?", choices: ["Honorary membership in the National Academy of Sciences", "The Fermi Award from the Atomic Energy Commission", "The Enrico Fermi Award"], correct: 0 },
  { question: "The physicist Oppenheimer's 'I am become Death' quote from the Bhagavad Gita used an unusual grammatical construction. The phrase 'I am become' is archaic English. Which English translation of the Gita did Oppenheimer use?", choices: ["The Edgerton translation of 1944", "The Prabhavananda and Isherwood translation of 1944", "He used his own translation directly from the Sanskrit"], correct: 2 },
  { question: "The physicist Oppenheimer's most celebrated lecture series was delivered at the BBC as the Reith Lectures. The series was called what?", choices: ["'Science and the Common Understanding'", "'The Open Mind'", "'The Peril and the Hope'"], correct: 1 },
  { question: "The physicist Oppenheimer's most important contribution to relativistic astrophysics was a series of papers in 1939. He wrote one paper with Volkoff on what subject?", choices: ["The formation of neutron stars from gravitational collapse of massive stars", "The maximum mass of a neutron star", "Computing the structure of neutron stars using general relativity for the first time"], correct: 1 },
  { question: "The physicist Oppenheimer's security clearance was restored posthumously. In what year did the U.S. government formally vacate the 1954 security decision against him?", choices: ["1990, by President George H.W. Bush as part of Cold War reconciliation", "2022, by President Biden's Energy Secretary Jennifer Granholm", "2009, by the Obama administration as part of a broader review of Cold War-era clearance revocations"], correct: 1 },
  { question: "The physicist Oppenheimer's security hearing in April 1954 lasted 27 days. The board voted 2-1 against restoring his clearance. The dissenting vote was cast by what board member who believed Oppenheimer was loyal?", choices: ["Ward Evans, the chemist member of the board", "Thomas Morgan, the businessman member", "The hearing's own counsel"], correct: 1 },
  { question: "The physicist Oppenheimer's statement that scientists have 'known sin' is from what 1947 speech?", choices: ["His Phi Beta Kappa address at Harvard", "The Massachusetts Institute of Technology (MIT) Founders Day speech", "The Atomic Scientists Association annual meeting"], correct: 1 },
  { question: "The physicist Oppenheimer's watch stopped at what time, the moment of the Trinity detonation? He kept this watch for the rest of his life.", choices: ["4:29:45", "4:59:45", "5:29:45"], correct: 2 },
  { question: "The physicist Otto Frisch designed the first successful criticality experiment — the 'dragon's tail' assembly — and also is credited with what important improvement in alpha particle detection at Los Alamos?", choices: ["He developed the ionization chamber specifically for measuring initiator performance", "He improved the scintillation counter to discriminate alpha particles from other radiation types with much higher efficiency", "He developed a fast electronic counter capable of measuring single alpha particles at the rates needed for initiator testing"], correct: 1 },
  { question: "The physicist Otto Frisch performed a famous criticality experiment at Los Alamos nicknamed 'tickling the dragon's tail.' What did this experiment involve?", choices: ["Slowly lowering a beryllium reflector over a plutonium core until criticality was approached, then rapidly raising it", "Briefly sliding two subcritical masses of enriched uranium together using a hand-operated mechanism, measuring the neutron multiplication before separating them", "Passing a uranium slug rapidly through the center of a ring of uranium to create a brief critical assembly"], correct: 0 },
  { question: "The physicist Otto Frisch, after Los Alamos, returned to Britain and worked at Harwell, then at Cambridge as Jacksonian Professor of Natural Philosophy. His memoir about Los Alamos and his scientific life was called what?", choices: ["'The Gift of Physics: A Scientist's Memoir'", "'What Little I Remember'", "'Splitting the Atom: A Memoir'"], correct: 1 },
  { question: "The physicist Otto Frisch, who coined the term 'fission' with his aunt Lise Meitner, calculated what key fact about the fission process during his Christmas 1938 vacation with Meitner in Sweden?", choices: ["The critical mass of U-235 was small enough to be practically achievable", "The energy release per fission event  was enormous compared to any chemical reaction, using the mass defect between products and reactants", "That plutonium would be fissile and easier to produce than separated U-235"], correct: 1 },
  { question: "The physicist Otto Frisch, who coined the term 'fission,' was the nephew of which famous physicist?", choices: ["Otto Hahn, who discovered fission chemically", "Niels Bohr, who worked with Frisch on fission theory", "Lise Meitner, who developed the theoretical explanation"], correct: 2 },
  { question: "The physicist Otto Frisch's account of the first criticality experiment at Los Alamos using liquid uranium solution in a tank describes the eerie blue glow from Cherenkov radiation as a warning sign. What physical sense also served as a warning during such experiments?", choices: ["Hearing — a Geiger counter alarm was always connected and made an audible sound at approach to criticality", "Smell — ozone produced by ionization of air had a sharp distinctive smell that increased near the critical assembly", "Warmth — the heat from fission reactions could be felt on the skin as a warm flash during a prompt criticality excursion"], correct: 2 },
  { question: "The physicist Otto Hahn won the Nobel Prize in Chemistry in 1944 for the discovery of fission. He received the award in Stockholm in 1946, having been held at Farm Hall. At Farm Hall he had heard about the Hiroshima bombing and was reportedly devastated. Hahn's co-discoverer Strassmann was not included. Fritz Strassmann later received what recognition from Israel?", choices: ["An honorary citizenship, for having protected Jewish colleagues during the Nazi period", "Yad Vashem recognition as Righteous Among the Nations, for protecting a Jewish colleague during the war", "The Israel Prize in chemistry, awarded posthumously for his contribution to nuclear science"], correct: 2 },
  { question: "The physicist Otto Robert Frisch performed criticality experiments at Los Alamos using a 'Queen Mary' assembly — a large tank of uranyl nitrate solution. This type of liquid fissile solution is especially dangerous because it can go critical in what unexpected way?", choices: ["The liquid can splash and create a brief supercritical geometry if containers tip or spill", "Water in the solution can concentrate near the center, creating unexpected neutron moderation", "Solution criticality is accidental"], correct: 1 },
  { question: "The physicist Otto Stern, who developed molecular beam methods and measured the proton's magnetic moment (finding it anomalously large), fled Germany in 1933 and settled in the United States. He won the Nobel Prize in what year?", choices: ["1937", "1943", "1945"], correct: 1 },
  { question: "The physicist Otto Stern's molecular beam experiment, done with Walther Gerlach in 1922, sent silver atoms through an inhomogeneous magnetic field. Classical physics predicted a continuous distribution of deflections. The experiment found what?", choices: ["No deflection", "A continuous band with slight concentration at the extremes", "Two discrete spots"], correct: 2 },
  { question: "The physicist Paul Dirac made what observation about renormalization that showed he was never fully satisfied with the theory despite its experimental success?", choices: ["He said QED was 'magnificent in its predictions but repugnant in its logic'", "He said the renormalization procedure was 'just sweeping the infinities under the rug'", "He proposed that QED should be replaced by a direct-action theory that would avoid the need for field quantization altogether"], correct: 2 },
  { question: "The physicist Paul Dirac once said that the most important unsolved problem in theoretical physics was what?", choices: ["The unification of quantum mechanics with general relativity", "The large numbers hypothesis", "The measurement problem in quantum mechanics"], correct: 2 },
  { question: "The physicist Paul Dirac proposed the concept of the 'Dirac sea' to explain the negative energy solutions of his relativistic electron equation. What experimental fact would confirm this picture?", choices: ["That positrons could be created only in pairs with electrons since creating a hole requires promoting an electron from the negative sea to a positive energy state", "That positrons had exactly half the mass of electrons ", "That positrons decayed into photons with a half-life corresponding to the density of electrons in the vacuum"], correct: 2 },
  { question: "The unit 'one Dirac' was jokingly proposed at Cambridge to mean what?", choices: ["One correct physics derivation per day", "One word per hour", "One fundamental discovery per year"], correct: 1 },
  { question: "The physicist Paul Dirac, in his last years at Florida State University (he moved there from Cambridge in 1971), wrote what he considered his most important late paper about what topic?", choices: ["Large numbers hypothesis", "The positron", "A critique of renormalization theory"], correct: 0 },
  { question: "The physicist Paul Dirac, who predicted the positron, also developed what formulation of quantum mechanics that was equivalent to but more mathematically elegant than Heisenberg's matrix mechanics?", choices: ["Path integral quantum mechanics", "Second quantization", "Transformation theory using the bra-ket notation and generalized eigenstates"], correct: 2 },
  { question: "The physicist Paul Dirac, who worked briefly in the peripheral orbit of Manhattan Project scientists, predicted the existence of antimatter in 1928. His equation predicted what specific antiparticle that was later observed?", choices: ["The antineutron", "The antiproton", "The positron"], correct: 2 },
  { question: "The physicist Paul Dirac's 1930 textbook 'The Principles of Quantum Mechanics' is remarkable for establishing the modern formalism of the theory. Dirac dedicated the book to whom?", choices: ["Niels Bohr, whose Copenhagen interpretation Dirac's formalism formalized", "His parents, with the dedication written in three languages reflecting his multilingual upbringing", "No one"], correct: 2 },
  { question: "The physicist Paul Dirac's 'bra-ket' notation is now standard in quantum mechanics. The 'bra' ⟨φ| and 'ket' |ψ⟩ together form the 'bracket' ⟨φ|ψ⟩, which represents what?", choices: ["The Hamiltonian matrix element between states φ and ψ", "The commutator of the operators corresponding to observables φ and ψ", "The inner product between quantum states φ and ψ"], correct: 2 },
  { question: "The physicist Peter Higgs, who proposed the Higgs mechanism in 1964, won the Nobel Prize in Physics in 2013 along with François Englert. Higgs learned about his Nobel Prize in what unusual way?", choices: ["He was in Edinburgh and initially missed the announcement, he found out when a neighbor congratulated him on the street after the announcement had been made public", "He was on holiday without internet or phone access and was informed by a BBC reporter who tracked him down", "He was in his office at Edinburgh University but his phone had been turned off, his secretary had to interrupt his lunch to tell him"], correct: 0 },
  { question: "The physicist Peter Kapitsa, after being detained in the Soviet Union by Stalin in 1934, refused to work on weapons for the Soviet nuclear program. He wrote letters to Stalin complaining about Beria. What was his fate?", choices: ["He was sent to a labor camp and died there in 1945", "He was stripped of his institute directorship and put under house arrest at his dacha from 1946 to 1953, when Stalin died and his fortunes reversed", "He was forced to work on the bomb program under threat of arrest but was released immediately after Stalin's death"], correct: 2 },
  { question: "The physicist Peter Shor developed what quantum computing algorithm in 1994 that posed a specific threat to modern cryptography?", choices: ["Searching an unsorted database in √N time using quantum superposition", "Factoring large integers in polynomial time using quantum Fourier transform, breaking RSA encryption", "Enabling quantum computers to operate without decoherence by encoding one logical qubit in many physical qubits"], correct: 1 },
  { question: "The physicist Peter Shor's quantum factoring algorithm provides exponential speedup over classical algorithms. If a classical computer takes time T to factor an n-digit number using the best classical algorithm, Shor's algorithm takes approximately what time on a quantum computer?", choices: ["Time T/1000", "Polynomial time in n (like n³) versus classical super-polynomial time (like exp(n^(1/3)))", "Time proportional to √T"], correct: 2 },
  { question: "The physicist Philip Anderson won the Nobel Prize for condensed matter physics in 1977. His most important contribution was Anderson localization which is what?", choices: ["The localization of Cooper pairs in high-temperature superconductors", "The localization of electrons in a disordered quantum system", "The localization of magnetic moments in spin glasses"], correct: 2 },
  { question: "The physicist Philip Hauge Abelson was at the Naval Research Laboratory when he developed the liquid thermal diffusion enrichment process. This process was used as the first stage of uranium enrichment at Oak Ridge, feeding partially enriched material to the gaseous diffusion cascade. Abelson's work was notably done with no connection to the Manhattan Project, he developed it independently. In what year?", choices: ["1941", "1942", "1943"], correct: 2 },
  { question: "The physicist Philip Hauge Abelson, who co-discovered neptunium and developed liquid thermal diffusion enrichment, spent most of his career not at a university but at what institution?", choices: ["Brookhaven National Laboratory, where he worked on nuclear propulsion research", "The Carnegie Institution of Washington, where he worked as a scientist and later editor of Science magazine for 22 years", "The Naval Research Laboratory, where he remained through the end of his career"], correct: 0 },
  { question: "The physicist Philip Hauge Abelson, who developed thermal diffusion enrichment, is also co-credited with the discovery of what element?", choices: ["Curium", "Neptunium", "Americium"], correct: 1 },
  { question: "The physicist Philip Morrison carried the plutonium core for Fat Man in the back seat of an Army car from Los Alamos to Kirtland Field in Albuquerque. What did he reportedly do during the drive?", choices: ["He held the plutonium core in his lap in a special container to protect it from road vibration", "He placed the core in a cushioned box in the trunk and rode separately in another car per security protocol", "He monitored it with a Geiger counter throughout the journey"], correct: 0 },
  { question: "The physicist Philip Morrison was denied security clearance after the war for a period, partly because of his left-wing political associations. He eventually found a position where?", choices: ["Cornell University, where he joined Bethe's physics department", "MIT, where he joined the physics faculty in 1965 after his clearance was restored", "The University of Chicago, where he remained through the 1950s under Compton's protection"], correct: 1 },
  { question: "The physicist Philip Morrison supervised students in what interdisciplinary field that combined physics with social issues?", choices: ["Science policy", "Science education", "Arms control technology"], correct: 1 },
  { question: "The physicist Philip Morrison, who assembled part of Fat Man on Tinian, was later one of the first American scientists to visit Hiroshima after the bombing. He described seeing the city as looking as though 'a bulldozer had scraped it flat.' He visited as part of what mission?", choices: ["A United States Strategic Bombing Survey team that assessed the damage to determine yields and effects", "A Red Cross assessment team that entered with the first Allied medical personnel", "A scientific team sent by the OSRD to recover Japanese nuclear research data from destroyed Hiroshima laboratories"], correct: 0 },
  { question: "The physicist Philip Morrison, who assembled part of the Fat Man bomb on Tinian, was later the first person to publicly propose what idea in a 1959 paper co-authored with Giuseppe Cocconi?", choices: ["That nuclear fusion could be achieved using lasers", "That neutrino beams could be used to detect underground nuclear tests through the Earth", "That extraterrestrial intelligence might be detectable via radio signals at the 1420 MHz hydrogen line frequency"], correct: 2 },
  { question: "The physicist Philip Morrison, who organized the delivery of Fat Man to Tinian, was a Cornell physics professor for many years. He later co-hosted what PBS television series about the scale of the universe?", choices: ["Cosmos with Carl Sagan", "Powers of Ten", "The Ascent of Man with Jacob Bronowski"], correct: 1 },
  { question: "The physicist Ralph Alpher, Gamow's graduate student who co-authored the alpha-beta-gamma paper, spent his career working for what company and never holding an academic position, partly because of discrimination?", choices: ["Los Alamos National Laboratory", "General Electric's Research Laboratory", "Westinghouse Research Laboratories"], correct: 1 },
  { question: "The physicist Ralph Bunche, who won the Nobel Peace Prize in 1950 for mediating the Arab-Israeli Armistice, also worked at a government level on nuclear arms control. He worked at the United Nations and advocated for international control of nuclear weapons. The annual Ralph Bunche lecture on arms control is held at which institution?", choices: ["Columbia University", "Harvard Kennedy School", "The United Nations "], correct: 1 },
  { question: "The physicist Ralph Lapp, a Manhattan Project veteran, coined the term 'the bomb' in his 1949 book. He became a prominent popularizer of nuclear issues. He is also credited with first using the term 'overkill' to describe what?", choices: ["Using more nuclear weapons than necessary to destroy a city", "The excess nuclear explosive power that both superpowers accumulated beyond any conceivable military requirement", "The psychological effect of nuclear threat that 'kills' the will to resist"], correct: 1 },
  { question: "The physicist Richard Feynman described in his memoir how he figured out the safe combination of a colleague's classified safe at Los Alamos. Who was this?", choices: ["Hans Bethe", "Edward Teller", "Enrico Fermi"], correct: 0 },
  { question: "The physicist Richard Feynman developed what important approach to nuclear reaction rates in 1942, before Los Alamos, as part of his Princeton PhD thesis?", choices: ["The path integral formulation of quantum mechanics", "Calculating radiation reaction forces on moving electrons", "A variational approach to calculating ground-state energies of helium-like atoms"], correct: 0 },
  { question: "The physicist Richard Feynman gave a famous 1959 lecture called 'There's Plenty of Room at the Bottom.' What was this lecture about?", choices: ["The unexplored physics in the deep ocean", "The possibility of manipulating individual atoms and molecules", "The physics of condensed matter at millikelvin temperatures"], correct: 2 },
  { question: "The physicist Richard Feynman gave a famous series of lectures in New Zealand in 1979. The lectures were released as what film?", choices: ["'QED'", "'The Pleasure of Finding Things Out'", "'Fun to Imagine"], correct: 0 },
  { question: "The physicist Richard Feynman is famous for his Feynman diagrams, a pictorial way to calculate particle interaction probabilities. These diagrams represent what mathematically?", choices: ["Visual descriptions of what physically happens during a particle collision", "Terms in a perturbation expansion of the S-matrix", "Spacetime paths of particles, showing their trajectories before and after a collision"], correct: 1 },
  { question: "The physicist Richard Feynman refused what honor in 1970, saying receiving it would require giving lectures and interviews and otherwise 'wasting' his time?", choices: ["Honorary membership in the National Academy of Sciences", "The Presidential Medal of Freedom from President Nixon", "An honorary degree from Cambridge University"], correct: 0 },
  { question: "The physicist Richard Feynman won the Nobel Prize in Physics in 1965, sharing it with Schwinger and Tomonaga. The Nobel was specifically for what?", choices: ["The invention of Feynman diagrams", "The theory of how light and matter interact at the quantum level", "The path integral formulation of quantum mechanics"], correct: 1 },
  { question: "The physicist Richard Feynman, during the Challenger disaster investigation in 1986, famously demonstrated the O-ring failure mechanism live at the commission hearing. He put a piece of O-ring in a glass of ice water and showed it became brittle. He reportedly had to fight the commission to include his findings. In what appendix of the report did his famous independent findings appear?", choices: ["Appendix A — the first technical appendix, which he insisted be placed prominently", "Appendix F — placed at the end of the commission report, where it would be less prominent", "Appendix R — the appendix for the minority report, since his colleagues initially did not want his conclusions included"], correct: 2 },
  { question: "The physicist Richard Feynman, recalling his work at Los Alamos, famously described the experience of using the primitive calculators available to speed up computation. What was his innovation to quicken the calculation work?", choices: ["He introduced assembly-line calculation", "He invented a graphical shorthand for differential equations", "He programmed the IBM punch-card machines to do long chains of calculations"], correct: 0 },
  { question: "The physicist Richard Feynman's famous 'Feynman diagrams' were not immediately accepted. When he presented them at the 1948 Pocono Conference, only one senior physicist immediately understood and appreciated what they meant. Who was it?", choices: ["Hans Bethe, who immediately saw the connection to Schwinger's operator method", "Niels Bohr, who was present and nodded enthusiastically", "Freeman Dyson, who later proved the equivalence and got Feynman's ideas accepted"], correct: 2 },
  { question: "The physicist Richard Feynman's last public scientific work before his death in 1988 was serving on the Rogers Commission investigating the Challenger disaster. His other last public activity was a series of lectures on computation. These lectures were published as what?", choices: ["'Feynman on Computation: Exploring the Limits of Computers'", "'Lectures on Computation'", "'The Pleasure of Finding Things Out'"], correct: 1 },
  { question: "The physicist Richard Feynman's last words upon learning he had terminal kidney cancer reportedly showed characteristic humor. When asked how he felt, he reportedly said what?", choices: ["'I'd hate to die twice. It's so boring.'", "'I don't have to know an answer. I don't feel frightened by not knowing things.'", "'The best thing I ever discovered is that I don't know.'"], correct: 2 },
  { question: "The physicist Richard Feynman's path integral formulation assigns a phase factor e^(iS/ℏ) to each path, where S is the classical action. For a free particle, the path with the largest contribution to the quantum amplitude is which path?", choices: ["All paths contribute equally", "The slowest path", "The classical path"], correct: 2 },
  { question: "The physicist Richard Feynman's path integral formulation of quantum mechanics sums over all possible paths a particle can take. This formulation was developed in his PhD thesis under what supervisor at Princeton?", choices: ["Eugene Wigner", "Albert Einstein", "John Archibald Wheeler"], correct: 2 },
  { question: "The physicist Richard Feynman's safe-cracking exploits at Los Alamos were possible because many scientists used what combination for their classified safes?", choices: ["The date of their birth", "The combination 27-18-28, the first digits of e ", "The same combination that shipped with the safe"], correct: 2 },
  { question: "The physicist Richard Feynman's textbook 'The Feynman Lectures on Physics' originated from his attempt to teach physics at Caltech to first and second year undergraduates. The lectures were recorded and transcribed in what years?", choices: ["1955-1957", "1961-1963", "1965-1967"], correct: 1 },
  { question: "Whose wife Arline was ill with tuberculosis during the Manhattan Project and lived in a sanitarium in Albuquerque, before dyingin June 1945?", choices: ["Richard Feynman", "Neils Bohr", "Richard Garwin"], correct: 0 },
  { question: "The physicist Richard Garwin is often credited with the actual design work for Ivy Mike while Teller gets the credit for the concept. Garwin reportedly designed the full device in six weeks. What was his status at the time?", choices: ["A senior physicist at Los Alamos", "A newly minted PhD", "A visiting consultant from Cornell"], correct: 2 },
  { question: "The physicist Richard Garwin, who designed the Ivy Mike thermonuclear device as a 23-year-old in 1952 working under Teller, later became one of the most prominent critics of what weapons system?", choices: ["The neutron bomb, which he argued was strategically destabilizing", "Ballistic missile defense systems, arguing they were technically infeasible and strategically destabilizing", "Multiple independently targetable reentry vehicles, arguing they increased first-strike instability"], correct: 1 },
  { question: "The physicist Robert Bacher, the first head of the Physics Division at Los Alamos, later became one of the original five commissioners of the Atomic Energy Commission. He is notable for being what?", choices: ["The only physicist", "The only Democra", "The only AEC commissioner who had personally assembled a nuclear weapon"], correct: 0 },
  { question: "The physicist Robert Brout, who co-authored the Englert-Brout paper predicting the Higgs mechanism with Englert, died in 2011. Nobel rules state that prizes are not awarded posthumously. Brout therefore did not share the 2013 prize. The same year, what other physicist died before learning about his Nobel?", choices: ["Guralnik", "No one else", "Feynman"], correct: 0 },
  { question: "The physicist Robert Christy, who proposed the solid-sphere 'Christy gadget' design for Fat Man, spent most of his career at Caltech. His later work included what contribution to cosmology?", choices: ["Co-developing the model of dark matter as weakly interacting massive particles", "The Christy-Szekeres model of stellar collapse", "The development of 'Christy's Law' relating Type Ia supernova brightness to their light curve shapes"], correct: 2 },
  { question: "The physicist Robert Christy's 'Christy gadget' design — a solid sphere of plutonium for the Trinity/Fat Man core — was adopted because it solved what problem with the earlier hollow-shell design?", choices: ["The hollow shell required excessive amounts of plutonium to achieve criticality", "The hollow shell design was too difficult to machine precisely and might collapse asymmetrically under implosion", "The hollow shell design required much higher implosion pressures that the available explosive lenses could not reliably deliver"], correct: 2 },
  { question: "The physicist Robert Hofstadter won the Nobel Prize in 1961 for measuring the charge distribution inside the proton and neutron using electron scattering. His experiments at Stanford showed that protons and neutrons had what internal structure?", choices: ["A hard, point-like core surrounded by a diffuse cloud of pions", "A finite, distributed charge distribution with a characteristic radius of about 0.87 femtometers", "A two-shell structure with a dense inner core and a lighter outer shell of about 1.5 femtometer radius"], correct: 1 },
  { question: "The physicist Robert Hofstadter, who measured the proton's charge distribution, shared the 1961 Nobel Prize with whom?", choices: ["Owen Chamberlain and Emilio Segrè, who discovered the antiproton", "Rudolf Mössbauer, who discovered recoil-free gamma ray absorption", "Murray Gell-Mann, who proposed the quark model of the proton"], correct: 1 },
  { question: "The physicist Robert Millikan won the Nobel Prize in 1923 for measuring the charge of the electron using the oil drop experiment (1909-1913). He initially opposed Einstein's photon concept. After measuring the photoelectric effect precisely, he confirmed Einstein's equation. What was his personal reaction to this confirmation?", choices: ["He accepted the result and publicly endorsed Einstein's photon theory in a 1916 paper, despite finding the concept 'incredible'", "He denied the result applied to Einstein's theory and he published the measurements but argued they could be explained without photons", "He claimed the confirmation showed quantum mechanics was wrong, because no physical particle could have the properties Einstein's photon required"], correct: 2 },
  { question: "The physicist Robert Millikan, who measured the charge of the electron, also became famous for helping build what institution into a world-class physics center?", choices: ["MIT", "Caltech", "Stanford"], correct: 1 },
  { question: "The physicist Robert Mills, who co-authored the Yang-Mills gauge theory paper with C.N. Yang in 1954, spent most of his career at what institution?", choices: ["Princeton", "Ohio State", "Brookhaven National Laboratory"], correct: 1 },
  { question: "The physicist Robert Oppenheimer's brother, Frank Oppenheimer, was denied university teaching positions during the McCarthy era. Frank later founded what major science institution in San Francisco?", choices: ["The Exploratorium", "The Lawrence Hall of Science at UC Berkeley", "The California Academy of Sciences"], correct: 0 },
  { question: "The physicist Robert Serber was denied security clearance after the war, ending his ability to work on classified weapons research. He resumed his physics career in academia. He is also known for what personal tragedy at Los Alamos?", choices: ["His wife Charlotte died in a swimming accident in the Rio Grande while he was working at Los Alamos", "His wife Charlotte died in a plane crash in 1967 while flying to an international physics conference where Serber was being considered for the Fermi Award", "His wife Charlotte was diagnosed with terminal cancer during the Los Alamos period, and Serber worked through his grief while completing the Primer lectures"], correct: 1 },
  { question: "The physicist Robert Serber, who wrote the Los Alamos Primer, was denied security clearance in the early Cold War era. He was eventually cleared again and returned to physics. At which university did he spend most of his later career?", choices: ["Princeton University", "University of California, Berkeley", "Columbia University"], correct: 2 },
  { question: "The physicist Robert Serber's Los Alamos Primer was delivered as a series of five lectures in April 1943. What was the audience for these lectures?", choices: ["The entire Los Alamos scientific staff", "Only the theoretical physics division leaders", "All newly arriving scientists at Los Alamos="], correct: 2 },
  { question: "The physicist Robert Wilson was an artist as well as a physicist. He sculpted the major public artworks at Fermilab and insisted the laboratory have an aesthetic dimension as well as a scientific one. Wilson Hall, the main building at Fermilab, was designed in the style of what famous building?", choices: ["The Notre-Dame Cathedral in Paris", "Beauvais Cathedral in France", "The Chrysler Building in New York"], correct: 1 },
  { question: "The physicist Robert Wilson, who organized the Los Alamos cyclotron group, became the first director of Fermilab. He insisted on building the accelerator for what budget compared to the original estimate?", choices: ["Wilson built the 200 GeV Fermilab accelerator for about $250 million", "Wilson built Fermilab at half the government-approved budget by demanding personal oversight of all contractor spending", "Wilson exceeded the budget by 50% but achieved twice the original design energy of 400 GeV"], correct: 0 },
  { question: "The physicist Robert Wilson's congressional testimony in 1969 about Fermilab is famous. When asked what the accelerator's defense value was, he said what?", choices: ["That it would prove American scientific superiority to the Soviets", "That it had nothing to do with defense directly but that it had everything to do with the value of keeping the country worth defending", "That high-energy physics understanding was essential for the next generation of nuclear weapons"], correct: 1 },
  { question: "The physicist Roger Penrose made an important contribution to mathematics as well as physics: the 'Penrose tiling.' This is a pattern that tiles the plane aperiodically — without repeating. What was the relevance of this to physics?", choices: ["Penrose tilings became the basis of a new type of crystal structure discovered experimentally by Dan Shechtman in 1982 and recognized by the Nobel Prize in Chemistry in 2011", "Penrose tilings were used to model the quantum foam structure of spacetime at the Planck scale", "Penrose tilings provided the mathematical basis for the lattice structures used in lattice QCD calculations of quark confinement"], correct: 1 },
  { question: "The physicist Roger Penrose won the Nobel Prize in Physics in 2020 for proving that black holes form necessarily from general relativity. He shared the prize with Reinhard Genzel and Andrea Ghez for observations of the Milky Way center. Penrose's specific contribution was the singularity theorem of what year?", choices: ["1963", "1965", "1970"], correct: 1 },
  { question: "The physicist Roger Penrose's singularity theorem proved that singularities are inevitable in gravitational collapse under certain conditions. His theorem assumed what about energy?", choices: ["That energy density is always positive — the 'weak energy condition'", "That the strong energy condition holds — that gravity is always attractive, meaning the focusing of geodesics leads inevitably to a conjugate point", "That no negative energy states exist — ruling out quantum field theoretic effects that could violate the theorem"], correct: 2 },
  { question: "The physicist Rosalyn Yalow developed the radioimmunoassay (RIA) technique and won the Nobel Prize in Physiology or Medicine in 1977. What did RIA use radioactive isotopes to do?", choices: ["Measure extremely small concentrations of biological molecules by using radioactively labeled antibodies", "Image internal organs by injecting radioactive tracers and scanning the body", "Treat cancer by delivering radioactive isotopes directly to tumor cells via antibody carriers"], correct: 0 },
  { question: "The physicist Rosalyn Yalow, who won the Nobel for radioimmunoassay (RIA), developed the technique to study what specific hormone that launched the work?", choices: ["Thyroid stimulating hormone", "Insulin", "Cortisol"], correct: 1 },
  { question: "The physicist Rudolf Peierls worked at the University of Birmingham in Britain from 1937. He organized the British nuclear weapons effort after the war at Harwell, then took a chair at Oxford. His Birmingham colleague Klaus Fuchs was there before going to Los Alamos. Fuchs's role in Birmingham before Los Alamos was what?", choices: ["He ran the experimental nuclear physics group", "He performed the theoretical calculations for the gaseous diffusion separation process for the British 'Tube Alloys' nuclear program", "He supervised British radar development as a side project while working on nuclear theory"], correct: 1 },
  { question: "The physicist Rudolf Peierls, after Birmingham, became Wykeham Professor of Physics at what university?", choices: ["Cambridge University", "Oxford University", "Imperial College London"], correct: 1 },
  { question: "The physicist Rudolf Peierls, after retirement from Birmingham, wrote a memoir called what?", choices: ["'Atomic Physics: A Personal History'", "'Bird of Passage: Recollections of a Physicist'", "'The Road from Birmingham: A Physicist's Memoir'"], correct: 1 },
  { question: "The physicist Rudolf Peierls's key contribution to the Frisch-Peierls Memorandum was calculating that the critical mass of U-235 was much smaller than previously thought. What was Peierls's specific physical insight?", choices: ["He recognized that the mean free path for fission in U-235 was much shorter at fast neutron energies than anyone had calculated", "He recognized that previous calculations had been done for natural uranium, not pure U-235, and that the fission cross section of U-235 for fast neutrons was far larger", "He showed that a reflector could reduce critical mass to essentially zero, making even milligrams of U-235 potentially useful"], correct: 2 },
  { question: "The physicist Samuel Allison directed the Metallurgical Laboratory after Arthur Compton moved to administrative roles. He is described in many accounts as providing the dramatic countdown to Trinity. What was he doing in his regular scientific work?", choices: ["He was running Chicago's CP-3 heavy water reactor experiments", "He was directing research on X-ray spectroscopy of heavy elements at Chicago", "He was coordinating the theoretical physics division at the Met Lab"], correct: 1 },
  { question: "The physicist Samuel Allison led the countdown to the Trinity explosion that was broadcast over the radio to all observers. Immediately after the explosion, physicist Emilio Segrè reportedly said what?", choices: ["'I'm glad this works. Now we can end this war'", "'The Italian navigator has just landed in the New World'", "'It worked. God help us all.'"], correct: 2 },
  { question: "The physicist Samuel Allison had earlier discovered what in X-ray spectroscopy?", choices: ["The fine-structure splitting of X-ray lines in heavy elements", "The anomalous X-ray scattering called the 'Allison effect'", "The characteristic X-ray emission lines used in X-ray fluorescence analysis"], correct: 2 },
  { question: "The physicist Samuel Allison, who counted down to Trinity, was an X-ray spectroscopist by training. What is X-ray spectroscopy used for that made physicists like Allison essential to the Manhattan Project?", choices: ["Isotope identification", "Measuring the composition of uranium and plutonium samples and detecting impurities that could affect nuclear performance", "Measuring neutron cross sections indirectly by bombarding samples with X-rays and detecting secondary reactions"], correct: 1 },
  { question: "The physicist Samuel Chao Chung Ting won the 1976 Nobel Prize in Physics for co-discovering the J/ψ meson. Ting's discovery was made simultaneously and independently at which other laboratory?", choices: ["Fermilab, by Leon Lederman's group", "SLAC, by Burton Richter's group", "CERN, by Carlo Rubbia's group"], correct: 1 },
  { question: "The physicist Samuel Goudsmit and George Uhlenbeck proposed electron spin in 1925. They submitted the paper despite Paul Ehrenfest's concerns, who reportedly told them: 'You are both young enough to afford to do something stupid.' Where were they working?", choices: ["Copenhagen", "Göttingen", "Leiden"], correct: 2 },
  { question: "The physicist Samuel Goudsmit, after the Alsos mission, wrote a book about it. What was it called?", choices: ["'Operation Alsos: The German Nuclear Program'", "'Alsos: The Failure in German Science'", "'Alsos'"], correct: 1 },
  { question: "The physicist Samuel Goudsmit, co-discoverer of electron spin, became editor of what physics journal after the war?", choices: ["Physical Review Letters", "Physical Review", "Reviews of Modern Physics"], correct: 0 },
  { question: "The physicist Samuel Goudsmit's personal motivation for the Alsos mission was partly a tragedy. His parents had died in what circumstance that he did not know about during the mission?", choices: ["They had been killed in the Allied bombing of Rotterdam in 1940", "They had been sent to and died in Auschwitz", "They had died of disease in the Netherlands during the Hunger Winter of 1944-45"], correct: 1 },
  { question: "The physicist Satyendra Nath Bose, whose statistics Einstein extended to create Bose-Einstein statistics, worked in what country throughout his entire career?", choices: ["India", "Britain", "Germany"], correct: 0 },
  { question: "The physicist Saul Perlmutter, Brian Schmidt, and Adam Riess won the Nobel Prize in Physics in 2011 for discovering that the universe's expansion is accelerating. This discovery was made by observing what?", choices: ["The cosmic microwave background temperature fluctuations", "Type Ia supernovae at high redshift", "The clustering of galaxies on large scales"], correct: 1 },
  { question: "The physicist Seth Neddermeyer first proposed implosion in spring 1943. For most of 1943, the implosion idea was seen as an interesting curiosity but not the main effort. What event caused Oppenheimer to finally commit fully to implosion as the primary approach for plutonium?", choices: ["Trinity's explosive lens test failures that proved gun assembly was the only fallback", "Segrè's measurement of Pu-240 spontaneous fission making gun-type plutonium impossible", "Von Neumann's calculation in late 1943 showing implosion could achieve 3x greater compression than believed"], correct: 1 },
  { question: "The physicist Seth Neddermeyer, the original implosion advocate, is also co-credited with discovering the muon in cosmic rays in 1936. Who was his co-discoverer on the muon?", choices: ["Bruno Rossi, who worked on cosmic ray detectors in parallel", "Carl Anderson, who discovered unusual cosmic ray tracks in a cloud chamber alongside Neddermeyer's measurements", "Arthur Compton, who directed the University of Chicago cosmic ray research program where the discovery was made"], correct: 1 },
  { question: "The physicist Seth Neddermeyer, who first proposed implosion and was initially the lead experimentalist on implosion testing, was eventually removed from leadership. Who took over the implosion lens development from Neddermeyer?", choices: ["George Kistiakowsky", "James Tuck", "Luis Alvarez"], correct: 0 },
  { question: "The physicist Sheldon Glashow proposed adding 'charm' as a fourth quark flavor in 1970 (the GIM mechanism with Iliopoulos and Maiani). Charm was discovered in the J/ψ meson in 1974. The discovery was called the 'November Revolution.' How many quark flavors are now known?", choices: ["Four", "Five", "Six"], correct: 1 },
  { question: "The physicist Sheldon Glashow proposed his electroweak model in 1961. What was missing from Glashow's version that prevented it from being a fully predictive theory?", choices: ["He didn't include the Z boson", "He didn't include a mechanism for giving mass to the W and Z bosons", "He didn't include the weak neutral current interactions"], correct: 1 },
